syntax = "proto2";

package quasar.proto;

option java_package = "ru.yandex.quasar.protobuf";
option java_outer_classname = "QuasarProto";

import "yandex_io/protos/account_storage.proto";
import "yandex_io/protos/alice_state.proto";
import "yandex_io/protos/model_objects.proto";
import "yandex_io/protos/yandex_io.proto";
import "yandex_io/protos/functional_tests.proto";
import "yandex_io/protos/remoting.proto";
import "yandex_io/sdk/private/endpoint_storage/protos/endpoint.proto";
import "yandex_io/sdk/directive_sequencer/protos/directive.proto";
import "yandex_io/capabilities/config/sync_messages/sync_messages.proto";
import "yandex_io/libs/metrica/db/protos/db_event.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

message WifiConnect {
  optional string wifi_id = 1;
  optional string password = 2;
  optional .quasar.proto.WifiType wifi_type = 3;
}

message WifiConnectResponse {
  enum Status {
    OK = 0;
    SSID_NOT_FOUND = 1;
    AUTH_ERROR = 2;
    TIMEOUT = 3;
  }

  required .quasar.proto.WifiConnectResponse.Status status = 1;
}

message MediaMessage {
  optional .quasar.proto.SearchResult recommendations = 1;
  optional .quasar.proto.SearchResult featured_new = 2;
  optional .quasar.proto.SearchResult trending = 3;
  optional .quasar.proto.SearchResult music = 17;
  optional .quasar.proto.MediaItem last_watched = 4;
  optional .quasar.proto.EmptyMessage next_screen = 5;
  optional .quasar.proto.EmptyMessage previous_screen = 6;
  optional .quasar.proto.EmptyMessage to_start = 7;
  optional .quasar.proto.EmptyMessage to_end = 8;
  optional .quasar.proto.EmptyMessage to_home_screen = 9;
  optional .quasar.proto.SearchResult show_video_list = 10;
  optional .quasar.proto.DescriptionItem show_description = 11;
  optional .quasar.proto.PaymentItem show_payment = 16;
  optional .quasar.proto.TvAnnounce show_tv_announce = 18;
  optional .quasar.proto.EmptyMessage show_bottom_sheet = 12;
  optional .quasar.proto.EmptyMessage hide_bottom_sheet = 13;
  repeated string home_screen_suggests = 14;
  optional string message_id = 15;
  optional .quasar.proto.EmptyMessage leader_lost = 19;
  optional .quasar.proto.EmptyMessage leader_connected = 20;
  optional .quasar.proto.EmptyMessage hdmi_on = 21;
  optional .quasar.proto.EmptyMessage hdmi_off = 22;
  optional .quasar.proto.EmptyMessage go_up = 23;
  optional .quasar.proto.EmptyMessage go_down = 24;
}

message AddUserRequest {
  required string auth_code = 1;
  optional .quasar.proto.AccountType account_type = 2;
  optional bool with_xtoken = 3;
}

message DeleteUserRequest {
  optional int64 id = 1;
}

message ChangeUserRequest {
  optional int64 id = 1;
}

message IssueAuthCodeRequest {
  optional int64 id = 1;
}

message IssueAuthCodeResponse {
  enum Status {
    OK = 0;
    NO_INTERNET = 1;
    WRONG_USER = 2;
  }

  optional .quasar.proto.IssueAuthCodeResponse.Status status = 1;
  optional string auth_code = 2;
}

message AuthTokenUpdateRequest {
  optional string auth_token = 1;
  optional string source = 2;
  optional bool revoke_old_token = 3;
}

message AddUserResponse {
  enum Status {
    OK = 0;
    NO_INTERNET = 4;
    CODE_EXPIRED = 5;
    CRYPTO_ERROR = 6;
    INVALID_TOKEN = 7;
  }

  required .quasar.proto.AddUserResponse.Status status = 1;
  optional string auth_token = 2;
  optional int64 id = 3;
  optional string xtoken = 6;
  optional int64 tag = 7;
}

message DeleteUserResponse {
  enum Status {
    OK = 0;
    WRONG_USER = 1;
  }

  optional .quasar.proto.DeleteUserResponse.Status status = 1;
}

message AuthEvent {
  optional string auth_token = 1;
  optional string passport_uid = 2;
  optional string xtoken = 3;
  optional int64 tag = 4;
  optional .quasar.proto.AccountType type = 5;
  optional bool is_active = 6;
}

message OwnerStartupInfo {
  reserved 5;
  optional string auth_token = 2;
  optional string passport_uid = 3;
  optional string xtoken = 4;
  optional int64 tag = 6;
}

message AllStartupInfo {
  repeated .quasar.proto.AuthEvent accounts = 1;
}

message MetricaMessage {
  reserved "config";
  reserved 2;
  reserved 4;
  reserved 5;
  reserved 7;
  reserved 18;
  message AppEnvironmentValue {
    optional string key = 1;
    optional string value = 2;
  }

  message StatsRecord {
    optional string name = 1;
    repeated uint64 counters = 2;
  }

  message Statistics {
    optional string service_name = 1;
    repeated .quasar.proto.MetricaMessage.StatsRecord data = 2;
  }

  optional string report_event = 1;
  optional string report_event_json_value = 8;
  optional string report_error = 3;
  optional string report_error_value = 12;
  optional string metrica_uuid = 6;
  optional .quasar.proto.MetricaMessage.AppEnvironmentValue app_environment_value = 9;
  optional string delete_environment_key = 11;
  optional uint64 flags = 13;
  optional .quasar.proto.NetworkStatus network_status = 14;
  optional .quasar.proto.Location location = 16;
  optional .quasar.proto.Timezone timezone = 17;
  optional .quasar.proto.MetricaMessage.Statistics stats = 19;
  optional .quasar.proto.EmptyMessage flush = 20;
  optional string sync_uuid = 21;
  optional .quasar.proto.EmptyMessage clock_synchronized = 22;
  optional bool need_network_status = 23;
  optional bool is_listening = 24;
  optional .google.protobuf.Timestamp timestamp = 25;
  optional string passport_uid = 26;
}

message RecordingEvent {
  optional string phrase = 1;
  optional string speaker_id = 2;
  optional string phrase_id = 3;
  optional int32 seat_number = 9;
  optional .quasar.proto.EmptyMessage pause = 4;
  optional .quasar.proto.EmptyMessage resume = 5;
  optional string error = 6;
  optional string device_id = 7;
  optional bytes audio_data = 8;
  optional bool child = 10 [default = false];
  optional int64 timestamp_ms = 11;
}

message PhraseEndEvent {
  optional bool success = 1 [default = false];
  optional int64 timestamp_ms = 2;
}

message UpdateProgress {
  optional double downloaded_percent = 1;
}

message ExternalCommandResponse {
  required bool processed = 1;
}

message VinsCallResponse {
  reserved 1;
  reserved 3;
  enum Status {
    OK = 0;
    ERROR = 1;
  }

  optional string vins_response = 7;
  optional .quasar.proto.VinsCallResponse.Status status = 2;
  optional string error_code = 4;
  optional string error_text = 5;
  optional string error_text_lang = 6;
}

message LeaderOverride {
  reserved 1;
  reserved 2;
  reserved 3;
  optional .quasar.proto.MusicStateOverride music_state_override = 4;
  optional .quasar.proto.RadioStateOverride radio_state_override = 5;
}

message MusicStateOverride {
  reserved 8;
  optional bool is_paused = 1;
  optional double progress = 2;
  optional double duration = 3;
  optional string title = 4;
  optional string artists = 5;
  optional string cover_uri = 6;
  optional .quasar.proto.AppState.MusicState.TrackType next_track_type = 7;
  optional .quasar.proto.Audio.Screen screen_type = 9;
  optional string provider_name = 10;
}

message RadioStateOverride {
  optional bool is_paused = 1;
  optional string title = 2;
  optional string cover_uri = 3;
  optional string color = 4;
}

message SimplePlayerState {
  message TrackInfo {
    optional string id = 1;
    optional string type = 2;
  }

  message EntityInfo {
    optional string id = 1;
    optional string type = 2;
    optional string description = 3;
    optional .quasar.proto.SimplePlayerState.TrackInfo prev = 4;
    optional .quasar.proto.SimplePlayerState.TrackInfo next = 5;
    optional bool shuffled = 6;
    optional string repeat_mode = 7;
  }

  enum PlayerType {
    UNKNOWN = 0;
    MUSIC = 1;
    RADIO = 2;
    BLUETOOTH = 3;
    VIDEO = 4;
  }

  optional bool has_pause = 1;
  optional bool has_play = 2;
  optional bool has_next = 3;
  optional bool has_prev = 4;
  optional int64 position_time_point = 22;
  optional double position = 5;
  optional double duration = 6;
  optional string title = 7;
  optional string subtitle = 8;
  optional bool has_progress_bar = 9;
  optional bool has_like = 11;
  optional bool has_dislike = 12;
  optional bool show_player = 13;
  optional string live_stream_text = 14;
  optional string id = 15;
  optional string type = 16;
  optional string player_name = 17;
  optional .quasar.proto.SimplePlayerState.EntityInfo entity_info = 18;
  optional string provider_name = 19;
  optional bool hide_progress_bar = 20;
  optional .quasar.proto.SimplePlayerState.PlayerType player_type = 21;
  optional string playback_starter_user_id = 23;
  optional string current_screen = 24;
  map<string, string> extra = 100;
}

message MordoviaShowMessage {
  reserved 3;
  optional string url = 1;
  optional bool is_full_screen = 2;
  optional string splash_div = 4;
  optional string server_callback_prototype = 5;
  optional string view_key = 6;
  optional string scenario_name = 7;
  optional bool go_back = 8;
  optional string vins_request_id = 9;
}

message MordoviaCommandMessage {
  reserved 3;
  optional string command = 1;
  optional string meta = 2;
  optional string view_key = 4;
  optional string scenario_name = 5;
  optional string vins_request_id = 6;
}

message SetupRcuAutoEvent {
  optional string tv_model = 1;
}

message LogMessage {
  message Source {
    optional string filename = 1;
    optional int32 line = 2;
    optional string funcname = 3;
    optional string path = 4;
  }

  enum Level {
    TRACE = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
  }

  optional .quasar.proto.LogMessage.Level level = 1;
  optional int64 timestamp_ms = 2;
  optional .quasar.proto.LogMessage.Source source = 3;
  optional string msg = 4;
  optional string device_id = 5;
  optional string platform = 6;
}

message NsdEnable {
  optional uint32 server_port = 1;
  optional .quasar.proto.GlagolDiscoveryItem.GroupRole stereopair = 2;
  optional .quasar.proto.GlagolDiscoveryItem.GroupRole tandem = 3;
  optional bool guest_mode = 4;
  optional bool discovered_request = 5;
}

message BrickState {
  optional .quasar.proto.BrickStatus brick_status = 1;
  optional string disabled_reason = 2;
}

message NetworkStatsCommand {
  message DumpNetStatus {
  }

  optional .quasar.proto.NetworkStatsCommand.DumpNetStatus dump_net_status = 1;
  optional .quasar.proto.EmptyMessage get_arps = 2;
}

message NetworkStats {
  message Arp {
    optional string ip = 1;
    optional string mac = 2;
    optional .quasar.proto.NetworkStats.ArpState state = 3;
  }

  message NetDevice {
    optional string name = 1;
    optional string mac = 2;
    optional bool running = 3;
    repeated string addresses = 4;
    optional uint64 ms_in_state = 5;
    repeated .quasar.proto.NetworkStats.Arp arps = 6;
  }

  enum ArpState {
    INCOMPLETE = 0;
    REACHABLE = 1;
    STALE = 2;
    DELAY = 3;
    PROBE = 4;
    FAILED = 5;
    NOARP = 6;
    UNKNOWN = 7;
  }

  repeated .quasar.proto.NetworkStats.NetDevice devices = 1;
  optional .quasar.proto.EmptyMessage with_arps = 2;
}

message UpdateHealthCheck {
  message UpdateHealthCheckStatus {
    message RssStatuses {
      enum Status {
        UNKNOWN = 0;
        OK = 1;
        EXCEEDED = 2;
      }

      map<string, .quasar.proto.UpdateHealthCheck.UpdateHealthCheckStatus.RssStatuses.Status> statuses = 1;
    }

    message MinidumpInfos {
      map<string, string> infos = 1;
    }

    optional bool is_alice_connected = 1;
    optional bool is_mic_audio_detected = 2;
    optional .quasar.proto.UpdateHealthCheck.UpdateHealthCheckStatus.RssStatuses rss_statuses = 3;
    optional bool spotter_started = 4;
    optional .quasar.proto.UpdateHealthCheck.UpdateHealthCheckStatus.MinidumpInfos minidump_infos = 5;
  }

  optional bool failed = 1;
  optional .quasar.proto.UpdateHealthCheck.UpdateHealthCheckStatus status = 2;
}

message RssStatus {
  optional string daemon = 1;
  optional bool is_ok = 2;
}

message MinidumpStatus {
  optional string daemon = 1;
  optional string info = 2;
}

message ForceCheckUpdates {
  optional uint64 timeout_seconds = 1;
}

message EqualizerParameters {
  optional string json_data = 1;
  optional string config_hash = 2;
}

message ConfigurationStateHolder {
  optional .quasar.proto.ConfigurationState state = 1;
}

message OnMediaErrorHolder {
  optional .quasar.proto.MediaContentType media_content_type = 1;
}

message LogMessages {
  repeated .quasar.proto.LogMessage log_messages = 1;
  optional uint64 batch_id = 2;
}

