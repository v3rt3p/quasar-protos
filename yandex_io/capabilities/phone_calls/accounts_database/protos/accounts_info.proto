syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.yandex_io.capabilities.phone_calls.accounts_database.protos";
option java_outer_classname = "AccountInfo";

import "alice/protos/endpoint/capabilities/phone_calls/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAccountInfo {
  reserved "CredentialsKey";
  reserved 1;
  .NAlice.TPhoneCallsCapability.TCredentials Credentials = 2 [json_name = "credentials"];
  .NAlice.TPhoneCallsCapability.ELifetimePolicy LifetimePolicy = 3 [json_name = "lifetime_policy"];
  string AccountId = 4 [json_name = "account_id"];
  .NAlice.TPhoneCallsCapability.ETelephoneServiceProvider Provider = 5 [json_name = "provider"];
}

message TAccountsInfo {
  repeated .NAlice.TAccountInfo AccountsInfo = 1 [json_name = "accounts_info"];
}

