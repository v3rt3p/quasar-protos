syntax = "proto3";

package proto;

option go_package = "a.yandex-team.ru/smart_devices/libs/zigbee/model/proto;zigbeemodelpb";

import "smart_devices/libs/zigbee/model/proto/device.proto";

message ServerContainer {
  enum NetworkType {
    UNKNOWN = 0;
    PLAIN = 1;
    DEVICE_KEY_ENCRYPTED = 2;
  }

  .proto.ServerContainer.NetworkType network_type = 1;
  bytes network_data = 2;
  map<string, .proto.ZigbeeDevice> devices = 3;
}

