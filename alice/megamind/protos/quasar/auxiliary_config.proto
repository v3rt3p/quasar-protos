syntax = "proto3";

package NAlice.NQuasarAuxiliaryConfig;

option java_package = "ru.yandex.alice.megamind.protos.quasar";
option java_outer_classname = "AuxiliaryConfig";
option go_package = "a.yandex-team.ru/alice/megamind/protos/quasar";

import "alice/library/yt/extensions/alice_options.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAuxiliaryConfig {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TAlice4BusinessConfig {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    message TInfoConciergeConfig {
      bool InfoConciergeEnabled = 1 [json_name = "info_concierge_enabled", (.NYT.column_name) = "info_concierge_enabled"];
      bool ConnectWifiIntentEnabled = 2 [json_name = "connect_wifi_intent_enabled", (.NYT.column_name) = "connect_wifi_intent_enabled"];
      bool InformationAboutBreakfastIntentEnabled = 3 [json_name = "information_about_breakfast_intent_enabled", (.NYT.column_name) = "information_about_breakfast_intent_enabled"];
      bool InformationAboutHotelIntentEnabled = 4 [json_name = "information_about_hotel_intent_enabled", (.NYT.column_name) = "information_about_hotel_intent_enabled"];
      bool RequestAmenitiesIntentEnabled = 5 [json_name = "request_amenities_intent_enabled", (.NYT.column_name) = "request_amenities_intent_enabled"];
      bool CallReceptionIntentEnabled = 6 [json_name = "call_reception_intent_enabled", (.NYT.column_name) = "call_reception_intent_enabled"];
    }

    message THouseholdLocationConfig {
      double Latitude = 1 [json_name = "latitude", (.NYT.column_name) = "latitude"];
      double Longitude = 2 [json_name = "longitude", (.NYT.column_name) = "longitude"];
      string Address = 3 [json_name = "address", (.NYT.column_name) = "address", (.NAliceYT.PrivateGroup) = PrivateGroupLevel1];
      string ShortAddress = 4 [json_name = "short_address", (.NYT.column_name) = "short_address", (.NAliceYT.PrivateGroup) = PrivateGroupLevel1];
    }

    message THouseholdConfig {
      string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
      string Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
      .NAlice.NQuasarAuxiliaryConfig.TAuxiliaryConfig.TAlice4BusinessConfig.THouseholdLocationConfig Location = 3 [json_name = "location", (.NYT.column_name) = "location"];
    }

    int32 MaxVolume = 1 [json_name = "max_volume", (.NYT.column_name) = "max_volume"];
    uint64 SmartHomeUid = 2 [json_name = "smart_home_uid", (.NYT.column_name) = "smart_home_uid"];
    repeated string PreactivatedSkillIds = 3 [json_name = "preactivated_skill_ids", (.NYT.column_name) = "preactivated_skill_ids"];
    bool Unlocked = 4 [json_name = "unlocked", (.NYT.column_name) = "unlocked"];
    .NAlice.NQuasarAuxiliaryConfig.TAuxiliaryConfig.TAlice4BusinessConfig.TInfoConciergeConfig InfoConcierge = 5 [json_name = "info_concierge", (.NYT.column_name) = "info_concierge"];
    .NAlice.NQuasarAuxiliaryConfig.TAuxiliaryConfig.TAlice4BusinessConfig.THouseholdConfig Household = 6 [json_name = "household", (.NYT.column_name) = "household"];
    string OrganizationId = 7 [json_name = "organization_id", (.NYT.column_name) = "organization_id"];
    string OrganizationName = 8 [json_name = "organization_name", (.NYT.column_name) = "organization_name"];
  }

  .NAlice.NQuasarAuxiliaryConfig.TAuxiliaryConfig.TAlice4BusinessConfig Alice4Business = 1 [json_name = "alice4business", (.NYT.column_name) = "alice4business"];
}

