syntax = "proto2";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.common";
option java_outer_classname = "Events";
option go_package = "a.yandex-team.ru/alice/megamind/protos/common";

import "alice/library/censor/protos/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/protos/api/files/image_crop.proto";
import "google/protobuf/struct.proto";

message TFileDescription {
  optional string Guid = 1 [json_name = "guid"];
  optional .NAlice.TImageCrop ImageCrop = 2 [json_name = "image_crop"];
}

message TAsrResult {
  message TWord {
    optional string Value = 1 [json_name = "value"];
    optional double Confidence = 2 [json_name = "confidence"];
  }

  message TAccentInfo {
    repeated string Words = 1 [json_name = "words"];
  }

  optional string Utterance = 1 [json_name = "utterance"];
  optional double Confidence = 2 [json_name = "confidence"];
  repeated .NAlice.TAsrResult.TWord Words = 3 [json_name = "words"];
  optional string Normalized = 4 [json_name = "normalized"];
  optional .NAlice.TAsrResult.TAccentInfo AccentInfo = 5 [json_name = "accent_info"];
}

message TPreEouInfo {
  optional float Confidence = 1 [json_name = "confidence"];
}

message TImageInputData {
  optional string ImgUrl = 1 [json_name = "img_url"];
}

message TMusicResult {
  message TData {
    reserved 2;
    optional .google.protobuf.Struct Match = 1 [json_name = "match"];
    optional string RecognitionId = 3 [json_name = "recognitionId"];
    optional string Engine = 4 [json_name = "engine"];
    optional string Url = 5 [json_name = "url"];
  }

  optional .NAlice.TMusicResult.TData Data = 1 [json_name = "data"];
  optional string Result = 2 [json_name = "result"];
  optional string ErrorText = 3 [json_name = "error_text"];
}

message TBiometryScoring {
  message TScore {
    optional string UserId = 1 [json_name = "user_id"];
    optional double Score = 2 [json_name = "score"];
  }

  message TScoreWithMode {
    optional string Mode = 1 [json_name = "mode"];
    repeated .NAlice.TBiometryScoring.TScore Scores = 2 [json_name = "scores"];
  }

  repeated .NAlice.TBiometryScoring.TScore Scores = 1 [json_name = "scores"];
  repeated .NAlice.TBiometryScoring.TScoreWithMode ScoresWithMode = 2 [json_name = "scores_with_mode"];
  optional string Status = 3 [json_name = "status"];
  optional string RequestId = 4 [json_name = "request_id"];
  optional string GroupId = 5 [json_name = "group_id"];
  optional int64 PartialNumber = 6 [json_name = "partial_number"];
}

message TBiometryClassification {
  message TClassificationResult {
    optional string ClassName = 1 [json_name = "classname"];
    optional double Confidence = 2 [json_name = "confidence"];
    optional string Tag = 3 [json_name = "tag"];
  }

  message TClassificationSimple {
    optional string ClassName = 1 [json_name = "classname"];
    optional string Tag = 2 [json_name = "tag"];
    optional .NAlice.TBiometryClassification.EConfidence Confidence = 3 [json_name = "confidence"];
  }

  enum EConfidence {
    low = 0;
    high = 1;
  }

  optional string Status = 1 [json_name = "status"];
  repeated .NAlice.TBiometryClassification.TClassificationResult Scores = 2 [json_name = "scores"];
  repeated .NAlice.TBiometryClassification.TClassificationSimple Simple = 3 [json_name = "simple"];
  optional int64 PartialNumber = 4 [json_name = "partial_number"];
}

message TFilesInput {
  repeated .NAlice.TFileDescription Files = 1 [json_name = "files"];
}

message TEvent {
  optional .NAlice.EEventType Type = 1 [json_name = "type"];
  optional uint32 HypothesisNumber = 2 [json_name = "hypothesis_number"];
  optional bool EndOfUtterance = 3 [json_name = "end_of_utterance"];
  repeated .NAlice.TAsrResult AsrResult = 4 [json_name = "asr_result"];
  optional uint32 OriginalZeroAsrHypothesisIndex = 15 [json_name = "original_zero_asr_hypothesis_index"];
  optional string Text = 5 [json_name = "text"];
  optional .NAlice.TImageInputData Data = 6 [json_name = "data"];
  optional .NAlice.TMusicResult MusicResult = 7 [json_name = "music_result"];
  optional string Name = 9 [json_name = "name"];
  optional bool IgnoreAnswer = 10 [json_name = "ignore_answer"];
  optional .NAlice.TBiometryScoring BiometryScoring = 11 [json_name = "biometry_scoring"];
  optional .NAlice.TBiometryClassification BiometryClassification = 12 [json_name = "biometry_classification"];
  optional bool IsWarmUp = 13 [json_name = "is_warmup"];
  optional string AsrCoreDebug = 14 [json_name = "asr_core_debug"];
  optional bool AsrWhisper = 16 [json_name = "asr_whisper"];
  optional uint64 AsrDurationProcessedAudio = 17 [json_name = "asr_duration_processed_audio"];
  optional string HybridAsrPartial = 18 [json_name = "hybrid_asr_partial"];
  optional bool SaveToHistory = 20 [default = true, json_name = "save_to_history"];
  repeated .NAlice.TFileDescription AttachedFiles = 21 [json_name = "attached_files"];
  optional .NAlice.TFilesInput FilesInput = 22 [json_name = "files_input"];
  optional .NAlice.TPreEouInfo PreEouInfo = 23 [json_name = "pre_eou_info"];
  oneof PayloadType {
    .google.protobuf.Struct Payload = 8 [json_name = "payload"];
    bytes PayloadRaw = 24 [json_name = "payload_raw"];
  }
}

enum EEventType {
  voice_input = 1;
  text_input = 2;
  suggested_input = 3;
  image_input = 4;
  music_input = 5;
  server_action = 6;
  hybrid_asr_partial_result = 7;
  file_input = 8;
  speech_input = 9;
}

