syntax = "proto2";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.common";
option java_outer_classname = "LocationProto";
option go_package = "a.yandex-team.ru/alice/megamind/protos/common";

import "yt/yt_proto/yt/formats/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";

message TLocation {
  optional double Lat = 1 [json_name = "lat"];
  optional double Lon = 2 [json_name = "lon"];
  optional double Accuracy = 3 [json_name = "accuracy"];
  optional double Recency = 4 [json_name = "recency"];
  optional double Speed = 5 [json_name = "speed"];
}

message TFavouriteLocation {
  optional double Lat = 1 [json_name = "lat"];
  optional double Lon = 2 [json_name = "lon"];
  optional string Title = 3 [json_name = "title"];
  optional string SubTitle = 4 [json_name = "subtitle"];
}

