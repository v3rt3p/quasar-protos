syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.common";
option java_outer_classname = "IoTClientUserInfo";
option go_package = "a.yandex-team.ru/alice/megamind/protos/common";

import "alice/protos/data/device/info.proto";
import "alice/protos/data/location/group.proto";
import "alice/protos/data/location/room.proto";
import "alice/protos/endpoint/aggregate.proto";
import "alice/protos/endpoint/endpoint.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIoTClientUserInfo {
  message TDevice {
    reserved "ForceServerInteraction";
    reserved 34;
    string Id = 1 [json_name = "id"];
    string Name = 2 [json_name = "name"];
    repeated string Aliases = 3 [json_name = "aliases"];
    .NAlice.EUserDeviceType Type = 4 [json_name = "type"];
    string ExternalId = 6 [json_name = "external_id"];
    string SkillId = 8 [json_name = "skill_id"];
    string RoomId = 9 [json_name = "room_id"];
    repeated string GroupIds = 10 [json_name = "group_ids"];
    .NAlice.TUserDeviceInfo DeviceInfo = 13 [json_name = "device_info"];
    string HouseholdId = 18 [json_name = "household_id"];
    .NAlice.TDeviceStatusInfo StatusInfo = 29 [json_name = "status_info"];
    .NAlice.TEndpoint Endpoint = 30 [json_name = "endpoint"];
    .NAlice.TDeviceRenderInfo RenderInfo = 33 [json_name = "render_info"];
  }

  message THousehold {
    string Id = 1 [json_name = "id"];
    string Name = 2 [json_name = "name"];
    .NAlice.TUserSharingInfo SharingInfo = 6 [json_name = "sharing_info"];
  }

  message TScenario {
    string Id = 1 [json_name = "id"];
    string Name = 2 [json_name = "name"];
    string Icon = 3 [json_name = "icon"];
  }

  repeated .NAlice.TUserRoom Rooms = 1 [json_name = "rooms"];
  repeated .NAlice.TUserGroup Groups = 2 [json_name = "groups"];
  repeated .NAlice.TIoTClientUserInfo.TDevice Devices = 3 [json_name = "devices"];
  repeated .NAlice.TIoTClientUserInfo.THousehold Households = 4 [json_name = "households"];
  repeated .NAlice.TAggregate Aggregates = 5 [json_name = "aggregates"];
  repeated .NAlice.TIoTClientUserInfo.TScenario Scenarios = 6 [json_name = "scenarios"];
}

