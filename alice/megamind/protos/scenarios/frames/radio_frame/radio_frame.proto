syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.scenarios.frames.radio_frame";
option java_outer_classname = "FrameRadio";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/megamind/protos/scenarios/frames/radio_frame;radioframe";

import "alice/megamind/protos/scenarios/frames/common/common.proto";
import "alice/protos/data/fm_radio_info.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TFmRadioStationSlot {
  oneof Value {
    string FmRadioValue = 1 [json_name = "fm_radio_value"];
    string FmRadioCustomValue = 2 [json_name = "fm_radio_custom_value"];
  }
}

message TFmRadioFreqSlot {
  oneof Value {
    string FmRadioFreqValue = 1 [json_name = "fm_radio_freq_value"];
    string FmRadioFreqCustomValue = 2 [json_name = "fm_radio_freq_custom_value"];
  }
}

message TFmRadioInfoSlot {
  oneof Value {
    .NAlice.NData.TFmRadioInfo FmRadioInfoValue = 1 [json_name = "fm_radio_info_value"];
  }
}

message TFmRadioPlaybackSourceSlot {
  enum EValue {
    Unknown = 0;
    AliceShow = 1;
  }

  oneof Value {
    .NAlice.TFmRadioPlaybackSourceSlot.EValue EnumValue = 1 [json_name = "enum_value"];
  }
}

message TRadioPlaySemanticFrame {
  .NAlice.TFmRadioStationSlot FmRadioStation = 1 [json_name = "fm_radio"];
  .NAlice.TFmRadioFreqSlot FmRadioFreq = 2 [json_name = "fm_radio_freq"];
  .NAlice.TFmRadioInfoSlot FmRadioInfo = 3 [json_name = "fm_radio_info"];
  .NAlice.TBoolSlot DisableNlg = 4 [json_name = "disable_nlg"];
}

message TFmRadioPlaySemanticFrame {
  .NAlice.TFmRadioStationSlot FmRadioStation = 1 [json_name = "fm_radio"];
  .NAlice.TFmRadioFreqSlot FmRadioFreq = 2 [json_name = "fm_radio_freq"];
  .NAlice.TBoolSlot DisableNlg = 3 [json_name = "disable_nlg"];
  .NAlice.TFmRadioPlaybackSourceSlot PlaybackSource = 4 [json_name = "playback_source"];
}

