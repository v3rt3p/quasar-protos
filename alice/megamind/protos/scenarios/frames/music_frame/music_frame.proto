    string NoveltyValue = 5 [json_name = "novelty_value", (.NYT.column_name) = "novelty_value", (.NAlice.SlotType) = "novelty"];
    string PersonalityValue = 6 [json_name = "personality_value", (.NYT.column_name) = "personality_value", (.NAlice.SlotType) = "personality"];
