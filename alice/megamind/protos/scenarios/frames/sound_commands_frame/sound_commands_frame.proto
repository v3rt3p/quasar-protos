    float PercentLevelValue = 3 [json_name = "percent_level_value", (.NYT.column_name) = "percent_level_value", (.NAlice.SlotType) = "sys.percent_value"];
  }
}

message TSoundDegreeChangeSlot {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  oneof Value {
    option (.NYT.variant_field_name) = "value";
    string DegreeValue = 1 [json_name = "degree_value", (.NYT.column_name) = "degree_value", (.NAlice.SlotType) = "custom.degree"];
  }
}

message TSoundLouderSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.sound.louder";
  .NAlice.TBoolSlot RepeatInterruptedPhrase = 1 [json_name = "repeat_interrupted_phrase", (.NYT.column_name) = "repeat_interrupted_phrase", (.NAlice.SlotName) = "repeat_interrupted_phrase"];
  .NAlice.TSoundAbsoluteChangeSlot AbsoluteChange = 2 [json_name = "absolute_change", (.NYT.column_name) = "absolute_change", (.NAlice.SlotName) = "absolute_change"];
  .NAlice.TSoundRelativeChangeSlot RelativeChange = 3 [json_name = "relative_change", (.NYT.column_name) = "relative_change", (.NAlice.SlotName) = "relative_change"];
  .NAlice.TSoundPercentageChangeSlot PercentageChange = 4 [json_name = "percentage_change", (.NYT.column_name) = "percentage_change", (.NAlice.SlotName) = "percentage_change"];
  .NAlice.TSoundDegreeChangeSlot DegreeChange = 5 [json_name = "degree_change", (.NYT.column_name) = "degree_change", (.NAlice.SlotName) = "degree_change"];
}

message TSoundQuiterSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.sound.quiter";
  .NAlice.TBoolSlot RepeatInterruptedPhrase = 1 [json_name = "repeat_interrupted_phrase", (.NYT.column_name) = "repeat_interrupted_phrase", (.NAlice.SlotName) = "repeat_interrupted_phrase"];
  .NAlice.TSoundAbsoluteChangeSlot AbsoluteChange = 2 [json_name = "absolute_change", (.NYT.column_name) = "absolute_change", (.NAlice.SlotName) = "absolute_change"];
  .NAlice.TSoundRelativeChangeSlot RelativeChange = 3 [json_name = "relative_change", (.NYT.column_name) = "relative_change", (.NAlice.SlotName) = "relative_change"];
  .NAlice.TSoundPercentageChangeSlot PercentageChange = 4 [json_name = "percentage_change", (.NYT.column_name) = "percentage_change", (.NAlice.SlotName) = "percentage_change"];
  .NAlice.TSoundDegreeChangeSlot DegreeChange = 5 [json_name = "degree_change", (.NYT.column_name) = "degree_change", (.NAlice.SlotName) = "degree_change"];
}

message TSoundMuteSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.sound.mute";
}

message TSoundUnmuteSemanticFrame {
