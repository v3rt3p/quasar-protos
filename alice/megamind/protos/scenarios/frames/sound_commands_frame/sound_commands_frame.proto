syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.scenarios.frames.sound_commands_frame";
option java_outer_classname = "FrameSoundCommands";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/megamind/protos/scenarios/frames/sound_commands_frame;soundcommandsframe";

import "alice/megamind/protos/scenarios/frames/common/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSoundAbsoluteChangeSlot {
  oneof Value {
    int32 NumLevelValue = 1 [json_name = "num_level_value"];
    float FloatLevelValue = 2 [json_name = "float_level_value"];
    string CustomLevelValue = 3 [json_name = "custom_level_value"];
  }
}

message TSoundRelativeChangeSlot {
  oneof Value {
    int32 NumLevelValue = 1 [json_name = "num_level_value"];
    float FloatLevelValue = 2 [json_name = "float_level_value"];
  }
}

message TSoundPercentageChangeSlot {
  oneof Value {
    int32 NumLevelValue = 1 [json_name = "num_level_value"];
    float FloatLevelValue = 2 [json_name = "float_level_value"];
    float PercentLevelValue = 3 [json_name = "percent_level_value"];
  }
}

message TSoundDegreeChangeSlot {
  oneof Value {
    string DegreeValue = 1 [json_name = "degree_value"];
  }
}

message TSoundLouderSemanticFrame {
  .NAlice.TBoolSlot RepeatInterruptedPhrase = 1 [json_name = "repeat_interrupted_phrase"];
  .NAlice.TSoundAbsoluteChangeSlot AbsoluteChange = 2 [json_name = "absolute_change"];
  .NAlice.TSoundRelativeChangeSlot RelativeChange = 3 [json_name = "relative_change"];
  .NAlice.TSoundPercentageChangeSlot PercentageChange = 4 [json_name = "percentage_change"];
  .NAlice.TSoundDegreeChangeSlot DegreeChange = 5 [json_name = "degree_change"];
}

message TSoundQuiterSemanticFrame {
  .NAlice.TBoolSlot RepeatInterruptedPhrase = 1 [json_name = "repeat_interrupted_phrase"];
  .NAlice.TSoundAbsoluteChangeSlot AbsoluteChange = 2 [json_name = "absolute_change"];
  .NAlice.TSoundRelativeChangeSlot RelativeChange = 3 [json_name = "relative_change"];
  .NAlice.TSoundPercentageChangeSlot PercentageChange = 4 [json_name = "percentage_change"];
  .NAlice.TSoundDegreeChangeSlot DegreeChange = 5 [json_name = "degree_change"];
}

message TSoundMuteSemanticFrame {
}

message TSoundUnmuteSemanticFrame {
}

message TSoundLevelSlot {
  oneof Value {
    int32 NumLevelValue = 1 [json_name = "num_level_value"];
    float FloatLevelValue = 2 [json_name = "float_level_value"];
    string CustomLevelValue = 3 [json_name = "custom_level_value"];
    string CustomVolumeSettings = 4 [json_name = "custom_volume_settings"];
    float PercentLevelValue = 5 [json_name = "percent_level_value"];
  }
}

message TSoundSetLevelSemanticFrame {
  .NAlice.TSoundLevelSlot Level = 1 [json_name = "level"];
  .NAlice.TSysNumSlot Denominator = 2 [json_name = "denominator"];
}

