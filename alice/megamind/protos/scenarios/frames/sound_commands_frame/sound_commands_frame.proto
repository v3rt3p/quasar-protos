    float FloatLevelValue = 2 [json_name = "float_level_value", (.NYT.column_name) = "float_level_value", (.NAlice.SlotType) = "sys.float"];
    string CustomLevelValue = 3 [json_name = "custom_level_value", (.NYT.column_name) = "custom_level_value", (.NAlice.SlotType) = "custom.number"];
    string CustomVolumeSettings = 4 [json_name = "custom_volume_settings", (.NYT.column_name) = "custom_volume_settings", (.NAlice.SlotType) = "custom.volume_setting"];
    float PercentLevelValue = 5 [json_name = "percent_level_value", (.NYT.column_name) = "percent_level_value", (.NAlice.SlotType) = "sys.percent_value"];
