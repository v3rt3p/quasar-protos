message TSoundSetLevelSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.sound.set_level";
  .NAlice.TSoundLevelSlot Level = 1 [json_name = "level", (.NYT.column_name) = "level", (.NAlice.SlotName) = "level"];
  .NAlice.TSysNumSlot Denominator = 2 [json_name = "denominator", (.NYT.column_name) = "denominator", (.NAlice.SlotName) = "denominator"];
}

