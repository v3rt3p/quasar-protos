syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.scenarios.frames.sound_commands_frame";
option java_outer_classname = "FrameSoundCommands";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/megamind/protos/scenarios/frames/sound_commands_frame;soundcommandsframe";

import "alice/megamind/protos/scenarios/frames/common/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSoundAbsoluteChangeSlot {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  oneof Value {
    option (.NYT.variant_field_name) = "value";
    int32 NumLevelValue = 1 [json_name = "num_level_value", (.NYT.column_name) = "num_level_value", (.NAlice.SlotType) = "sys.num"];
    float FloatLevelValue = 2 [json_name = "float_level_value", (.NYT.column_name) = "float_level_value", (.NAlice.SlotType) = "sys.float"];
    string CustomLevelValue = 3 [json_name = "custom_level_value", (.NYT.column_name) = "custom_level_value", (.NAlice.SlotType) = "custom.number"];
  }
}

message TSoundRelativeChangeSlot {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  oneof Value {
    option (.NYT.variant_field_name) = "value";
    int32 NumLevelValue = 1 [json_name = "num_level_value", (.NYT.column_name) = "num_level_value", (.NAlice.SlotType) = "sys.num"];
    float FloatLevelValue = 2 [json_name = "float_level_value", (.NYT.column_name) = "float_level_value", (.NAlice.SlotType) = "sys.float"];
