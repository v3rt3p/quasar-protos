syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.scenarios.frames.media_frame";
option java_outer_classname = "FrameMedia";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/megamind/protos/scenarios/frames/media_frame;mediaframe";

import "alice/megamind/protos/scenarios/frames/common/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TPlayerTypeSlot {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  enum EValue {
    unknown = 0;
    music = 1;
    video = 2;
    radio = 3;
  }

  oneof Value {
    option (.NYT.variant_field_name) = "value";
    .NAlice.TPlayerTypeSlot.EValue PlayerTypeValue = 1 [json_name = "player_type_value", (.NYT.flags) = SERIALIZATION_PROTOBUF, (.NYT.column_name) = "player_type_value", (.NAlice.SlotType) = "custom.player_type"];
  }
}

message TPlayerNextTrackSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.next_track";
  .NAlice.TBoolSlot SetPause = 1 [json_name = "set_pause", (.NYT.column_name) = "set_pause", (.NAlice.SlotName) = "set_pause"];
  .NAlice.TBoolSlot DisableAnimation = 2 [json_name = "disable_animation", (.NYT.column_name) = "disable_animation", (.NAlice.SlotName) = "disable_animation"];
}

message TPlayerPrevTrackSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.previous_track";
  .NAlice.TBoolSlot SetPause = 1 [json_name = "set_pause", (.NYT.column_name) = "set_pause", (.NAlice.SlotName) = "set_pause"];
  .NAlice.TBoolSlot DisableAnimation = 2 [json_name = "disable_animation", (.NYT.column_name) = "disable_animation", (.NAlice.SlotName) = "disable_animation"];
}

message TPlayerPauseSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.pause";
  repeated .NAlice.TLocationSlot LocationRoom = 1 [json_name = "location_room", (.NYT.column_name) = "location_room", (.NAlice.SlotName) = "location_room"];
  repeated .NAlice.TLocationSlot LocationGroup = 2 [json_name = "location_group", (.NYT.column_name) = "location_group", (.NAlice.SlotName) = "location_group"];
  repeated .NAlice.TLocationSlot LocationDevice = 3 [json_name = "location_device", (.NYT.column_name) = "location_device", (.NAlice.SlotName) = "location_device"];
  .NAlice.TLocationSlot LocationEverywhere = 4 [json_name = "location_everywhere", (.NYT.column_name) = "location_everywhere", (.NAlice.SlotName) = "location_everywhere"];
  .NAlice.TBoolSlot IsOnlyAudio = 5 [json_name = "is_only_audio", (.NYT.column_name) = "is_only_audio", (.NAlice.SlotName) = "is_only_audio"];
}

message TPlayerContinueSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.continue";
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg", (.NYT.column_name) = "disable_nlg", (.NAlice.SlotName) = "disable_nlg"];
  .NAlice.TPlayerTypeSlot PlayerType = 2 [json_name = "player_type", (.NYT.column_name) = "player_type", (.NAlice.SlotName) = "player_type"];
  .NAlice.TBoolSlot DisableAnimation = 3 [json_name = "disable_animation", (.NYT.column_name) = "disable_animation", (.NAlice.SlotName) = "disable_animation"];
}

message TPlayerShuffleSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.shuffle";
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg", (.NYT.column_name) = "disable_nlg", (.NAlice.SlotName) = "disable_nlg"];
}

message TPlayerUnshuffleSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.unshuffle";
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg", (.NYT.column_name) = "disable_nlg", (.NAlice.SlotName) = "disable_nlg"];
}

message TPlayerReplaySemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.replay";
}

message TRepeatModeSlot {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  enum EValue {
    Unknown = 0;
    None = 1;
    One = 2;
    All = 3;
  }

  oneof Value {
    option (.NYT.variant_field_name) = "value";
    .NAlice.TRepeatModeSlot.EValue EnumValue = 1 [json_name = "enum_value", (.NYT.column_name) = "enum_value", (.NAlice.SlotType) = "enum_value"];
  }
}

message TPlayerRepeatSemanticFrame {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.SemanticFrameName) = "personal_assistant.scenarios.player.repeat";
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg", (.NYT.column_name) = "disable_nlg", (.NAlice.SlotName) = "disable_nlg"];
  .NAlice.TRepeatModeSlot Mode = 2 [json_name = "mode", (.NYT.column_name) = "mode", (.NAlice.SlotName) = "mode"];
}

