syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.scenarios.frames.media_frame";
option java_outer_classname = "FrameMedia";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/megamind/protos/scenarios/frames/media_frame;mediaframe";

import "alice/megamind/protos/scenarios/frames/common/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TPlayerTypeSlot {
  enum EValue {
    unknown = 0;
    music = 1;
    video = 2;
    radio = 3;
  }

  oneof Value {
    .NAlice.TPlayerTypeSlot.EValue PlayerTypeValue = 1 [json_name = "player_type_value"];
  }
}

message TPlayerNextTrackSemanticFrame {
  .NAlice.TBoolSlot SetPause = 1 [json_name = "set_pause"];
  .NAlice.TBoolSlot DisableAnimation = 2 [json_name = "disable_animation"];
}

message TPlayerPrevTrackSemanticFrame {
  .NAlice.TBoolSlot SetPause = 1 [json_name = "set_pause"];
  .NAlice.TBoolSlot DisableAnimation = 2 [json_name = "disable_animation"];
}

message TPlayerPauseSemanticFrame {
  repeated .NAlice.TLocationSlot LocationRoom = 1 [json_name = "location_room"];
  repeated .NAlice.TLocationSlot LocationGroup = 2 [json_name = "location_group"];
  repeated .NAlice.TLocationSlot LocationDevice = 3 [json_name = "location_device"];
  .NAlice.TLocationSlot LocationEverywhere = 4 [json_name = "location_everywhere"];
  .NAlice.TBoolSlot IsOnlyAudio = 5 [json_name = "is_only_audio"];
}

message TPlayerContinueSemanticFrame {
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg"];
  .NAlice.TPlayerTypeSlot PlayerType = 2 [json_name = "player_type"];
  .NAlice.TBoolSlot DisableAnimation = 3 [json_name = "disable_animation"];
}

message TPlayerShuffleSemanticFrame {
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg"];
}

message TPlayerUnshuffleSemanticFrame {
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg"];
}

message TPlayerReplaySemanticFrame {
}

message TRepeatModeSlot {
  enum EValue {
    Unknown = 0;
    None = 1;
    One = 2;
    All = 3;
  }

  oneof Value {
    .NAlice.TRepeatModeSlot.EValue EnumValue = 1 [json_name = "enum_value"];
  }
}

message TPlayerRepeatSemanticFrame {
  .NAlice.TBoolSlot DisableNlg = 1 [json_name = "disable_nlg"];
  .NAlice.TRepeatModeSlot Mode = 2 [json_name = "mode"];
}

