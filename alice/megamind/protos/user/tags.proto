syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.user";
option java_outer_classname = "UserTags";
option go_package = "a.yandex-team.ru/alice/megamind/protos/user";

import "alice/megamind/protos/guest/enrollment_headers/enrollment_headers.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TUserTags {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TOwner {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TActive {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TBiometrical {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum EOrigin {
      Unknown = 0;
      RemoteControl = 1;
      VoiceBiometry = 2;
      VideoBiometry = 3;
    }

    enum EStatus {
      NoMatch = 0;
      Match = 1;
    }

    .NAlice.TUserTags.TBiometrical.EOrigin Origin = 1 [json_name = "origin", (.NYT.column_name) = "origin"];
    .NAlice.TUserTags.TBiometrical.EStatus Status = 2 [json_name = "status", (.NYT.column_name) = "status"];
    bool IsOwnerEnrolled = 3 [json_name = "is_owner_enrolled", (.NYT.column_name) = "is_owner_enrolled"];
    .NAlice.TEnrollmentHeaders EnrollmentHeaders = 4 [json_name = "enrollment_headers", (.NYT.column_name) = "enrollment_headers"];
    string RefMessageId = 5 [json_name = "ref_message_id", (.NYT.column_name) = "ref_message_id"];
  }

  message TChild {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  .NAlice.TUserTags.TOwner Owner = 1 [json_name = "owner", (.NYT.column_name) = "owner"];
  .NAlice.TUserTags.TActive Active = 2 [json_name = "active", (.NYT.column_name) = "active"];
  .NAlice.TUserTags.TBiometrical Biometrical = 3 [json_name = "biometrical", (.NYT.column_name) = "biometrical"];
  .NAlice.TUserTags.TChild Child = 4 [json_name = "child", (.NYT.column_name) = "child"];
}

