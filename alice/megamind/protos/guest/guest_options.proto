syntax = "proto2";

package NAlice;

option java_package = "ru.yandex.alice.megamind.protos.guest";
option java_outer_classname = "GuestOptions";
option go_package = "a.yandex-team.ru/alice/megamind/protos/guest";

import "alice/library/censor/protos/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "alice/megamind/protos/common/hash_puids.proto";
import "alice/megamind/protos/guest/enrollment_headers/enrollment_headers.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TGuestOptions {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  enum EGuestOrigin {
    Unknown = 0;
    RemoteControl = 1;
    VoiceBiometry = 2;
    VideoBiometry = 3;
  }

  enum EStatus {
    NoMatch = 0;
    Match = 1;
  }

  enum EMatchConfidence {
    Undefined = 0;
    Low = 1;
    High = 2;
  }

  optional string OAuthToken = 1 [json_name = "oauth_token", (.NYT.column_name) = "oauth_token", (.NAlice.FieldAccess) = A_PRIVATE_EVENTLOG, (.NAliceYT.PrivateGroup) = PrivateGroupClose];
  optional string YandexUID = 2 [json_name = "yandex_uid", (.NYT.column_name) = "yandex_uid", (.NAliceYT.PrivateGroup) = PrivateGroupPuid];
  optional string PersId = 3 [json_name = "pers_id", (.NYT.column_name) = "pers_id"];
  optional .NAlice.TGuestOptions.EGuestOrigin GuestOrigin = 4 [json_name = "guest_origin", (.NYT.column_name) = "guest_origin"];
  optional .NAlice.TGuestOptions.EStatus Status = 5 [json_name = "status", (.NYT.column_name) = "status"];
  optional bool IsOwnerEnrolled = 6 [json_name = "is_owner_enrolled", (.NYT.column_name) = "is_owner_enrolled"];
  optional .NAlice.TEnrollmentHeaders EnrollmentHeaders = 7 [json_name = "enrollment_headers", (.NYT.column_name) = "enrollment_headers"];
  optional string RefMessageId = 8 [json_name = "ref_message_id", (.NYT.column_name) = "ref_message_id"];
  optional .NAlice.THashPuids HashPuids = 9 [json_name = "hash_puids", (.NYT.column_name) = "hash_puids"];
  optional .NAlice.TGuestOptions.EMatchConfidence MatchConfidence = 10 [json_name = "match_confidence", (.NYT.column_name) = "match_confidence"];
  optional uint32 ConfidenceLevel10 = 11 [json_name = "confidence_level_10", (.NYT.column_name) = "confidence_level_10"];
}

