syntax = "proto2";

package NAlice;

option java_package = "ru.yandex.alice.library.client.protos";
option java_outer_classname = "ClientInfoProto";
option go_package = "a.yandex-team.ru/alice/library/client/protos";

import "yt/yt_proto/yt/formats/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";

message TClientInfoProto {
  reserved "AuthToken";
  reserved 13;
  message TMediaDeviceIdentifier {
    optional string OttServiceId = 1 [json_name = "ott_service_id"];
    optional string OttServiceName = 2 [json_name = "ott_service_name"];
    optional string StrmFrom = 3 [json_name = "strm_from"];
    optional string VideoSearchClient = 4 [json_name = "video_search_client"];
    optional string ObjectResponseClient = 5 [json_name = "object_response_client"];
  }

  enum EClientType {
    Undefined = 0;
    IOSDK = 1;
    AliceKitJs = 2;
    SpeechKit = 3;
  }

  optional string AppId = 1 [json_name = "app_id"];
  optional string AppVersion = 2 [json_name = "app_version"];
  optional string OsVersion = 3 [json_name = "os_version"];
  optional string Platform = 4 [json_name = "platform"];
  optional string Uuid = 5 [json_name = "uuid"];
  optional string DeviceId = 6 [json_name = "device_id"];
  optional string Lang = 7 [json_name = "lang"];
  optional string ClientTime = 8 [json_name = "client_time"];
  optional string Timezone = 9 [json_name = "timezone"];
  optional string Epoch = 10 [json_name = "timestamp"];
  optional string DeviceModel = 11 [json_name = "device_model"];
  optional string DeviceManufacturer = 12 [json_name = "device_manufacturer"];
  optional string DeviceColor = 14 [json_name = "device_color"];
  optional string DeviceRevision = 15 [json_name = "device_revision"];
  optional string QuasmodromGroup = 16 [json_name = "quasmodrom_group"];
  optional string QuasmodromSubgroup = 17 [json_name = "quasmodrom_subgroup"];
  optional .NAlice.TClientInfoProto.TMediaDeviceIdentifier MediaDeviceIdentifier = 18 [json_name = "media_device_identifier"];
  optional string DeviceFirmware = 19 [json_name = "device_firmware"];
  optional string MetricaDeviceId = 20 [json_name = "metrica_device_id"];
  optional string WifiModel = 21 [json_name = "wifi_model"];
  optional string IntegrationType = 22 [json_name = "integration_type"];
  optional .NAlice.TClientInfoProto.EClientType ClientType = 23 [json_name = "client_type"];
  optional string Vid = 24 [json_name = "vid"];
  optional string Pid = 25 [json_name = "pid"];
  optional string FirmwareVersion = 26 [json_name = "firmware_version"];
}

