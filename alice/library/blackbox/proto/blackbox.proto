syntax = "proto3";

package NAlice;

option go_package = "a.yandex-team.ru/alice/library/blackbox/proto;blackbox";

import "alice/library/censor/protos/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBlackBoxFullUserInfoProto {
  reserved "ClientId";
  reserved 3;
  message TUserInfo {
    string Uid = 1 [json_name = "uid"];
    string Email = 2 [json_name = "email"];
    string FirstName = 3 [json_name = "firstName"];
    string LastName = 4 [json_name = "lastName"];
    string Phone = 5 [json_name = "phone"];
    bool HasYandexPlus = 6 [json_name = "hasYandexPlus"];
    bool IsStaff = 7 [json_name = "isStaff"];
    bool IsBetaTester = 8 [json_name = "isBetaTester"];
    bool HasMusicSubscription = 9 [json_name = "hasMusicSubscription"];
    repeated string Subscriptions = 10 [json_name = "subscriptions"];
    string LoginId = 11 [json_name = "login_id"];
    uint64 MusicSubscriptionRegionId = 12 [json_name = "music_subscription_region_id"];
    bool IsChildAccount = 13 [json_name = "isChildAccount"];
    bool HasBookmate = 14 [json_name = "hasBookmate"];
    bool HasAlicePro = 17 [json_name = "hasAlicePro"];
    repeated string OAuthTokenScopes = 19 [json_name = "oAuthTokenScopes"];
    bool HavePassword = 22 [json_name = "havePassword"];
    bool IsFederal = 24 [json_name = "isFederal"];
    repeated string Organizations = 25 [json_name = "organizations"];
    bool HasStandalonePinPro = 34 [json_name = "hasStandalonePinPro"];
    bool HasStandalonePinMaxi = 36 [json_name = "hasStandalonePinMaxi"];
    repeated string Porganizations = 29 [json_name = "porganizations"];
    bool IsIdentified = 38 [json_name = "isIdentified"];
    optional string MusicRestriction = 15 [json_name = "musicRestriction"];
    optional string VideoRestriction = 16 [json_name = "videoRestriction"];
    optional string StaffLogin = 18 [json_name = "staffLogin"];
    optional string AccountType = 23 [json_name = "accountType"];
    optional uint64 AliceProEndTimeSeconds = 26 [json_name = "aliceProEndTimeSeconds"];
    optional uint64 AliceDRBaseBoostEndTimeSeconds = 27 [json_name = "aliceDRBaseBoostEndTimeSeconds"];
    optional uint64 AliceLPBaseBoostEndTimeSeconds = 28 [json_name = "aliceLPBaseBoostEndTimeSeconds"];
    optional uint64 AliceNLBaseBoostEndTimeSeconds = 30 [json_name = "aliceNLBaseBoostEndTimeSeconds"];
    optional uint64 AliceFIBaseBoostEndTimeSeconds = 31 [json_name = "aliceFIBaseBoostEndTimeSeconds"];
    optional uint64 AliceCHBaseBoostEndTimeSeconds = 32 [json_name = "aliceCHBaseBoostEndTimeSeconds"];
    optional uint64 StandalonePinProEndTimeSeconds = 35 [json_name = "standalonePinProEndTimeSeconds"];
    optional uint64 StandalonePinMaxiEndTimeSeconds = 37 [json_name = "standalonePinMaxiEndTimeSeconds"];
    optional string BirthDate = 33 [json_name = "birthDate"];
  }

  message TOAuth {
    optional string ClientId = 1 [json_name = "clientId"];
    optional string DeviceId = 2 [json_name = "deviceId"];
    optional string DeviceName = 3 [json_name = "deviceName"];
    optional bool ClientIsYandex = 4 [json_name = "clientIsYandex"];
    optional string Scope = 5 [json_name = "scope"];
  }

  string UserTicket = 1 [json_name = "UserTicket"];
  .NAlice.TBlackBoxFullUserInfoProto.TOAuth OAuth = 4 [json_name = "OAuth"];
  .NAlice.ECredentialStatus Status = 5 [json_name = "status"];
  oneof OptionalUserInfo {
    .NAlice.TBlackBoxFullUserInfoProto.TUserInfo UserInfo = 2 [json_name = "UserInfo"];
  }
  optional string Error = 6 [json_name = "error"];
}

enum ECredentialStatus {
  CRED_STATUS_VALID = 0;
  CRED_STATUS_NEED_RESET = 1;
  CRED_STATUS_EXPIRED = 2;
  CRED_STATUS_NOAUTH = 3;
  CRED_STATUS_DISABLED = 4;
  CRED_STATUS_INVALID = 5;
  CRED_STATUS_NEOLITE = 6;
  CRED_STATUS_BORIGIN_MISMATCH = 7;
  CRED_STATUS_WRONG_GUARD = 8;
  CRED_STATUS_NEOLITE_SESSION = 9;
  CRED_STATUS_BORIGIN_MISMATCH_SESSION = 10;
  CRED_STATUS_UNKNOWN = 255;
}

