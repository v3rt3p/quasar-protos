syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.div";
option java_outer_classname = "Div2PatchProto";
option go_package = "a.yandex-team.ru/alice/protos/div";

import "yt/yt_proto/yt/formats/extension.proto";
import "google/protobuf/struct.proto";

message TDiv2Patch {
  message Template {
    oneof TemplateBody {
      .google.protobuf.Struct Body = 1 [json_name = "body"];
      string StringBody = 2 [json_name = "string_body"];
    }
  }

  string Templates = 4 [json_name = "templates"];
  map<string, .NAlice.TDiv2Patch.Template> GlobalTemplates = 6 [json_name = "global_templates"];
  string CardName = 2 [json_name = "card_name"];
  string CardId = 3 [json_name = "card_id"];
  oneof Div2PatchBody {
    .google.protobuf.Struct Body = 1 [json_name = "body"];
    string StringBody = 5 [json_name = "string_body"];
  }
}

