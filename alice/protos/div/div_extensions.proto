syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.div";
option java_outer_classname = "DivExtensionsProto";
option go_package = "a.yandex-team.ru/alice/protos/div";

import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TScrollableGalleryExtension {
}

message TFocusExtension {
}

message TClockTimeExtension {
}

message TExpiringViewExtension {
}

message TTextWithShadowExtension {
}

message TDivExtensions {
  .NAlice.TScrollableGalleryExtension ScrollableGalleryExtension = 1 [json_name = "scrollable_gallery_extension"];
  .NAlice.TFocusExtension FocusExtension = 2 [json_name = "focus_extension"];
  .NAlice.TClockTimeExtension ClockTimeExtension = 3 [json_name = "clock_time_extension"];
  .NAlice.TExpiringViewExtension ExpiringViewExtension = 4 [json_name = "expiring_view_extension"];
  .NAlice.TTextWithShadowExtension TextWithShadowExtension = 5 [json_name = "text_shadow_extension"];
}

