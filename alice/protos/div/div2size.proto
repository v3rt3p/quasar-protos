syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.div";
option java_outer_classname = "Div2SizeProto";
option go_package = "a.yandex-team.ru/alice/protos/div";

import "yt/yt_proto/yt/formats/extension.proto";

message TDiv2Size {
  double Width = 1 [json_name = "width"];
  double Height = 2 [json_name = "height"];
}

