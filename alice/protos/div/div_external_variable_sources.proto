message TIotOpenSensorEventExternalSource {
  option deprecated = true;
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string EndpointId = 1 [json_name = "endpoint_id", (.NYT.column_name) = "endpoint_id"];
