syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.div";
option java_outer_classname = "DivVariablesProto";
option go_package = "a.yandex-team.ru/alice/protos/div";

import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDivVariable {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  bool supportsId = 1 [json_name = "supports_id", (.NYT.column_name) = "supports_id"];
}

message TDivVariables {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  .NAlice.TDivVariable IsAudioPlaying = 1 [json_name = "is_audio_playing", (.NYT.column_name) = "is_audio_playing", (.NAlice.DivName) = "is_audio_playing"];
  .NAlice.TDivVariable IsRadioPlaying = 2 [json_name = "is_radio_playing", (.NYT.column_name) = "is_radio_playing", (.NAlice.DivName) = "is_radio_playing"];
  .NAlice.TDivVariable IsAlicePartialTextVisible = 3 [json_name = "is_alice_partial_text_visible", (.NYT.column_name) = "is_alice_partial_text_visible", (.NAlice.DivName) = "is_alice_partial_text_visible"];
}

