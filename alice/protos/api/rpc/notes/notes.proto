    string LocalDateTime = 3 [json_name = "local_date_time"];
  }
  optional string ReminderId = 1 [json_name = "reminder_id"];
  optional .NAlice.NData.NReminders.TPlaySettings PlaySettings = 4 [json_name = "play_settings"];
}

message TTag {
  .NAlice.NData.NTron.TTronTagValue TagValue = 2 [json_name = "tag_value"];
  optional string TagId = 1 [json_name = "tag_id"];
}

