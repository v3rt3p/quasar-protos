syntax = "proto3";

package NAlice.NNotes.NApi;

option java_package = "ru.yandex.alice.protos.api.rpc.notes";
option java_outer_classname = "NotesApi";
option go_package = "a.yandex-team.ru/alice/protos/api/rpc/notes";

import "google/protobuf/timestamp.proto";
