  repeated .NAlice.NNotes.NApi.TSubtask Subtasks = 9 [json_name = "subtasks"];
  repeated .NAlice.NNotes.NApi.TReminder Reminders = 10 [json_name = "reminders"];
  repeated .NAlice.NNotes.NApi.TTag Tags = 15 [json_name = "tags"];
  repeated string PublicHomeIds = 18 [json_name = "public_home_ids"];
  optional string NoteId = 1 [json_name = "note_id"];
  optional string Title = 2 [json_name = "title"];
  optional string Text = 3 [json_name = "text"];
  optional string Deadline = 4 [json_name = "deadline"];
  optional bool Pinned = 5 [json_name = "pinned"];
  optional .NAlice.NNotes.NApi.ENoteStatus Status = 6 [json_name = "status"];
  optional string CreatedDateTime = 7 [json_name = "created_date_time"];
  optional string UpdatedDateTime = 8 [json_name = "updated_date_time"];
  optional string Schedule = 11 [json_name = "schedule"];
  optional string NoteHash = 12 [json_name = "note_hash"];
  optional string SheduleNoteId = 13 [json_name = "schedule_note_id"];
  optional bool Doable = 14 [json_name = "doable"];
  optional .NAlice.NData.NTron.NNotes.TTronTechnicalInfo TechnicalInfo = 16 [json_name = "technical_info"];
  optional bool IsPersonal = 17 [json_name = "is_personal"];
}

message TNoteDraft {
  repeated .NAlice.NNotes.NApi.TSubtask Subtasks = 5 [json_name = "subtasks"];
  repeated .NAlice.NNotes.NApi.TTag Tags = 7 [json_name = "tags"];
  optional string DraftId = 1 [json_name = "draft_id"];
  optional string CreatedDateTime = 2 [json_name = "created_date_time"];
  optional string Deadline = 10 [json_name = "deadline"];
  optional string DraftTitle = 3 [json_name = "draft_title"];
  optional string DraftText = 4 [json_name = "draft_text"];
  optional string Schedule = 6 [json_name = "schedule"];
  optional .NAlice.NData.NTron.EProgressStatus ProgressStatus = 8 [json_name = "progress_status"];
  optional .NAlice.NData.NNotes.ETimeStatus TimeStatus = 9 [json_name = "time_status"];
  optional bool IsPersonal = 11 [json_name = "is_personal"];
}

