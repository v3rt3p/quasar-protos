syntax = "proto3";

package NAlice.NMusic;

option go_package = "a.yandex-team.ru/alice/protos/api/rpc/music/music_search";

import "alice/protos/api/voice_control/voice_control.proto";
import "alice/protos/data/scenario/objects/music.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMusicSearchRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  enum EMusicSearchType {
    Undefined = 0;
    All = 1;
    Track = 2;
    Artist = 3;
    Album = 4;
    Playlist = 5;
    Podcast = 6;
    Audiobook = 7;
    Clip = 8;
  }

  string Query = 1 [json_name = "query", (.NYT.column_name) = "query"];
  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
  uint32 Offset = 3 [json_name = "offset", (.NYT.column_name) = "offset"];
  uint32 Limit = 4 [json_name = "limit", (.NYT.column_name) = "limit"];
}

message TMusicSearchResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TMusicSearchElement {
    .NAlice.TVoiceControl VoiceControl = 7 [json_name = "voice_control", (.NYT.column_name) = "voice_control"];
    oneof TElementInfo {
      option (.NYT.variant_field_name) = "element_info";
      .NAlice.NData.TTrack Track = 1 [json_name = "track", (.NYT.column_name) = "track"];
      .NAlice.NData.TArtist Artist = 2 [json_name = "artist", (.NYT.column_name) = "artist"];
      .NAlice.NData.TAlbum Album = 3 [json_name = "album", (.NYT.column_name) = "album"];
      .NAlice.NData.TPlaylist Playlist = 4 [json_name = "playlist", (.NYT.column_name) = "playlist"];
      .NAlice.NData.TPodcastEpisode PodcastEpisode = 5 [json_name = "podcast_episode", (.NYT.column_name) = "podcast_episode"];
      .NAlice.NData.TWave Wave = 6 [json_name = "wave", (.NYT.column_name) = "wave"];
    }
  }

  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
  repeated .NAlice.NMusic.TMusicSearchResponse.TMusicSearchElement SearchElements = 2 [json_name = "search_elements", (.NYT.column_name) = "search_elements"];
}

message TMusicSearchHistoryRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
}

message TMusicSearchHistoryResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated .NAlice.NMusic.TMusicSearchResponse.TMusicSearchElement SearchElements = 1 [json_name = "search_elements", (.NYT.column_name) = "search_elements"];
}

message TMusicSearchFeedbackRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
}

message TMusicSearchFeedbackResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
}

message TMusicSearchNavigationRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Query = 1 [json_name = "query", (.NYT.column_name) = "query"];
  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
  uint32 Limit = 3 [json_name = "limit", (.NYT.column_name) = "limit"];
}

message TMusicSearchNavigationResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated .NAlice.TVoiceControl VoiceControls = 1 [json_name = "voice_control", (.NYT.column_name) = "voice_control"];
}

