syntax = "proto3";

package NAlice.NMusic;

option go_package = "a.yandex-team.ru/alice/protos/api/rpc/music/music_search";

import "alice/protos/api/voice_control/voice_control.proto";
import "alice/protos/data/scenario/objects/music.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMusicSearchRequest {
  enum EMusicSearchType {
    Undefined = 0;
    All = 1;
    Track = 2;
    Artist = 3;
    Album = 4;
    Playlist = 5;
    Podcast = 6;
    Audiobook = 7;
    Clip = 8;
  }

  string Query = 1 [json_name = "query"];
  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 2 [json_name = "type"];
  uint32 Offset = 3 [json_name = "offset"];
  uint32 Limit = 4 [json_name = "limit"];
}

message TMusicSearchResponse {
  message TMusicSearchElement {
    .NAlice.TVoiceControl VoiceControl = 7 [json_name = "voice_control"];
    oneof TElementInfo {
      .NAlice.NData.TTrack Track = 1 [json_name = "track"];
      .NAlice.NData.TArtist Artist = 2 [json_name = "artist"];
      .NAlice.NData.TAlbum Album = 3 [json_name = "album"];
      .NAlice.NData.TPlaylist Playlist = 4 [json_name = "playlist"];
      .NAlice.NData.TPodcastEpisode PodcastEpisode = 5 [json_name = "podcast_episode"];
      .NAlice.NData.TWave Wave = 6 [json_name = "wave"];
    }
  }

  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 1 [json_name = "type"];
  repeated .NAlice.NMusic.TMusicSearchResponse.TMusicSearchElement SearchElements = 2 [json_name = "search_elements"];
}

message TMusicSearchHistoryRequest {
}

message TMusicSearchHistoryResponse {
  repeated .NAlice.NMusic.TMusicSearchResponse.TMusicSearchElement SearchElements = 1 [json_name = "search_elements"];
}

message TMusicSearchFeedbackRequest {
}

message TMusicSearchFeedbackResponse {
}

message TMusicSearchNavigationRequest {
  string Query = 1 [json_name = "query"];
  .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 2 [json_name = "type"];
  uint32 Limit = 3 [json_name = "limit"];
}

message TMusicSearchNavigationResponse {
  repeated .NAlice.TVoiceControl VoiceControls = 1 [json_name = "voice_control"];
}

