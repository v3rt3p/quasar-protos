message TGetMusicArtistPopularTracksResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated .NAlice.NMusic.NArpc.TTrack PopularTracks = 1 [json_name = "popular_tracks", (.NYT.column_name) = "popular_tracks"];
  string ArtistId = 2 [json_name = "artist_id", (.NYT.column_name) = "artist_id"];
}

message TGetMusicArtistPopularAlbumsRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string ArtistId = 1 [json_name = "artist_id", (.NYT.column_name) = "artist_id"];
  uint32 Offset = 2 [json_name = "offset", (.NYT.column_name) = "offset"];
