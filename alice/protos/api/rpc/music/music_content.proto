}

message TGetMusicArtistPopularAlbumsResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated .NAlice.NMusic.NArpc.TAlbum PopularAlbums = 1 [json_name = "popular_albums", (.NYT.column_name) = "popular_albums"];
  string ArtistId = 2 [json_name = "artist_id", (.NYT.column_name) = "artist_id"];
