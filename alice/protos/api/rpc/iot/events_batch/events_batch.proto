syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.api.rpc.events_batch";
option java_outer_classname = "EventsBatch";
option go_package = "a.yandex-team.ru/alice/protos/api/rpc/iot/events_batch;eventsbatchpb";

import "alice/protos/api/alicekit/common/environment_state/environment_state.proto";
import "alice/protos/endpoint/events/events.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIoTEventsBatchRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated .NAlice.TEndpointEvents Batch = 1 [json_name = "batch", (.NYT.column_name) = "batch"];
  .NAlice.NAliceApi.TEnvironmentState EnvironmentState = 2 [json_name = "environment_state", (.NYT.column_name) = "environment_state"];
}

message TIoTEventsBatchResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
}

