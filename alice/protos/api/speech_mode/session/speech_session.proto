syntax = "proto3";

package NAlice;

option go_package = "a.yandex-team.ru/alice/protos/api/speech_mode/session";

import "alice/protos/api/speech_mode/mode/speech_mode.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSpeechSession {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TInitialRequestRef {
    string RequestId = 1 [json_name = "request_id", (.NYT.column_name) = "request_id"];
    string MessageId = 2 [json_name = "message_id", (.NYT.column_name) = "message_id"];
  }

  .NAlice.TSpeechMode SpeechMode = 1 [json_name = "speech_mode", deprecated = true, (.NYT.column_name) = "speech_mode"];
  .NAlice.TSpeechSession.TInitialRequestRef InitialRequestRef = 2 [json_name = "initial_request_ref", (.NYT.column_name) = "initial_request_ref"];
}

