syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.protocol.server";
option java_outer_classname = "ServerMessage";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/protocol/server";

import "alice/protos/api/alicekit/events/alice_response/alice_response.proto";
import "alice/protos/api/alicekit/events/asr_music_result/asr_music_result.proto";
import "alice/protos/api/alicekit/events/asr_result/asr_result.proto";
import "alice/protos/api/alicekit/events/chunk_ack/chunk_ack.proto";
import "alice/protos/api/alicekit/events/audio_transcription_input/audio_transcription_input_response.proto";
import "alice/protos/api/alicekit/events/common/event_header/event_header.proto";
import "alice/protos/api/alicekit/events/common/message_group/message_group.proto";
import "alice/protos/api/alicekit/events/common/streaming/streaming.proto";
import "alice/protos/api/alicekit/events/data_proxy_request/data_proxy_request.proto";
import "alice/protos/api/alicekit/events/event_exception/event_exception.proto";
import "alice/protos/api/alicekit/events/file_upload_response/file_upload_response.proto";
import "alice/protos/api/alicekit/events/go_away/go_away.proto";
import "alice/protos/api/alicekit/events/input_start_ack/input_start_ack.proto";
import "alice/protos/api/alicekit/events/invalid_auth/invalid_auth.proto";
import "alice/protos/api/alicekit/events/log_ack/log_ack.proto";
import "alice/protos/api/alicekit/events/ping/ping.proto";
import "alice/protos/api/alicekit/events/push/push.proto";
import "alice/protos/api/alicekit/events/request_stat_ack/request_stat_ack.proto";
import "alice/protos/api/alicekit/events/server_request_ready/server_request_ready.proto";
import "alice/protos/api/alicekit/events/server_subscription_state/server_subscription_state.proto";
import "alice/protos/api/alicekit/events/speech_control/speech_control.proto";
import "alice/protos/api/alicekit/events/spotter_validation/spotter_validation.proto";
import "alice/protos/api/alicekit/events/stream_control/stream_control.proto";
import "alice/protos/api/alicekit/events/sync_push/sync_push.proto";
import "alice/protos/api/alicekit/events/synchronize_state_response/synchronize_state_response.proto";
import "alice/protos/api/alicekit/events/tts_speak/tts_speak.proto";
import "alice/protos/api/alicekit/events/tts_timings/tts_timings.proto";
import "alice/protos/api/alicekit/streaming/deffered_response.proto";
import "google/protobuf/timestamp.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TServerMessage {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "MatchVoicePrint";
    reserved "UpdateVoicePrints";
    reserved "DataProxyConnectResponse";
    reserved "DataProxyOutput";
    reserved "IotCloudTechnicalPushResponse";
    reserved "IotCloudEventsBatchResponse";
    reserved "DebugLogs";
    reserved "IotCloudLogBatchResponse";
    reserved "IotCloudTelemetryBatchResponse";
    reserved "DialogHistoryMessage";
    reserved "IotCloudGeneralQuasarRequestResponse";
    reserved "IotCloudOtaResponse";
    reserved "DialogControl";
    reserved "GeneralHttpRequestResponse";
    reserved 6;
    reserved 7;
    reserved 20;
    reserved 21;
    reserved 26;
    reserved 27;
    reserved 28;
    reserved 29;
    reserved 30;
    reserved 31;
    reserved 33;
    reserved 34;
    reserved 35;
    reserved 37;
    .NAlice.NAliceApi.TEventHeader Header = 1 [json_name = "header", (.NYT.column_name) = "header"];
    oneof Event {
      option (.NYT.variant_field_name) = "event";
      .NAlice.NAliceApi.TAliceResponseProto AliceResponse = 2 [json_name = "alice_response", (.NYT.column_name) = "alice_response"];
      .NAlice.NAliceApi.TDeferedAliceResponseProto DeferredAliceResponse = 3 [json_name = "deferred_alice_response", (.NYT.column_name) = "deferred_alice_response"];
      .NAlice.NAliceApi.TGoAway GoAway = 4 [json_name = "go_away", (.NYT.column_name) = "go_away"];
      .NAlice.NAliceApi.TPush Push = 5 [json_name = "push", (.NYT.column_name) = "push"];
      .NAlice.NAliceApi.TSyncPush SyncPush = 8 [json_name = "sync_push", (.NYT.column_name) = "sync_push"];
      .NAlice.NAliceApi.TEventException EventException = 9 [json_name = "event_exception", (.NYT.column_name) = "event_exception"];
      .NAlice.NAliceApi.TInputStartAck InputStartAck = 10 [json_name = "input_start_ack", (.NYT.column_name) = "input_start_ack"];
      .NAlice.NAliceApi.TLogAck LogAck = 11 [json_name = "log_ack", (.NYT.column_name) = "log_ack"];
      .NAlice.NAliceApi.TPing Ping = 12 [json_name = "ping", (.NYT.column_name) = "ping"];
      .NAlice.NAliceApi.TAsrResult AsrResult = 13 [json_name = "asr_result", (.NYT.column_name) = "asr_result"];
      .NAlice.NAliceApi.TTtsSpeak TtsSpeak = 14 [json_name = "tts_speak", (.NYT.column_name) = "tts_speak"];
      .NAlice.NAliceApi.TServerRequestReady ServerRequestReady = 15 [json_name = "server_request_ready", (.NYT.column_name) = "server_request_ready"];
      .NAlice.NAliceApi.TSpotterValidation SpotterValidation = 16 [json_name = "spotter_validation", (.NYT.column_name) = "spotter_validation"];
      .NAlice.NAliceApi.TInvalidAuth InvalidAuth = 17 [json_name = "invalid_auth", (.NYT.column_name) = "invalid_auth"];
      .NAlice.NAliceApi.TTtsTimings TtsTimings = 18 [json_name = "tts_timings", (.NYT.column_name) = "tts_timings"];
      .NAlice.NAliceApi.TAsrMusicResult AsrMusicResult = 19 [json_name = "asr_music_result", (.NYT.column_name) = "asr_music_result"];
      .NAlice.NAliceApi.TDataProxyRequest DataProxyRequest = 22 [json_name = "data_proxy_request", (.NYT.column_name) = "data_proxy_request"];
      .NAlice.NAliceApi.TFileUploadResponse FileUploadResponse = 23 [json_name = "file_upload_response", (.NYT.column_name) = "file_upload_response"];
      .NAlice.NAliceApi.TSynchronizeStateResponse SynchronizeStateResponse = 24 [json_name = "synchronize_state_response", (.NYT.column_name) = "synchronize_state_response"];
      .NAlice.NAliceApi.TSpeechControl SpeechControl = 25 [json_name = "speech_control", (.NYT.column_name) = "speech_control"];
      .NAlice.NAliceApi.TServerSubscriptionState ServerSubscriptionState = 32 [json_name = "server_subscription_state", (.NYT.column_name) = "server_subscription_state"];
      .NAlice.NAliceApi.TRequestStatAck RequestStatAck = 36 [json_name = "request_stat_ack", (.NYT.column_name) = "request_stat_ack"];
      .NAlice.NAliceApi.TAudioTranscriptionInputResponse AudioTranscriptionInputResponse = 38 [json_name = "audio_transcription_input_response", (.NYT.column_name) = "audio_transcription_input_response"];
      .NAlice.NAliceApi.TChunkAck ChunkAck = 39 [json_name = "chunk_ack", (.NYT.column_name) = "chunk_ack"];
    }
  }

  message TTimings {
    .google.protobuf.Timestamp SendingTime = 1 [json_name = "sending_time", (.NYT.column_name) = "sending_time"];
  }

  .NAlice.NAliceApi.TServerMessage.TTimings Timings = 3 [json_name = "timings", (.NYT.column_name) = "timings"];
  .NAlice.NAliceApi.TStreaming Streaming = 4 [json_name = "streaming", (.NYT.column_name) = "streaming"];
  .NAlice.NAliceApi.TMessageGroupInfo MessageGroup = 5 [json_name = "message_group", (.NYT.column_name) = "message_group"];
  oneof Message {
    option (.NYT.variant_field_name) = "message";
    .NAlice.NAliceApi.TServerMessage.TEvent Event = 1 [json_name = "event", (.NYT.column_name) = "event"];
    .NAlice.NAliceApi.TStreamControl StreamControl = 2 [json_name = "stream_control", (.NYT.column_name) = "stream_control"];
  }
}

