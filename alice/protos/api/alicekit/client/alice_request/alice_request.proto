message TVoiceInput {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TClientOptions {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    message TOpenStreamPolicy {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      message TVadGate {
        option (.NYT.default_field_flags) = SERIALIZATION_YT;
      }

      oneof Gate {
        option (.NYT.variant_field_name) = "gate";
        .NAlice.NAliceApi.TVoiceInput.TClientOptions.TOpenStreamPolicy.TVadGate VadGate = 1 [json_name = "vad_gate", (.NYT.column_name) = "vad_gate"];
      }
    }

    bool DisableJingle = 1 [json_name = "disable_jingle", (.NYT.column_name) = "disable_jingle"];
    bool IsMusic = 2 [json_name = "is_music", (.NYT.column_name) = "is_music"];
    .NAlice.NAliceApi.TVoiceInput.TClientOptions.TOpenStreamPolicy OpenStreamPolicy = 3 [json_name = "open_stream_policy", (.NYT.column_name) = "open_stream_policy"];
  }

  .NAlice.NAliceApi.TClientAliceRequestProto RequestPayload = 1 [json_name = "request_payload", (.NYT.column_name) = "request_payload"];
  .NAlice.NAliceApi.TVoiceInput.TClientOptions ClientOptions = 2 [json_name = "client_options", (.NYT.column_name) = "client_options"];
}

