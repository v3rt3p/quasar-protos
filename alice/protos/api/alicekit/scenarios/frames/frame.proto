}

message TSemanticFrameRequestData {
  reserved "Origin";
  reserved "Params";
  reserved "OnChainFinish";
  reserved 3;
  reserved 4;
  reserved 6;
  .NAlice.NAliceApi.TTypedSemanticFrame TypedSemanticFrame = 1 [json_name = "typed_semantic_frame"];
  .NAlice.TAnalyticsTrackingModule Analytics = 2 [json_name = "analytics"];
  .NAlice.TRequestParams RequestParams = 5 [json_name = "request_params"];
}

