message TSemanticFrame {
  reserved "Entities";
  reserved "TypedSemanticFrame";
  reserved "IsFromRephrasedUtterance";
  reserved 4;
  reserved 5;
  reserved 6;
  message TSlot {
    reserved "AcceptedTypes";
    reserved "IsRequested";
    reserved "TypedValue";
    reserved "IsFilled";
    reserved 4;
    reserved 5;
    reserved 6;
    reserved 7;
    string Name = 1 [json_name = "name"];
    string Type = 2 [json_name = "type"];
    string Value = 3 [json_name = "value"];
  }

  string Name = 1 [json_name = "name"];
  repeated .NAlice.NAliceApi.TSemanticFrame.TSlot Slots = 2 [json_name = "slots"];
}

