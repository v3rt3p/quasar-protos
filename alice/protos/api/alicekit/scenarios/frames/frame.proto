    .NAlice.TGetEqualizerSettingsSemanticFrame GetEqualizerSettingsSemanticFrame = 138 [json_name = "get_equalizer_settings_semantic_frame"];
    .NAlice.TOnboardingGetGreetingsSemanticFrame OnboardingGetGreetingsSemanticFrame = 140 [json_name = "onboarding_get_greetings_semantic_frame"];
    .NAlice.TEnrollmentStatusSemanticFrame EnrollmentStatusSemanticFrame = 156 [json_name = "multiaccount_enrollment_status_semantic_frame"];
    .NAlice.TGuestEnrollmentFinishSemanticFrame GuestEnrollmentFinishSemanticFrame = 165 [json_name = "guest_enrollment_finish_semantic_frame"];
    .NAlice.TVoiceActivityDetectorSemanticFrame VoiceActivityDetectorSemanticFrame = 263 [json_name = "voice_activity_detector_semantic_frame"];
    .NAlice.TOnboardingAddNetworkSuccessSemanticFrame OnboardingAddNetworkSuccessSemanticFrame = 368 [json_name = "onboarding_add_network_success_semantic_frame"];
