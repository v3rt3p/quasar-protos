    .NAlice.TIoTDiscoveryFailureSemanticFrame IoTDiscoveryFailureSemanticFrame = 33 [json_name = "iot_discovery_failure"];
    .NAlice.TOnboardingStartingCriticalUpdateSemanticFrame OnboardingStartingCriticalUpdateSemanticFrame = 36 [json_name = "onboarding_starting_critical_update"];
    .NAlice.TOnboardingStartingConfigureSuccessSemanticFrame OnboardingStartingConfigureSuccessSemanticFrame = 37 [json_name = "onboarding_starting_configure_success"];
    .NAlice.TRadioPlaySemanticFrame RadioPlaySemanticFrame = 38 [json_name = "radio_play_semantic_frame"];
