    .NAlice.TPlayerRepeatSemanticFrame PlayerRepeatSemanticFrame = 58 [json_name = "player_repeat_semantic_frame"];
    .NAlice.TPlayerUnshuffleSemanticFrame PlayerUnshuffleSemanticFrame = 64 [json_name = "player_unshuffle_semantic_frame"];
    .NAlice.TStartIotTuyaBroadcastSemanticFrame StartIotTuyaBroadcastSemanticFrame = 102 [json_name = "start_iot_tuya_broadcast_semantic_frame"];
    .NAlice.TRestoreIotNetworksSemanticFrame RestoreIotNetworksSemanticFrame = 104 [json_name = "restore_iot_networks_semantic_frame"];
    .NAlice.TSaveIotNetworksSemanticFrame SaveIotNetworksSemanticFrame = 105 [json_name = "save_iot_networks_semantic_frame"];
