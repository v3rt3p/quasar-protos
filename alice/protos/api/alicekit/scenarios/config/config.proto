syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.scenarios.config";
option java_outer_classname = "ScenarioConfigProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/scenarios/config";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TScenarioConfig {
  message TCapabilityInfo {
    .NAlice.TCapability.ECapabilityType Type = 1 [json_name = "type"];
  }

  message TFrameInfo {
    string Name = 1 [json_name = "name"];
    string ProtoTypeName = 2 [json_name = "proto_type_name"];
  }

  string ScenarioName = 1 [json_name = "scenario_name"];
  repeated .NAlice.NAliceApi.TScenarioConfig.TCapabilityInfo Capabilities = 2 [json_name = "capabilities"];
  repeated .NAlice.NAliceApi.TScenarioConfig.TFrameInfo AcceptedFrames = 3 [json_name = "accepted_frames"];
}

