syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.suggests";
option java_outer_classname = "SuggestProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/suggests";

import "alice/library/censor/protos/extension.proto";
import "alice/protos/api/alicekit/directives/directive.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSuggest {
  message TTheme {
    enum EPlacement {
      UnknownPlacement = 0;
      NewLine = 1;
    }

    string ImageUrl = 1 [json_name = "image_url"];
    .NAlice.NAliceApi.TSuggest.TTheme.EPlacement Placement = 2 [json_name = "placement"];
  }

  string SuggestId = 1 [json_name = "suggest_id"];
  string Type = 2 [json_name = "type"];
  string Title = 3 [json_name = "title"];
  repeated .NAlice.NAliceApi.TDirective Directives = 4 [json_name = "directives"];
  string Text = 5 [json_name = "text"];
  .NAlice.NAliceApi.TSuggest.TTheme Theme = 6 [json_name = "theme"];
}

