syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.synchronize_state_request";
option java_outer_classname = "SynchronizeStateRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/synchronize_state_request";

import "alice/library/censor/protos/extension.proto";
import "alice/library/client/protos/client_analytics_info.proto";
import "alice/library/client/protos/client_info.proto";
import "alice/megamind/protos/common/experiments/experiments.proto";
import "alice/megamind/protos/user/options.proto";
import "alice/protos/api/alicekit/events/common/event_type/event_type.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSynchronizeStateRequest {
  string OAuthToken = 1 [json_name = "oauth_token"];
  string ApiKey = 2 [json_name = "api_key"];
  .NAlice.TClientInfoProto Application = 3 [json_name = "application"];
  repeated string SupportedFeatures = 4 [json_name = "supported_features"];
  bool SoundLogging = 5 [json_name = "sound_logging"];
  .NAlice.TExperimentsProto Experiments = 6 [json_name = "experiments"];
  repeated .NAlice.NAliceApi.EEventType SupportedServerEvents = 7 [json_name = "supported_server_events"];
  repeated .NAlice.TUserOptions UsersOptions = 8 [json_name = "users_options"];
  .NAlice.TClientAnalyticsInfoProto ClientAnalyticsInfo = 12 [json_name = "client_analytics_info"];
  optional string ICookie = 9 [json_name = "icookie"];
  optional string YexpCookie = 10 [json_name = "yexp_cookie"];
  optional string SaeCookie = 11 [json_name = "sae_cookie"];
  optional string YBrowserExperiments = 13 [json_name = "y_browser_experiments"];
  optional string XYBrowserExperiments = 14 [json_name = "x_y_browser_experiments"];
}

