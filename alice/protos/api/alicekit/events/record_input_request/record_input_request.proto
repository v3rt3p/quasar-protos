syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.record_input_request";
option java_outer_classname = "RecordInputRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/record_input_request";

import "yt/yt_proto/yt/formats/extension.proto";

message TRecordInputRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TStartRequest {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  oneof Request {
    option (.NYT.variant_field_name) = "request";
    .NAlice.NAliceApi.TRecordInputRequest.TStartRequest StartRequest = 1 [json_name = "start_request", (.NYT.column_name) = "start_request"];
  }
}

