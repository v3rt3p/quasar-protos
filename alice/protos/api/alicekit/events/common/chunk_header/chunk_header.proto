syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.common.chunk_header";
option java_outer_classname = "ChunkHeader";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/common/chunk_header";

import "yt/yt_proto/yt/formats/extension.proto";

message TChunkHeader {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  optional uint64 ChunkId = 1 [json_name = "chunk_id", (.NYT.column_name) = "chunk_id"];
  optional uint32 SubStreamId = 2 [json_name = "sub_stream_id", (.NYT.column_name) = "sub_stream_id"];
}

