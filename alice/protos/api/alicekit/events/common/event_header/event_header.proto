syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.common.event_header";
option java_outer_classname = "EventHeader";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/common/event_header";

import "yt/yt_proto/yt/formats/extension.proto";

message TEventHeader {
  reserved "EventId";
  reserved "SequenceNumber";
  reserved "RefStreamId";
  reserved "Namespace";
  reserved "Name";
  reserved 3;
  reserved 6;
  reserved 7;
  reserved 9;
  reserved 10;
  message TSubRequestRef {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string MessageId = 1 [json_name = "message_id", (.NYT.column_name) = "message_id"];
    string RequestId = 2 [json_name = "request_id", (.NYT.column_name) = "request_id"];
  }

  string MessageId = 1 [json_name = "messageId", (.NYT.column_name) = "messageId"];
  string RefMessageId = 2 [json_name = "refMessageId", (.NYT.column_name) = "refMessageId"];
  .NAlice.NAliceApi.TEventHeader.TSubRequestRef SubRequestRef = 13 [json_name = "sub_request_ref", (.NYT.column_name) = "sub_request_ref"];
  optional int64 StreamId = 4 [json_name = "streamId", (.NYT.column_name) = "streamId"];
  optional int64 Ack = 5 [json_name = "ack", (.NYT.column_name) = "ack"];
  optional string RtLogId = 8 [json_name = "rtLogId", (.NYT.column_name) = "rtLogId"];
  optional string SubRequestId = 11 [json_name = "sub_request_id", deprecated = true, (.NYT.column_name) = "sub_request_id"];
  optional uint32 RetryNumber = 12 [json_name = "retry_number", (.NYT.column_name) = "retry_number"];
}

