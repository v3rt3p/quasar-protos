syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.data_proxy_request";
option java_outer_classname = "DataProxyRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/data_proxy_request";

import "yt/yt_proto/yt/formats/extension.proto";

message TDataProxyRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TGetRequest {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional string Namespace = 1 [json_name = "namespace", (.NYT.column_name) = "namespace"];
    optional string Key = 2 [json_name = "key", (.NYT.column_name) = "key"];
  }

  oneof Request {
    .NAlice.NAliceApi.TDataProxyRequest.TGetRequest RequestGet = 2 [json_name = "request_get", (.NYT.column_name) = "request_get"];
  }
  optional string InteractionId = 1 [json_name = "interaction_id", (.NYT.column_name) = "interaction_id"];
}

