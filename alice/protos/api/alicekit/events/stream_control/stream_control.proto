syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.stream_control";
option java_outer_classname = "StreamControl";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/stream_control";

import "yt/yt_proto/yt/formats/extension.proto";

message TStreamControl {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TActionClose {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum EReason {
      OK = 0;
      INTERNAL_ERROR = 1;
      STOP_RECORDING = 2;
      AUDIO_SOURCE_STOPPED = 3;
      CANCEL = 4;
      NO_SPEECH = 5;
    }

    .NAlice.NAliceApi.TStreamControl.TActionClose.EReason Reason = 1 [json_name = "reason", (.NYT.column_name) = "reason"];
  }

  message TActionSpotterEnd {
  }

  message TActionLazyTTS {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    int64 ChunkSize = 1 [json_name = "chunk_size", (.NYT.column_name) = "chunk_size"];
  }

  int64 StreamId = 1 [json_name = "stream_id", (.NYT.column_name) = "stream_id"];
  string MessageId = 2 [json_name = "message_id", (.NYT.column_name) = "message_id"];
  oneof Action {
    option (.NYT.variant_field_name) = "action";
    .NAlice.NAliceApi.TStreamControl.TActionClose Close = 3 [json_name = "close", (.NYT.column_name) = "close"];
    .NAlice.NAliceApi.TStreamControl.TActionSpotterEnd SpotterEnd = 4 [json_name = "spotter_end", (.NYT.column_name) = "spotter_end"];
    .NAlice.NAliceApi.TStreamControl.TActionLazyTTS LazyTTS = 5 [json_name = "lazy_tts", (.NYT.column_name) = "lazy_tts"];
  }
}

