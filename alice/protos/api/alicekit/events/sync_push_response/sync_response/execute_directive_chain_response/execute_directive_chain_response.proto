syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.sync_push_response.sync_response.execute_directive_chain_response";
option java_outer_classname = "ExecuteDirectiveChainResponse";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/sync_push_response/sync_response/execute_directive_chain_response";

import "alice/protos/api/alicekit/events/sync_push_response/sync_response/execute_directive_error/execute_directive_error.proto";
import "alice/protos/api/alicekit/common/environment_state/environment_state.proto";
import "alice/protos/endpoint/any_capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TExecuteDirectiveChainResponse {
  message TExecutionResult {
    message TReceivedChain {
    }

    message TCompleted {
      message TSucceed {
      }

      message TFailed {
        string Error = 1 [json_name = "error"];
        .NAlice.NAliceApi.TExecuteDirectiveError.EErrorCode Code = 2 [json_name = "code"];
      }

      string DirectiveId = 3 [json_name = "directive_id"];
      .NAlice.NAliceApi.DirectiveTimings DirectiveTimings = 4 [json_name = "directive_timings"];
      oneof Status {
        .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult.TCompleted.TSucceed Succeed = 1 [json_name = "succeed"];
        .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult.TCompleted.TFailed Failed = 2 [json_name = "failed"];
      }
      optional .NAlice.TAnyCapabilityHolder AnyCapability = 5 [json_name = "any_capability"];
    }

    message TCompletedChain {
      repeated .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult.TCompleted Completed = 1 [json_name = "completed"];
    }

    .NAlice.NAliceApi.ExecutionTimings ExecutionTimings = 3 [json_name = "execution_timings"];
    oneof Result {
      .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult.TReceivedChain ExecutionStarted = 1 [json_name = "execution_started"];
      .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult.TCompletedChain ExecutionCompleted = 2 [json_name = "execution_completed"];
    }
  }

  .NAlice.NAliceApi.TExecuteDirectiveChainResponse.TExecutionResult ExecutionResult = 1 [json_name = "execution_result"];
  .NAlice.NAliceApi.TEnvironmentState AffectedEnvironmentState = 2 [json_name = "affected_environment_state"];
}

message DirectiveTimings {
  optional uint64 StartedTimestamp = 1 [json_name = "started_timestamp"];
  optional uint64 CompletedTimestamp = 2 [json_name = "completed_timestamp"];
}

message ExecutionTimings {
  optional uint64 StartedTimestamp = 1 [json_name = "started_timestamp"];
  optional uint64 CompletedTimestamp = 2 [json_name = "completed_timestamp"];
}

