syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.continue_request";
option java_outer_classname = "ContinueRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/continue_request";

import "yt/yt_proto/yt/formats/extension.proto";

message TContinueRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string RequestMessageId = 1 [json_name = "requestMessageId", (.NYT.column_name) = "requestMessageId"];
}

