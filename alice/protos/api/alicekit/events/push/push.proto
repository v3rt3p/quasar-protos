syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.push";
option java_outer_classname = "Push";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/push";

import "alice/protos/api/alicekit/directives/directive.proto";
import "alice/protos/api/matrix/common/analytics_meta_info.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TPush {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  repeated string PushIds = 1 [json_name = "push_ids", (.NYT.column_name) = "push_ids"];
  repeated .NAlice.NAliceApi.TDirective Directives = 3 [json_name = "directives", (.NYT.column_name) = "directives"];
  .NMatrix.NApi.TAnalyticsMetaInfo AnalyticsMetaInfo = 4 [json_name = "analytics_meta_info", (.NYT.column_name) = "analytics_meta_info"];
  optional string DeduplicationPushId = 2 [json_name = "deduplication_push_id", (.NYT.column_name) = "deduplication_push_id"];
}

