syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.tts_update_state";
option java_outer_classname = "TtsUpdateState";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/tts_update_state";

import "google/protobuf/duration.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTtsUpdateState {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TTsState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .google.protobuf.Duration PlayedTtsDuration = 1;
    bool IsPlaying = 2;
  }

  enum EReportReason {
    Unknown = 0;
    Interruption = 1;
    Finish = 2;
  }

  string RequestMessageId = 1 [json_name = "requestMessageId", (.NYT.column_name) = "request_message_id"];
  .NAlice.NAliceApi.TTtsUpdateState.TTsState State = 2 [json_name = "state", (.NYT.column_name) = "state"];
  .NAlice.NAliceApi.TTtsUpdateState.EReportReason ReportReason = 3 [json_name = "report_reason", (.NYT.column_name) = "report_reason"];
  uint32 SubStreamId = 4 [json_name = "sub_stream_id", (.NYT.column_name) = "sub_stream_id"];
}

