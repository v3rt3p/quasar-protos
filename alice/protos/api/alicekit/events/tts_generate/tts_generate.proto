syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.tts_generate";
option java_outer_classname = "TtsGenerate";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/tts_generate";

import "alice/megamind/protos/common/experiments/experiments.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTtsGenerate {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  reserved "RealtimeStreamer";
  reserved 11;
  .NAlice.TExperimentsProto Experiments = 10 [json_name = "experiments", (.NYT.column_name) = "experiments"];
  optional string Lang = 1 [json_name = "lang", (.NYT.column_name) = "lang"];
  optional string Emotion = 2 [json_name = "emotion", (.NYT.column_name) = "emotion"];
  optional string Format = 3 [json_name = "format", (.NYT.column_name) = "format"];
  optional string Quality = 4 [json_name = "quality", (.NYT.column_name) = "quality"];
  optional double Speed = 5 [json_name = "speed", (.NYT.column_name) = "speed"];
  optional string Tag = 6 [json_name = "tag", (.NYT.column_name) = "tag"];
  optional string Text = 7 [json_name = "text", (.NYT.column_name) = "text"];
  optional string Voice = 8 [json_name = "voice", (.NYT.column_name) = "voice"];
  optional double Volume = 9 [json_name = "volume", (.NYT.column_name) = "volume"];
  optional bool IsStreaming = 12 [json_name = "is_streaming", (.NYT.column_name) = "is_streaming"];
}

