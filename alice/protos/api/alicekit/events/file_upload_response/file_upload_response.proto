syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.file_upload_response";
option java_outer_classname = "FileUploadResponse";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/file_upload_response";

import "yt/yt_proto/yt/formats/extension.proto";

message TFileUploadResponse {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TFileUploadStart {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional uint64 MinChunkSize = 1 [json_name = "min_chunk_size", (.NYT.column_name) = "min_chunk_size"];
    optional uint64 MaxChunkSize = 2 [json_name = "max_chunk_size", (.NYT.column_name) = "max_chunk_size"];
  }

  message TFileUploadContinue {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TFileUploadFinish {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional string FileGuid = 1 [json_name = "file_guid", (.NYT.column_name) = "file_guid"];
    optional string PreviewUrl = 2 [json_name = "preview_url", (.NYT.column_name) = "preview_url"];
    optional string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    optional string MimeType = 4 [json_name = "mime_type", (.NYT.column_name) = "mime_type"];
    optional string Extension = 5 [json_name = "extension", (.NYT.column_name) = "extension"];
    optional uint64 SizeBytes = 6 [json_name = "size_bytes", (.NYT.column_name) = "size_bytes"];
  }

  message TFileUploadError {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    message TUnsupportedMimeType {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
    }

    message TInvalidFileSize {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      optional uint64 MaxFileSize = 1 [json_name = "max_file_size", (.NYT.column_name) = "max_file_size"];
    }

    message TQuotaExceeded {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
    }

    oneof Error {
      .NAlice.NAliceApi.TFileUploadResponse.TFileUploadError.TUnsupportedMimeType UnsupportedMimeType = 1 [json_name = "unsupported_mime_type", (.NYT.column_name) = "unsupported_mime_type"];
      .NAlice.NAliceApi.TFileUploadResponse.TFileUploadError.TInvalidFileSize InvalidFileSize = 2 [json_name = "invalid_file_size", (.NYT.column_name) = "invalid_file_size"];
      .NAlice.NAliceApi.TFileUploadResponse.TFileUploadError.TQuotaExceeded QuotaExceeded = 3 [json_name = "quota_exceeded", (.NYT.column_name) = "quota_exceeded"];
    }
  }

  oneof Response {
    .NAlice.NAliceApi.TFileUploadResponse.TFileUploadStart FileUploadStart = 1 [json_name = "file_upload_start", (.NYT.column_name) = "file_upload_start"];
    .NAlice.NAliceApi.TFileUploadResponse.TFileUploadContinue FileUploadContinue = 2 [json_name = "file_upload_continue", (.NYT.column_name) = "file_upload_continue"];
    .NAlice.NAliceApi.TFileUploadResponse.TFileUploadFinish FileUploadFinish = 3 [json_name = "file_upload_finish", (.NYT.column_name) = "file_upload_finish"];
    .NAlice.NAliceApi.TFileUploadResponse.TFileUploadError FileUploadError = 4 [json_name = "file_upload_error", (.NYT.column_name) = "file_upload_error"];
  }
}

