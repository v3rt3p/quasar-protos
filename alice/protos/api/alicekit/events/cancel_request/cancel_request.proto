syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.events.cancel_request";
option java_outer_classname = "CancelRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/events/cancel_request";

import "alice/protos/api/local_scenario/response_data.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCancelRequest {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TReasonUserStop {
  }

  message TReasonInterruption {
  }

  message TReasonLocalExecution {
    .NAlice.NApi.TLocalScenarioResponseData ScenarioResponse = 1 [json_name = "scenario_response", (.NYT.column_name) = "scenario_response"];
  }

  string RequestMessageId = 1 [json_name = "requestMessageId", (.NYT.column_name) = "requestMessageId"];
  oneof Reason {
    option (.NYT.variant_field_name) = "reason";
    .NAlice.NAliceApi.TCancelRequest.TReasonUserStop UserStop = 2 [json_name = "user_stop", (.NYT.column_name) = "user_stop"];
    .NAlice.NAliceApi.TCancelRequest.TReasonInterruption Interruption = 3 [json_name = "interruption", (.NYT.column_name) = "interruption"];
    .NAlice.NAliceApi.TCancelRequest.TReasonLocalExecution LocalExecution = 4 [json_name = "local_execution", (.NYT.column_name) = "local_execution"];
  }
}

