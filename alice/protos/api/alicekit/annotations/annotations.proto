syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.annotations";
option java_outer_classname = "RequestAnnotationProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/annotations";

import "alice/protos/api/alicekit/cards/card.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBaseAnnotation {
  enum EBoundType {
    Undefined = 0;
  }

  repeated .NAlice.NAliceApi.TCard Cards = 1 [json_name = "cards", (.NYT.column_name) = "cards"];
  .NAlice.NAliceApi.TBaseAnnotation.EBoundType BoundType = 2 [json_name = "bound_type", (.NYT.column_name) = "bound_type"];
}

message TRequestAnnotation {
  message TAnnotationsList {
    option (.NYT.default_field_flags) = SERIALIZATION_PROTOBUF;
    repeated .NAlice.NAliceApi.TBaseAnnotation Annotations = 1 [json_name = "annotations", (.NYT.column_name) = "annotations"];
  }

  .NAlice.NAliceApi.TBaseAnnotation Base = 1 [json_name = "base", deprecated = true, (.NYT.column_name) = "base"];
  .NAlice.NAliceApi.TRequestAnnotation.TAnnotationsList AnnotationsList = 2 [json_name = "annotations_list", (.NYT.column_name) = "annotations_list"];
}

