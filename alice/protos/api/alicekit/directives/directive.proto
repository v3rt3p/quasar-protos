syntax = "proto3";

package NAlice.NAliceApi;

option java_package = "ru.yandex.alice.protos.api.alicekit.directives";
option java_outer_classname = "DirectiveProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/alicekit/directives";

import "alice/library/censor/protos/extension.proto";
import "alice/protos/api/source/source.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message TDirective {
  reserved "UniproxyDirectiveMeta";
  reserved "TypedPayload";
  reserved 56788;
  reserved 10;
  reserved 19;
  message TOnFinishEvent {
    oneof Event {
      .google.protobuf.Struct TypedCallbackRequest = 1 [json_name = "typed_callback_request"];
    }
  }

  message TChannel {
    enum EType {
      Unknown = 0;
      Dialog = 1;
    }

    .NAlice.NAliceApi.TDirective.TChannel.EType Type = 1 [json_name = "type"];
  }

  string Type = 1 [json_name = "type"];
  string Name = 2 [json_name = "name"];
  string AnalyticsType = 3 [json_name = "sub_name"];
  bool IgnoreAnswer = 4 [json_name = "ignore_answer"];
  repeated string RoomDeviceIds = 7 [json_name = "room_device_ids"];
  bool IsLedSilent = 8 [json_name = "is_led_silent"];
  .google.protobuf.StringValue EndpointId = 9 [json_name = "endpoint_id"];
  bool IsParallel = 11 [json_name = "is_parallel"];
  uint32 TimeBeforeDropMs = 12 [json_name = "time_before_drop_ms"];
  .NAlice.NAliceApi.TDirective.TOnFinishEvent OnFinish = 14 [json_name = "on_finish_event"];
  .NAlice.NAliceApi.TSourceInfo SourceInfo = 17 [json_name = "source_info"];
  bool AttachToMultiroom = 18 [json_name = "attach_to_multiroom"];
  .NAlice.TCapability.EDirectiveType DirectiveType = 20 [json_name = "directive_type"];
  .NAlice.NAliceApi.TDirective.TChannel Channel = 21 [json_name = "channel"];
  oneof PayloadType {
    .google.protobuf.Struct Payload = 5 [json_name = "payload"];
    bytes PayloadRaw = 15 [json_name = "payload_raw"];
  }
  oneof OptionalMultiroomSessionId {
    string MultiroomSessionId = 6 [json_name = "multiroom_session_id"];
  }
  oneof OptionalPersId {
    string PersId = 13 [json_name = "pers_id"];
  }
  optional string Id = 16 [json_name = "id"];
}

