syntax = "proto3";

package NAlice.NScenarios.NCalls;

option java_package = "ru.yandex.alice.protos.api.typed_callbacks.calls";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/typed_callbacks/calls";

import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIncomingCallReceivedTypedCallback {
}

message TOutgoingDeviceCallTypedCallback {
  enum ECallType {
    Default = 0;
    Dropin = 1;
    Radionanny = 2;
  }

  .NAlice.NScenarios.NCalls.TOutgoingDeviceCallTypedCallback.ECallType CallType = 1 [json_name = "call_type"];
  string DeviceId = 2 [json_name = "device_id"];
}

message TGetCallableDevicesTypedCallback {
}

message TPhoneLastCallContactCallback {
  string Phone = 2 [json_name = "phone"];
  optional string Name = 1 [json_name = "name"];
}

message TPhoneLastCallContactLookupFailedCallback {
  enum EReason {
    Unspecified = 0;
    NotFound = 1;
    UnexpectedError = 2;
    NumberUnavailable = 3;
  }

  .NAlice.NScenarios.NCalls.TPhoneLastCallContactLookupFailedCallback.EReason Reason = 1 [json_name = "reason"];
}

message TPhoneContactSelectedCallback {
  string LookupKey = 1 [json_name = "lookup_key"];
}

