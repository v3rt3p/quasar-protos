syntax = "proto3";

package NAlice.NScenarios.NVoiceprint;

option java_package = "ru.yandex.alice.protos.api.typed_callbacks.voiceprint";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/typed_callbacks/voiceprint";

import "alice/library/censor/protos/extension.proto";
import "alice/protos/data/scenario/voiceprint/personalization_data.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TRemoveVoiceprintTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "RemoveVoiceprintTypedCallback";
  string Puid = 1 [json_name = "puid", (.NYT.column_name) = "puid", (.NAlice.FieldAccess) = A_PRIVATE_RESPONSE];
  string PersId = 2 [json_name = "pers_id", (.NYT.column_name) = "pers_id"];
}

message TSendIotEnrollmentPushTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "SendIotEnrollmentPushTypedCallback";
  string Puid = 1 [json_name = "puid", (.NYT.column_name) = "puid", (.NAlice.FieldAccess) = A_PRIVATE_RESPONSE];
  bool NeedNlg = 2 [json_name = "need_nlg", (.NYT.column_name) = "need_nlg"];
}

message TStartEnrollmentOnboardingTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "StartEnrollmentOnboardingTypedCallback";
  string Puid = 1 [json_name = "puid", (.NYT.column_name) = "puid", (.NAlice.FieldAccess) = A_PRIVATE_RESPONSE];
}

message TStartEnrollmentTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "StartEnrollmentTypedCallback";
  string Puid = 1 [json_name = "puid", (.NYT.column_name) = "puid", (.NAlice.FieldAccess) = A_PRIVATE_RESPONSE];
  string UserName = 2 [json_name = "user_name", (.NYT.column_name) = "user_name"];
  repeated string Aliases = 3 [json_name = "aliases", (.NYT.column_name) = "aliases"];
}

message TCancelEnrollmentTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "CancelEnrollmentTypedCallback";
}

message TRegisterSharedEnrollmentTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "RegisterSharedEnrollmentTypedCallback";
  string UserName = 1 [json_name = "user_name", (.NYT.column_name) = "user_name"];
  .NAlice.NData.NVoiceprint.EGender UserGender = 2 [json_name = "user_gender", (.NYT.column_name) = "user_gender"];
}

message TRegisterChildKolonkishTypedCallback {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.MMTypedCallbackName) = "RegisterChildKolonkishTypedCallback";
}

