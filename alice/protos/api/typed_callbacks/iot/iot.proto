syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.api.typed_callbacks.iot";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/typed_callbacks/iot";

import "alice/protos/extensions/extensions.proto";
import "alice/protos/endpoint/endpoint.proto";
import "alice/protos/endpoint/aggregate.proto";
import "alice/protos/endpoint/capabilities/iot_discovery/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TActionDeviceResult {
  string ID = 1 [json_name = "id"];
  string Status = 2 [json_name = "status"];
}

message TScenarioActionDeviceResultCallback {
  string LaunchID = 1 [json_name = "launch_id"];
  repeated .NAlice.TActionDeviceResult DeviceResults = 2 [json_name = "device_results"];
  uint64 StepIndex = 3 [json_name = "step_index"];
}

message TFinishDiscoveryCallback {
  repeated .NAlice.TIotDiscoveryCapability.TProtocol Protocols = 1 [json_name = "protocols"];
  .NAlice.TIotDiscoveryCapability.TNetworks Networks = 2 [json_name = "networks"];
  repeated .NAlice.TEndpoint DiscoveredEndpoints = 3 [json_name = "discovered_endpoints"];
  string SystemInfo = 4 [json_name = "system_info"];
  uint32 CallbackId = 5 [json_name = "callback_id"];
  string SessionId = 6 [json_name = "session_id"];
  repeated .NAlice.TAggregate DiscoveredAggregates = 7 [json_name = "discovered_aggregates"];
  .NAlice.TIotDiscoveryCapability.EMode Mode = 8 [json_name = "mode"];
}

message TFinishSystemDiscoveryCallback {
  repeated .NAlice.TIotDiscoveryCapability.TProtocol Protocols = 1 [json_name = "protocols"];
  .NAlice.TIotDiscoveryCapability.TNetworks Networks = 2 [json_name = "networks"];
  repeated .NAlice.TEndpoint DiscoveredEndpoints = 3 [json_name = "discovered_endpoints"];
  string SystemInfo = 4 [json_name = "system_info"];
  uint32 CallbackId = 5 [json_name = "callback_id"];
  repeated .NAlice.TAggregate DiscoveredAggregates = 6 [json_name = "discovered_aggregates"];
}

message TCancelDiscoveryCallback {
  repeated string SessionIds = 1 [json_name = "session_ids"];
}

