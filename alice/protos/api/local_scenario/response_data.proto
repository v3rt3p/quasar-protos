syntax = "proto3";

package NAlice.NApi;

option java_package = "ru.yandex.alice.protos.api.local_scenario";
option go_package = "a.yandex-team.ru/alice/protos/api/local_scenario";

import "yt/yt_proto/yt/formats/extension.proto";

message TLocalScenarioResponseData {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string ScenarioName = 1 [json_name = "scenario_name", (.NYT.column_name) = "scenario_name"];
  string ProductScenarioName = 2 [json_name = "product_scenario_name", (.NYT.column_name) = "product_scenario_name"];
  string RequestText = 3 [json_name = "request_text", (.NYT.column_name) = "request_text"];
  string ResponseText = 4 [json_name = "response_text", (.NYT.column_name) = "response_text"];
}

