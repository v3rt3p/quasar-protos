syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.api.incognito_mode";
option java_outer_classname = "IncognitoOptions";
option go_package = "a.yandex-team.ru/alice/protos/api/incognito_mode";

import "yt/yt_proto/yt/formats/extension.proto";

message TIncognitoOptions {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
}

