syntax = "proto3";

package NAlice.NIotCloud;

option java_package = "ru.yandex.alice.protos.api.iot_cloud.events.log_batch";
option java_outer_classname = "IotCloudLogBatchRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/iot_cloud/events/log_batch";

import "google/protobuf/timestamp.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotCloudLogBatchRequest {
  .NAlice.NIotCloud.TIotCloudLogBatch LogBatch = 1 [json_name = "log_batch"];
}

message TIotCloudLogMessage {
  message TField {
    string Key = 1 [json_name = "key"];
    oneof Value {
      string StringValue = 2 [json_name = "string_value"];
    }
  }

  enum ELogLevel {
    UNKNOWN = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
    FATAL = 5;
  }

  .NAlice.NIotCloud.TIotCloudLogMessage.ELogLevel Level = 1 [json_name = "level"];
  string Message = 2 [json_name = "message"];
  repeated .NAlice.NIotCloud.TIotCloudLogMessage.TField Fields = 3 [json_name = "fields"];
  optional .google.protobuf.Timestamp Timestamp = 4 [json_name = "timestamp"];
}

message TIotCloudLogBatch {
  repeated .NAlice.NIotCloud.TIotCloudLogMessage Messages = 1 [json_name = "messages"];
}

