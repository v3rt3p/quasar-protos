syntax = "proto3";

package NAlice.NIotCloud;

option java_package = "ru.yandex.alice.protos.api.iot_cloud.events.telemetry_batch";
option java_outer_classname = "IotCloudTelemetryBatchRequest";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/api/iot_cloud/events/telemetry_batch";

import "google/protobuf/timestamp.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotCloudTelemetryBatchRequest {
  .NAlice.NIotCloud.TIotCloudTelemetryBatch TelemetryBatch = 1 [json_name = "telemetry_batch"];
}

message TIotCloudTelemetryEvent {
  message TField {
    string Key = 1 [json_name = "key"];
    oneof Value {
      string StringValue = 2 [json_name = "string_value"];
    }
  }

  message TValue {
    oneof Value {
      double CounterValue = 1 [json_name = "counter_value"];
      string StringValue = 2 [json_name = "string_value"];
    }
  }

  string Name = 1 [json_name = "name"];
  .NAlice.NIotCloud.TIotCloudTelemetryEvent.TValue Value = 2 [json_name = "value"];
  repeated .NAlice.NIotCloud.TIotCloudTelemetryEvent.TField Fields = 3 [json_name = "fields"];
  optional .google.protobuf.Timestamp Timestamp = 4 [json_name = "timestamp"];
}

message TIotCloudTelemetryBatch {
  repeated .NAlice.NIotCloud.TIotCloudTelemetryEvent Events = 1 [json_name = "events"];
}

