syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.api.request_parts";
option go_package = "a.yandex-team.ru/alice/protos/api/request_parts";

import "yt/yt_proto/yt/formats/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";

message TOrigin {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  oneof OptionalDeviceId {
    option (.NYT.variant_field_name) = "optional_device_id";
    string DeviceId = 1 [json_name = "device_id", (.NYT.column_name) = "device_id", (.NAliceYT.PrivateGroup) = PrivateGroupLevel1];
  }
  oneof OptionalUuid {
    option (.NYT.variant_field_name) = "optional_uuid";
    string Uuid = 2 [json_name = "uuid", (.NYT.column_name) = "uuid", (.NAliceYT.PrivateGroup) = PrivateGroupLevel1];
  }
}

