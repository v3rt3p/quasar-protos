syntax = "proto3";

package NAlice.NIot;

option go_package = "a.yandex-team.ru/alice/protos/api/iot_device";

import "alice/protos/endpoint/aggregate.proto";
import "alice/protos/endpoint/endpoint.proto";

message TDevice {
  repeated .NAlice.TEndpoint Endpoints = 1 [json_name = "endpoints"];
  repeated .NAlice.TAggregate Aggregates = 2 [json_name = "aggregates"];
}

message TDeviceDescription {
  .NAlice.NIot.TDevice Device = 1 [json_name = "device"];
  bytes HashSum = 2 [json_name = "hash_sum"];
}

