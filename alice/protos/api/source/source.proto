syntax = "proto3";

package NAlice.NAliceApi;

option go_package = "a.yandex-team.ru/alice/protos/api/source";

import "yt/yt_proto/yt/formats/extension.proto";

message TLocalIoTSource {
  string EndpointId = 1 [json_name = "endpoint_id", (.NYT.column_name) = "endpoint_id"];
}

message TLocalScenarioSource {
  string ScenarioId = 1 [json_name = "scenario_id", (.NYT.column_name) = "scenario_id"];
}

message TSourceInfo {
  oneof Source {
    option (.NYT.oneof_flags) = VARIANT;
    option (.NYT.variant_field_name) = "source";
    .NAlice.NAliceApi.TLocalIoTSource LocalIoTSource = 1 [json_name = "local_iot_source", (.NYT.column_name) = "local_iot_source"];
    .NAlice.NAliceApi.TLocalScenarioSource LocalScenarioSource = 2 [json_name = "local_scenario_source", (.NYT.column_name) = "local_scenario_source"];
  }
}

