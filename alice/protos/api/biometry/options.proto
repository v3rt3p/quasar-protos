syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.api.biometry";
option java_outer_classname = "OndeviceBiometryOptions";
option go_package = "a.yandex-team.ru/alice/protos/api/biometry";

import "yt/yt_proto/yt/formats/extension.proto";

message TOndeviceBiometryOptions {
  message TScoring {
    bool Enabled = 1 [json_name = "enabled"];
  }

  message TClassification {
    bool Enabled = 1 [json_name = "enabled"];
  }

  .NAlice.TOndeviceBiometryOptions.TScoring Scoring = 1 [json_name = "scoring"];
  bool IgnoreVoiceprintUpdate = 2 [json_name = "ignore_voiceprint_update"];
  .NAlice.TOndeviceBiometryOptions.TClassification Classification = 3 [json_name = "classification"];
}

