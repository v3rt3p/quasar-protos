syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.dialog_state";
option go_package = "a.yandex-team.ru/alice/protos/data/dialog_state";

import "alice/protos/api/alice_mode_info/alice_mode_info.proto";
import "alice/protos/data/dialog_type/dialog_type.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDialogState {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  .NAlice.NApi.NAlice2Mode.TAlice2ModeInfo Alice2ModeInfo = 4 [json_name = "alice2_mode_info", (.NYT.column_name) = "alice2_mode_info"];
  optional string DialogId = 1 [json_name = "dialog_id", (.NYT.column_name) = "dialog_id"];
  optional string FolderId = 2 [json_name = "folder_id", (.NYT.column_name) = "folder_id"];
  optional .NAlice.NData.EDialogType DialogType = 3 [json_name = "dialog_type", (.NYT.column_name) = "dialog_type"];
  optional string CharacterId = 5 [json_name = "character_id", (.NYT.column_name) = "character_id"];
}

