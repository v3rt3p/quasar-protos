syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.news";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/news";

import "yt/yt_proto/yt/formats/extension.proto";
import "alice/protos/data/news_provider.proto";

message TNewsItem {
  message TImage {
    string Src = 1 [json_name = "src"];
    int32 Width = 2 [json_name = "width"];
    int32 Height = 3 [json_name = "height"];
  }

  string Text = 1 [json_name = "text"];
  string Url = 2 [json_name = "url"];
  .NAlice.NData.TNewsItem.TImage Image = 3 [json_name = "image"];
  string Messages = 5 [json_name = "messages"];
  string TurboIconUrl = 6 [json_name = "turbo_icon_url"];
  string Agency = 7 [json_name = "agency"];
  string Logo = 8 [json_name = "logo"];
  uint64 PubDate = 9 [json_name = "pub_date"];
  repeated .NAlice.NData.TNewsItem ExtendedNews = 10 [json_name = "extended_news"];
}

message TNewsGalleryData {
  repeated .NAlice.NData.TNewsItem NewsItems = 1 [json_name = "news_items"];
  int32 CurrentNewsItem = 2 [json_name = "current_news_item"];
  string Topic = 3 [json_name = "topic"];
  string Tz = 4 [json_name = "tz"];
}

message TNewsTeaserData {
  .NAlice.NData.TNewsItem NewsItem = 1 [json_name = "news_item"];
  string Topic = 2 [json_name = "topic"];
  string Tz = 3 [json_name = "tz"];
  bool NewsSourceSelected = 4 [json_name = "news_source_selected"];
}

message TNewsMainScreenData {
  repeated .NAlice.NData.TNewsItem NewsItems = 1 [json_name = "news_items"];
  string Topic = 2 [json_name = "topic"];
  string Tz = 3 [json_name = "tz"];
}

message TNewsSettingData {
  message TNewsProviderData {
    .NAlice.NData.TNewsProvider ProviderConfig = 1 [json_name = "provider_config"];
    string Agency = 2 [json_name = "agency"];
    string Logo = 3 [json_name = "logo"];
    bool IsChosen = 4 [json_name = "is_chosen"];
  }

  repeated .NAlice.NData.TNewsSettingData.TNewsProviderData NewsProviderData = 1 [json_name = "news_providers"];
  string ProviderNamePrefix = 2 [json_name = "provider_name_prefix"];
  repeated string AvaliablePrefixes = 3 [json_name = "avaliable_prefixes"];
  bool IsNewsRequest = 4 [json_name = "is_news_request"];
}

