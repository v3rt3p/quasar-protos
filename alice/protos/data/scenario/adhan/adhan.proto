syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.adhan";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/adhan";

import "alice/protos/data/date/day_of_week.proto";
import "alice/protos/data/date/gregorian_date.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAdhan {
  message TActivationDay {
    oneof ActivationDay {
      .NAlice.NData.TDayOfWeek Weekday = 1 [json_name = "weekday"];
      .NAlice.NData.TGregorianDate Date = 2 [json_name = "date"];
    }
  }

  enum EAdhanType {
    UnknownAdhanType = 0;
    FajrAdhanType = 1;
    DhuhrAdhanType = 2;
    AsrAdhanType = 3;
    MaghribAdhanType = 4;
    IshaAdhanType = 5;
  }

  string AdhanId = 1 [json_name = "adhan_id"];
  .NAlice.NData.TAdhan.EAdhanType AdhanType = 2 [json_name = "adhan_type"];
  repeated .NAlice.NData.TAdhan.TActivationDay ActivationDays = 3 [json_name = "activation_days"];
}

message TAdhanMuezzinSettings {
  string FajrAdhanMelodyS3Url = 1 [json_name = "fajr_adhan_melody_s3_url"];
  string OtherAdhansMelodyS3Url = 2 [json_name = "other_adhans_melody_s3_url"];
}

