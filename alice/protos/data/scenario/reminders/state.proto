syntax = "proto3";

package NAlice.NData.NReminders;

option java_package = "ru.yandex.alice.protos.data.scenario.reminders";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/reminders";

import "alice/protos/data/language/language.proto";
import "alice/protos/data/scenario/reminders/extensions.proto";
import "google/protobuf/timestamp.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TState {
  message TWeekdaysTriggerPolicy {
    repeated uint64 InitivalInvocations = 1 [json_name = "initial_invocations"];
  }

  message TTriggerPolicy {
    oneof Type {
      .NAlice.NData.NReminders.TState.TWeekdaysTriggerPolicy WeekdaysTriggerPolicy = 1 [json_name = "weekdays_trigger_policy"];
    }
  }

  message TReminder {
    reserved "Epoch";
    reserved "ClientTimeDeltaSeconds";
    reserved 3;
    reserved 7;
    string Id = 1 [json_name = "id"];
    string Text = 2 [json_name = "text"];
    string TimeZone = 4 [json_name = "timezone"];
    string Origin = 5 [json_name = "origin"];
    uint64 ShootAt = 6 [json_name = "shoot_at"];
    .NAlice.NData.NReminders.TReminderExtensions Extensions = 8 [json_name = "extensions"];
    repeated string OriginPlatformFeatures = 9 [json_name = "origin_platform_features"];
    .NAlice.ELang Language = 11 [json_name = "language"];
    optional .NAlice.NData.NReminders.TState.TTriggerPolicy TriggerPolicy = 10 [json_name = "trigger_policy"];
    optional bool IsXiva = 12 [json_name = "is_xiva"];
  }

  message TSurfaceSyncState {
    .NAlice.NData.NReminders.ERemindersSyncState State = 1 [json_name = "state"];
    .google.protobuf.Timestamp CreatedAt = 2 [json_name = "created_at"];
  }

  repeated .NAlice.NData.NReminders.TState.TReminder Reminders = 1 [json_name = "reminders"];
  map<string, uint64> Cancelled = 2 [json_name = "cancelled"];
  map<string, .NAlice.NData.NReminders.TState.TSurfaceSyncState> SurfacesSyncState = 3 [json_name = "surfaces_sync_state"];
  .NAlice.NData.NReminders.TRemindersSettings RemindersSettings = 4 [json_name = "reminders_settings"];
}

message TRemindersSettings {
  enum EPlayOn {
    Undefined = 0;
    SameDevice = 1;
    SelectedDevices = 2;
    All = 3;
  }

  bool SendMobileNotification = 1 [json_name = "send_mobile_notification"];
  .NAlice.NData.NReminders.TRemindersSettings.EPlayOn PlayOn = 2 [json_name = "play_on"];
  repeated string DeviceIds = 3 [json_name = "device_ids"];
  int32 OrmMigrationVersion = 4 [json_name = "orm_migration_version"];
}

