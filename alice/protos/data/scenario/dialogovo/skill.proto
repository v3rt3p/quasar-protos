syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.dialogovo";
option java_outer_classname = "DialogovoScenarioDataProto";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/dialogovo";

import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDialogovoSkillCardData {
  message TSkillInfo {
    string Name = 1 [json_name = "name"];
    string Logo = 2 [json_name = "logo"];
    string SkillId = 3 [json_name = "skill_id"];
    string PaletteId = 4 [json_name = "palette_id"];
  }

  message TSkillRequest {
    string Text = 1 [json_name = "text"];
  }

  message TSkillResponse {
    message TButton {
      string Text = 1 [json_name = "text"];
      string Url = 2 [json_name = "url"];
      string Payload = 3 [json_name = "payload"];
    }

    message TSuggest {
      string Text = 1 [json_name = "text"];
      string Url = 2 [json_name = "url"];
      string Payload = 3 [json_name = "payload"];
    }

    message TTextResponse {
      string Text = 1 [json_name = "text"];
    }

    message TImageItem {
      string ImageUrl = 1 [json_name = "image_url"];
      string Title = 2 [json_name = "title"];
      string Description = 3 [json_name = "description"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TButton Button = 4 [json_name = "button"];
    }

    message TBigImageResponse {
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TImageItem ImageItem = 1 [json_name = "image_item"];
    }

    message TImageGalleryResponse {
      repeated .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TImageItem ImageItems = 1 [json_name = "image_items"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TItemsListHeader ItemsListHeader = 2 [json_name = "items_list_header"];
    }

    message TItemsListHeader {
      string Text = 1 [json_name = "text"];
    }

    message TItemsListFooter {
      string Text = 1 [json_name = "text"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TButton Button = 2 [json_name = "button"];
    }

    message TItemsListResponse {
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TItemsListHeader ItemsLisetHeader = 1 [json_name = "items_list_header"];
      repeated .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TImageItem ImageItems = 2 [json_name = "image_items"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TItemsListFooter ItemsLisetFooter = 3 [json_name = "items_list_footer"];
    }

    message TFullScreenResponse {
      string BackgroundImageUrl = 1 [json_name = "background_image_url"];
      string Title = 2 [json_name = "title"];
      string Body = 3 [json_name = "body"];
    }

    repeated .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TButton buttons = 5 [json_name = "buttons"];
    repeated .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TSuggest suggests = 6 [json_name = "suggests"];
    bool EndSession = 7 [json_name = "end_session"];
    oneof ResponseCard {
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TTextResponse TextResponse = 1 [json_name = "text_response"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TBigImageResponse BigImageResponse = 2 [json_name = "big_image_response"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TImageGalleryResponse ImageGalleryResponse = 3 [json_name = "image_gallery_response"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TItemsListResponse ItemsListResponse = 4 [json_name = "items_list_response"];
      .NAlice.NData.TDialogovoSkillCardData.TSkillResponse.TFullScreenResponse FullScreenResponse = 8 [json_name = "full_screen_response"];
    }
  }

  .NAlice.NData.TDialogovoSkillCardData.TSkillInfo SkillInfo = 1 [json_name = "skill_info"];
  .NAlice.NData.TDialogovoSkillCardData.TSkillRequest SkillRequest = 2 [json_name = "skill_request"];
  .NAlice.NData.TDialogovoSkillCardData.TSkillResponse SkillResponse = 3 [json_name = "skill_response"];
}

message TDialogovoSkillTeaserData {
  message TSkillInfo {
    string Name = 1 [json_name = "name"];
    string Logo = 2 [json_name = "logo"];
    string SkillId = 3 [json_name = "skill_id"];
    string PaletteId = 4 [json_name = "palette_id"];
  }

  .NAlice.NData.TDialogovoSkillTeaserData.TSkillInfo SkillInfo = 1 [json_name = "skill_info"];
  string ImageUrl = 2 [json_name = "image_url"];
  string Text = 3 [json_name = "text"];
  string Title = 4 [json_name = "title"];
  string Action = 5 [json_name = "action"];
}

message TSkillInfo {
  string Name = 1 [json_name = "name"];
  string Logo = 2 [json_name = "logo"];
  string SkillId = 3 [json_name = "skill_id"];
  string PaletteId = 4 [json_name = "palette_id"];
}

message TDialogovoDeactivateSkillData {
  .NAlice.NData.TSkillInfo SkillInfo = 1 [json_name = "skill_info"];
  string Text = 2 [json_name = "text"];
  string Request = 3 [json_name = "request"];
}

