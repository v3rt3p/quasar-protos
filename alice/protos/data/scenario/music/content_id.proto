syntax = "proto3";

package NAlice.NData.NMusic;

option java_package = "ru.yandex.alice.protos.data.scenario.music";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/music";

import "alice/protos/data/music_provider/provider_meta.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TContentId {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  enum EContentType {
    Track = 0;
    Album = 1;
    Artist = 2;
    Playlist = 3;
    Radio = 4;
    Generative = 5;
    FmRadio = 6;
    ShowTail = 7;
    GeneratedRecs = 8;
  }

  .NAlice.NData.NMusic.TContentId.EContentType Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
  string Id = 2 [json_name = "id", (.NYT.column_name) = "id"];
  repeated string Ids = 3 [json_name = "ids", (.NYT.column_name) = "ds"];
}

message TContentIdWithProvider {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  .Alice.Music.ContentId ContentId = 1 [json_name = "content_id", (.NYT.column_name) = "content_id"];
  .Alice.Music.MusicProvider MusicProvider = 2 [json_name = "music_provider", (.NYT.column_name) = "music_provider"];
}

