syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.suggests";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/suggests";

import "yt/yt_proto/yt/formats/extension.proto";

message TSuggest {
  message TActionButton {
    message TTheme {
      enum EPlacement {
        UnknownPlacement = 0;
        NewLine = 1;
      }

      string ImageUrl = 1 [json_name = "image_url"];
      .NAlice.NData.TSuggest.TActionButton.TTheme.EPlacement Placement = 2 [json_name = "placement"];
    }

    string Title = 1 [json_name = "title"];
    string ActionId = 2 [json_name = "action_id"];
    .NAlice.NData.TSuggest.TActionButton.TTheme Theme = 3 [json_name = "theme"];
  }

  message TSearchButton {
    string Title = 1 [json_name = "title"];
    string Query = 2 [json_name = "query"];
  }

  oneof Action {
    .NAlice.NData.TSuggest.TActionButton ActionButton = 1 [json_name = "action_button"];
    .NAlice.NData.TSuggest.TSearchButton SearchButton = 2 [json_name = "search_button"];
  }
}

