syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.objects";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/objects";

import "yt/yt_proto/yt/formats/extension.proto";

message TSingleImage {
  reserved "HttpSorce";
  reserved 3;
  message TImageRef {
    string Url = 1 [json_name = "url"];
    int32 Width = 2 [json_name = "width"];
    int32 Height = 3 [json_name = "height"];
  }

  .NAlice.NData.TSingleImage.TImageRef UrlAvatar = 1 [json_name = "url_avatar"];
  .NAlice.NData.TSingleImage.TImageRef UrlSource = 2 [json_name = "url_source"];
  string Text = 4 [json_name = "text"];
  string HttpSource = 5 [json_name = "http_source"];
}

message TImageGallery {
  reserved "Gallery";
  reserved 1;
  repeated .NAlice.NData.TSingleImage Images = 2 [json_name = "images"];
}

message TImageGrid {
  string Title = 1 [json_name = "title"];
  .NAlice.NData.TImageGallery Images = 2 [json_name = "images"];
}

