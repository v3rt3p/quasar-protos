syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.objects";
option java_outer_classname = "MusicObjectsProto";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/objects";

import "alice/protos/data/scenario/objects/image.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";

message TDisclaimerInfo {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string Description = 3 [json_name = "description", (.NYT.column_name) = "description"];
}

message TAlbum {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string Genre = 3 [json_name = "genre", (.NYT.column_name) = "genre"];
  string CoverUri = 4 [json_name = "cover_uri", (.NYT.column_name) = "cover_uri"];
  repeated .NAlice.NData.TArtist Artists = 5 [json_name = "artists", (.NYT.column_name) = "artists"];
  int32 ReleaseYear = 6 [json_name = "release_year", (.NYT.column_name) = "release_year"];
  string Type = 7 [json_name = "type", (.NYT.column_name) = "type"];
  bool IsLiked = 8 [json_name = "like", (.NYT.column_name) = "like"];
  uint32 LikesCount = 9 [json_name = "likes_count", (.NYT.column_name) = "likes_count"];
  repeated .NAlice.NData.TDisclaimerInfo Disclaimers = 10 [json_name = "disclaimers", (.NYT.column_name) = "disclaimers"];
}

message TPlaylist {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string CoverUri = 5 [json_name = "cover_uri", (.NYT.column_name) = "cover_uri"];
  int32 LikesCount = 6 [json_name = "likes_count", (.NYT.column_name) = "likes_count"];
  bool IsLiked = 7 [json_name = "like", (.NYT.column_name) = "like"];
  uint32 TracksCount = 8 [json_name = "tracks_count", (.NYT.column_name) = "tracks_count"];
}

message TArtist {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Name = 2 [json_name = "name", (.NYT.column_name) = "name"];
  bool Composer = 3 [json_name = "composer", (.NYT.column_name) = "composer"];
  bool IsVarious = 4 [json_name = "is_various", (.NYT.column_name) = "is_various"];
  string CoverUri = 5 [json_name = "cover_uri", (.NYT.column_name) = "cover_uri"];
  repeated string Genre = 6 [json_name = "genre", (.NYT.column_name) = "genre"];
  bool IsLiked = 7 [json_name = "like", (.NYT.column_name) = "like"];
  uint32 LikesCount = 8 [json_name = "likes_count", (.NYT.column_name) = "likes_count"];
  repeated .NAlice.NData.TDisclaimerInfo Disclaimers = 9 [json_name = "disclaimers", (.NYT.column_name) = "disclaimers"];
}

message TTrack {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string Subtype = 3 [json_name = "subtype", (.NYT.column_name) = "subtype"];
  string ArtImageUrl = 4 [json_name = "art_image_url", (.NYT.column_name) = "art_image_url"];
  .NAlice.NData.TAlbum Album = 5 [json_name = "album", (.NYT.column_name) = "album"];
  repeated .NAlice.NData.TArtist Artists = 6 [json_name = "artists", (.NYT.column_name) = "artists"];
  bool IsLiked = 7 [json_name = "like", (.NYT.column_name) = "like"];
  bool IsDisliked = 8 [json_name = "dislike", (.NYT.column_name) = "dislike"];
  uint32 DurationMs = 9 [json_name = "duration_ms", (.NYT.column_name) = "duration_ms"];
  string ArtistId = 10 [json_name = "artist_id", (.NYT.column_name) = "artist_id"];
  string AlbumId = 11 [json_name = "album_id", (.NYT.column_name) = "album_id"];
  string TrackId = 12 [json_name = "track_id", (.NYT.column_name) = "track_id"];
  string ShotText = 13 [json_name = "shot_text", (.NYT.column_name) = "shot_text"];
  bool HasAvailableLyrics = 14 [json_name = "has_available_lyrics", (.NYT.column_name) = "has_available_lyrics"];
  string Uuid = 15 [json_name = "uuid", (.NYT.column_name) = "uuid", (.NAliceYT.PrivateGroup) = PrivateGroupLevel1];
  repeated .NAlice.NData.TDisclaimerInfo Disclaimers = 16 [json_name = "disclaimers", (.NYT.column_name) = "disclaimers"];
}

message TPodcastEpisode {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string CoverUri = 3 [json_name = "cover_uri", (.NYT.column_name) = "cover_uri"];
  string PublicationDate = 4 [json_name = "publication_date", (.NYT.column_name) = "publication_date"];
  .NAlice.NData.TAlbum Album = 5 [json_name = "album", (.NYT.column_name) = "album"];
  repeated .NAlice.NData.TArtist Artists = 6 [json_name = "artists", (.NYT.column_name) = "artists"];
  uint32 DurationMs = 7 [json_name = "duration_ms", (.NYT.column_name) = "duration_ms"];
  bool IsLiked = 8 [json_name = "like", (.NYT.column_name) = "like"];
}

message TWave {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string Subtitle = 3 [json_name = "subtitle", (.NYT.column_name) = "subtitle"];
  string CoverUri = 4 [json_name = "cover_uri", (.NYT.column_name) = "cover_uri"];
}

message TMusicBand {
  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
  string Subtitle = 3 [json_name = "subtitle", (.NYT.column_name) = "subtitle"];
  string GroupDescription = 4 [json_name = "group_description", (.NYT.column_name) = "group_description"];
  .NAlice.NData.TSingleImage.TImageRef Logo = 5 [json_name = "logo", (.NYT.column_name) = "logo"];
  int32 Year = 6 [json_name = "year", (.NYT.column_name) = "year"];
  string SearchUrl = 7 [json_name = "search_url", deprecated = true, (.NYT.column_name) = "search_url"];
  string SearchRequest = 8 [json_name = "search_request", (.NYT.column_name) = "search_request"];
}

message TMusicBands {
  repeated .NAlice.NData.TMusicBand Bands = 1 [json_name = "bands", (.NYT.column_name) = "bands"];
}

message TMusicAlbums {
  repeated .NAlice.NData.TAlbum Albums = 1 [json_name = "albums", (.NYT.column_name) = "albums"];
}

message TMusicTracks {
  repeated .NAlice.NData.TTrack Tracks = 1 [json_name = "tracks", (.NYT.column_name) = "tracks"];
}

enum ELikeStatus {
  Undefined = 0;
  None = 1;
  Liked = 2;
  Disliked = 3;
}

