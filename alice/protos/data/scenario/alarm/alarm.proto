syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.scenario.alarm";
option go_package = "a.yandex-team.ru/alice/protos/data/scenario/alarm";

import "alice/protos/data/timezone.proto";
import "google/protobuf/struct.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDefaultSound {
  enum ESoundType {
    DEFAULT = 0;
    EXPERIMENTAL = 1;
    BIRDS = 2;
    KIDS = 3;
    ALARM_FROM_ALICE = 4;
  }

  .NAlice.NData.TDefaultSound.ESoundType SoundType = 1 [json_name = "sound_type"];
}

message TAlarmSoundSettings {
  message TMediaSettings {
    reserved "MediaType";
    reserved 3;
    message TServerAction {
      string Name = 1 [json_name = "name"];
      .google.protobuf.Struct Payload = 2 [json_name = "payload"];
      bool NotPrefetchable = 3 [json_name = "not_prefetchable"];
    }

    .google.protobuf.Struct RawInfo = 1 [json_name = "raw_info"];
    oneof Media {
      .NAlice.NData.TAlarmSoundSettings.TMediaSettings.TServerAction ServerAction = 2 [json_name = "server_action"];
      .NAlice.NData.TDefaultSound DefaultSound = 4 [json_name = "default_sound"];
    }
  }

  message TSoundLevelInfo {
    uint32 MinSoundLevel = 1 [json_name = "min_sound_level"];
    uint32 MaxSoundLevel = 2 [json_name = "max_sound_level"];
    uint32 VolumeStepMs = 3 [json_name = "volume_step_ms"];
    float MinPercentSoundLevel = 4 [json_name = "min_percent_sound_level"];
    float MaxPercentSoundLevel = 5 [json_name = "max_percent_sound_level"];
  }

  .NAlice.NData.TAlarmSoundSettings.TSoundLevelInfo SoundLevelInfo = 1 [json_name = "sound_level_info"];
  .NAlice.NData.TAlarmSoundSettings.TMediaSettings MediaSettings = 2 [json_name = "media_settings"];
}

message TAlarm {
  reserved "Enabled";
  reserved 4;
  message TDate {
    uint32 Year = 1 [json_name = "year"];
    uint32 Month = 2 [json_name = "month"];
    uint32 Day = 3 [json_name = "day"];
  }

  message TTime {
    uint32 Hours = 1 [json_name = "hours"];
    uint32 Minutes = 2 [json_name = "minutes"];
    uint32 Seconds = 3 [json_name = "seconds"];
  }

  message TActivationDay {
    oneof ActivationDay {
      .NAlice.NData.TAlarm.EWeekday Weekday = 1 [json_name = "weekday"];
      .NAlice.NData.TAlarm.TDate Date = 2 [json_name = "date"];
    }
  }

  message TAlarmAction {
    enum EExecutionMode {
      ALWAYS = 0;
      NON_MEDIA = 1;
    }

    string SerializedAction = 1 [json_name = "serialized_action"];
    .NAlice.NData.TAlarm.TAlarmAction.EExecutionMode ExecutionMode = 2 [json_name = "execution_mode"];
    optional uint32 OffsetSeconds = 3 [json_name = "offset_seconds"];
  }

  message TSnoozeMetaInfo {
    string SnoozedAlarmId = 1 [json_name = "snoozed_alarm_id"];
  }

  enum EWeekday {
    NONE = 0;
    MONDAY = 1;
    TUESDAY = 2;
    WEDNESDAY = 3;
    THURSDAY = 4;
    FRIDAY = 5;
    SATURDAY = 6;
    SUNDAY = 7;
  }

  string AlarmId = 1 [json_name = "alarm_id"];
  .NAlice.NData.TAlarm.TTime LocalTime = 2 [json_name = "local_time"];
  .NAlice.NData.TTimezone Timezone = 7 [json_name = "timezone"];
  bool CurrentlyPlaying = 3 [json_name = "currently_playing"];
  repeated .NAlice.NData.TAlarm.TActivationDay ActivationDays = 5 [json_name = "activation_days"];
  repeated .NAlice.NData.TAlarm.TAlarmAction AlarmActions = 6 [json_name = "alarm_actions"];
  .NAlice.NData.TAlarmSoundSettings AlarmSoundSettings = 8 [json_name = "alarm_sound_settings"];
  bool Disabled = 9 [json_name = "disabled"];
  string Title = 10 [json_name = "title"];
  uint64 EditTimestamp = 11 [json_name = "edit_timestamp"];
  .NAlice.NData.TAlarm.TSnoozeMetaInfo SnoozeMetaInfo = 13 [json_name = "snooze_meta_info"];
  optional uint32 SnoozeTime = 12 [json_name = "snooze_time"];
  optional uint32 ApproachingOffset = 14 [json_name = "approaching_offset"];
}

