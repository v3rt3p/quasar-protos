syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.search_result";
option java_outer_classname = "SearchResult";
option go_package = "a.yandex-team.ru/alice/protos/data/search_result";

import "alice/protos/data/video/video.proto";
import "google/protobuf/struct.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TGetVideoGalleriesRequest {
  string CategoryId = 1 [json_name = "category_id"];
}

message TSearchResultItem {
  enum EItemType {
    unknown = 0;
    entity = 1;
    search = 2;
    actor = 3;
    association = 4;
    collection = 5;
  }

  bool Visible = 1 [json_name = "visible"];
  int32 Number = 2 [json_name = "number"];
  .NAlice.TSearchResultItem.EItemType ContentType = 3 [json_name = "content_type"];
  oneof Item {
    .NAlice.TVideoItem VideoItem = 21 [json_name = "video_item"];
    .NAlice.TPersonItem PersonItem = 22 [json_name = "person_item"];
    .NAlice.TCollectionItem CollectionItem = 23 [json_name = "collection_item"];
    .NAlice.TOttVideoItem OttVideoItem = 24 [json_name = "ott_video_item"];
    .NAlice.TWebVideoItem SearchVideoItem = 25 [json_name = "search_video_item"];
  }
}

message TSearchResultGallery {
  string Title = 1 [json_name = "title"];
  bool Visible = 2 [json_name = "visible"];
  repeated .NAlice.TSearchResultItem Items = 3 [json_name = "items"];
  .google.protobuf.Struct DivJson = 4 [json_name = "div_json"];
}

message TSearchResultData {
  repeated .NAlice.TSearchResultGallery Galleries = 1 [json_name = "galleries"];
}

