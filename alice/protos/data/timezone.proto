syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data";
option go_package = "a.yandex-team.ru/alice/protos/data";

import "yt/yt_proto/yt/formats/extension.proto";

message TTimezone {
  string TimezoneName = 1 [json_name = "timezone_name"];
  int64 OffsetSeconds = 2 [json_name = "offset_seconds"];
}

message TDateTime {
  uint64 Epoch = 1 [json_name = "epoch"];
  string TimeZone = 2 [json_name = "timezone"];
}

