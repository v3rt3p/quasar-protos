syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.device_control_panel";
option java_outer_classname = "ScenariosProto";
option go_package = "a.yandex-team.ru/alice/protos/data/device_control_panel";

import "alice/protos/data/device_control_panel/common_scenario_settings.proto";
import "alice/protos/data/device_control_panel/common_scenario_state.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTotalScenario {
  .NAlice.TCommonScenarioSettings Settings = 1 [json_name = "settings"];
  .NAlice.TCommonScenarioState State = 2 [json_name = "state"];
}

message TVideoScenario {
  .NAlice.TCommonScenarioSettings Settings = 1 [json_name = "settings"];
  .NAlice.TCommonScenarioState State = 2 [json_name = "state"];
}

message TTvChannelsScenario {
  .NAlice.TCommonScenarioSettings Settings = 1 [json_name = "settings"];
  .NAlice.TCommonScenarioState State = 2 [json_name = "state"];
}

message TInputControlScenario {
  .NAlice.TCommonScenarioSettings Settings = 1 [json_name = "settings"];
  .NAlice.TCommonScenarioState State = 2 [json_name = "state"];
}

message TExternalAppScenario {
  .NAlice.TCommonScenarioSettings Settings = 1 [json_name = "settings"];
  .NAlice.TCommonScenarioState State = 2 [json_name = "state"];
}

