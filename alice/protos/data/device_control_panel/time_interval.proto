syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.device_control_panel";
option java_outer_classname = "TimeIntervalProto";
option go_package = "a.yandex-team.ru/alice/protos/data/device_control_panel";

import "alice/protos/data/device_control_panel/local_time.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTimeInterval {
  message TBoundary {
    .NAlice.TLocalTime Time = 1 [json_name = "time"];
    .NAlice.TDayOfWeek DayOfWeek = 2 [json_name = "day_of_week"];
  }

  .NAlice.TLocalTime StartTime = 1 [json_name = "start_time"];
  .NAlice.TLocalTime EndTime = 2 [json_name = "end_time"];
  .NAlice.TDayOfWeek DayOfWeek = 3 [json_name = "day_of_week"];
  .NAlice.TTimeInterval.TBoundary Start = 4 [json_name = "start"];
  .NAlice.TTimeInterval.TBoundary End = 5 [json_name = "end"];
}

