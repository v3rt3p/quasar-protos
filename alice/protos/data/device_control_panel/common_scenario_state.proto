syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.device_control_panel";
option java_outer_classname = "CommonScenarioStateProto";
option go_package = "a.yandex-team.ru/alice/protos/data/device_control_panel";

import "google/protobuf/duration.proto";
import "alice/protos/data/device_control_panel/time_interval.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCommonScenarioState {
  enum EDisabledReason {
    Undefined = 0;
    User = 1;
    DailyLimitExceeded = 2;
    DisabledPeriod = 3;
  }

  bool Disabled = 1 [json_name = "disabled", (.NYT.column_name) = "disabled"];
  .NAlice.TCommonScenarioState.EDisabledReason DisabledReason = 2 [json_name = "disabled_reason", (.NYT.column_name) = "disabled_reason"];
  .google.protobuf.Duration DailyUsage = 3 [json_name = "daily_usage", (.NYT.column_name) = "daily_usage"];
  .NAlice.TTimeInterval CurrentTimeInterval = 4 [json_name = "current_time_interval", (.NYT.column_name) = "current_time_interval"];
}

