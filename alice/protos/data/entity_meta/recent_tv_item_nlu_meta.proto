syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.entity_meta";
option go_package = "a.yandex-team.ru/alice/protos/data/entity_meta";

import "alice/protos/data/tv/recent/recent_usage_info.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TRecentTvItemMeta {
  option (.NYT.default_field_flags) = SERIALIZATION_PROTOBUF;
  .NAlice.NTv.TRecentUsageInfo UsageInfo = 1 [json_name = "usage_info", (.NYT.column_name) = "usage_info"];
  uint32 Position = 2 [json_name = "position", (.NYT.column_name) = "position"];
}

