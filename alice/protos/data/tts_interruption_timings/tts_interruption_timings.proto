syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.tts_interruption_timings";
option java_outer_classname = "TtsInterruptionTimingsProto";
option go_package = "a.yandex-team.ru/alice/protos/data/tts_interruption_timings";

import "yt/yt_proto/yt/formats/extension.proto";

message TTtsInterruptionTimings {
  message TTiming {
    string Word = 1 [json_name = "word"];
    uint64 StartMs = 2 [json_name = "start_ms"];
    uint64 FinishMs = 3 [json_name = "finish_ms"];
  }

  repeated .NAlice.TTtsInterruptionTimings.TTiming Timings = 1 [json_name = "timings"];
  uint64 TriggerMs = 2 [json_name = "trigger_ms"];
}

