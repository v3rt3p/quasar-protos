syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.connection";
option java_outer_classname = "ConnectionStatusProto";
option go_package = "a.yandex-team.ru/alice/protos/data/connection";

import "yt/yt_proto/yt/formats/extension.proto";

message TConnectionStatus {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  bool IsConnected = 1 [json_name = "is_connected", (.NYT.column_name) = "is_connected"];
  optional uint32 LocalPort = 2 [json_name = "local_port", (.NYT.column_name) = "local_port"];
}

