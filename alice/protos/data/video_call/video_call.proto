syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data.video_call";
option go_package = "a.yandex-team.ru/alice/protos/data/video_call";

import "yt/yt_proto/yt/formats/extension.proto";

message TProviderContactList {
  repeated .NAlice.NData.TProviderContactData ContactData = 1 [json_name = "contact_data"];
}

message TProviderContactData {
  message TTelegramContactData {
    reserved "LookupKey";
    reserved 3;
    string DisplayName = 1 [json_name = "display_name"];
    string UserId = 2 [json_name = "user_id"];
  }

  oneof ProviderData {
    .NAlice.NData.TProviderContactData.TTelegramContactData TelegramContactData = 1 [json_name = "telegram_contact_data"];
  }
}

