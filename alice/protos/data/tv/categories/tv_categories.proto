// Reconstructed from YandexQcApp.apk (magritte 5000001628 firmware).
// Original file is compiled into the app with Yandex's "ry" protobuf codegen,
// which strips the embedded FileDescriptorProto — the schema below was rebuilt
// from the generated Java (TvCategoriesProto.java): field names from the
// OrBuilder interfaces, numbers from *_FIELD_NUMBER constants, types and
// presence from writeTo()/getSerializedSize().
//
// Wire format cross-checked against YandexTvHome.apk (the caller):
// POST {gproxyUrl}/get_tv_categories  (gproxyUrl = https://rpc.alice.yandex.net/gproxy/)

syntax = "proto3";

package NAlice.NTv;

import "alice/protos/data/avatar/avatar.proto";

option java_package = "ru.yandex.alice.protos.data.tv.categories";
option java_outer_classname = "TvCategoriesProto";

enum ECategoriesFeatures {
  UnknownCategoryFeature = 0;
  SupportSportEvents = 1;
  SportSection = 2;
}

message TGetTvCategoriesRequest {
  bool kid_mode_enabled = 1;
  string restriction_age = 2;
  repeated ECategoriesFeatures categories_features = 3 [packed = true];
}

message TGetTvCategoriesResponse {
  repeated TTvCategory available_categories = 1;
  optional string i_cookie = 2;
}

message TTvCategory {
  string category_id = 1;
  string title = 2;
  optional uint32 rank = 3;
  optional string icon = 4;
  optional string persistent_client_category_id = 5;
  optional string request_tag = 6;
  optional string selected_icon = 7;
  optional .NAlice.TAvatarMdsImage mds_icon = 8;
  optional .NAlice.TAvatarMdsImage selected_mds_icon = 9;
  optional bool preserve_icon_colors = 10;
}
