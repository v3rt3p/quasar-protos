syntax = "proto3";

package NAlice.NTv;

option java_package = "ru.yandex.alice.protos.data.tv.recent";
option java_outer_classname = "RecentExternalAppVideo";
option go_package = "a.yandex-team.ru/alice/protos/data/tv/recent";

import "yt/yt_proto/yt/formats/extension.proto";

message TRecentExternalAppVideoItem {
  enum EAspectRatio {
    HORIZONTAL = 0;
    SQUARE = 1;
    VERTICAL = 2;
  }

  enum ERecentType {
    CONTINUE_WATCHING = 0;
    NEXT_EPISODE = 1;
    NEW_EPISODE = 2;
    WILL_WATCH = 3;
  }

  string Id = 1 [json_name = "id"];
  string PackageName = 2 [json_name = "package_name"];
  string Title = 3 [json_name = "title"];
  string AppIconUri = 7 [json_name = "app_icon_uri"];
  string IntentUri = 8 [json_name = "intent_uri"];
  bool IsLive = 9 [json_name = "is_live"];
  int64 DurationMs = 10 [json_name = "duration_ms"];
  int64 PositionMs = 11 [json_name = "position_ms"];
  .NAlice.NTv.TRecentExternalAppVideoItem.EAspectRatio PosterAspectRatio = 12 [json_name = "poster_aspect_ratio"];
  .NAlice.NTv.TRecentExternalAppVideoItem.ERecentType ItemRecentType = 13 [json_name = "recent_type"];
  string AppName = 14 [json_name = "app_name"];
  optional string PosterUri = 4 [json_name = "poster_uri"];
  optional string ThumbnailUri = 5 [json_name = "thumbnail_uri"];
  optional string PreviewVideoUri = 6 [json_name = "preview_video_uri"];
}

