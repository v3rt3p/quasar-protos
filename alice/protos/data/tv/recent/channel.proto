syntax = "proto3";

package NAlice.NTv;

option java_package = "ru.yandex.alice.protos.data.tv.recent";
option java_outer_classname = "RecentChannel";
option go_package = "a.yandex-team.ru/alice/protos/data/tv/recent";

import "alice/protos/data/tv/channels/common.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TRecentChannelItem {
  .NAlice.NTv.TTvChannelId Id = 1 [json_name = "id"];
  string Name = 2 [json_name = "name"];
  .NAlice.NTv.EChannelType ChannelType = 3 [json_name = "channel_type"];
  string InputId = 4 [json_name = "input_id"];
  string IconUri = 5 [json_name = "icon_uri"];
}

