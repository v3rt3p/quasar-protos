syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.data.location";
option java_outer_classname = "Room";
option go_package = "a.yandex-team.ru/alice/protos/data/location";

import "alice/protos/data/device/info.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TUserRoom {
  string Id = 1 [json_name = "id"];
  string Name = 2 [json_name = "name"];
  string HouseholdId = 3 [json_name = "household_id"];
  .NAlice.TUserSharingInfo SharingInfo = 4 [json_name = "sharing_info"];
  repeated string Aliases = 5 [json_name = "aliases"];
  repeated string Permissions = 6 [json_name = "permissions"];
}

