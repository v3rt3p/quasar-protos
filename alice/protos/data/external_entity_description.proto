syntax = "proto3";

package NAlice.NData;

option java_package = "ru.yandex.alice.protos.data";
option java_outer_classname = "ExternalEntityDescriptionProto";
option go_package = "a.yandex-team.ru/alice/protos/data";

import "alice/protos/data/entity_meta/recent_tv_item_nlu_meta.proto";
import "alice/protos/data/entity_meta/tv_channel_nlu_meta.proto";
import "alice/protos/data/entity_meta/video_nlu_meta.proto";
import "alice/protos/data/entity_meta/reminders_meta.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TExternalEntityDescription {
  message TEntityItem {
    message TEntityItemPhrase {
      string Phrase = 1 [json_name = "phrase"];
    }

    message TEntityValue {
      string StringValue = 1 [json_name = "string_value"];
    }

    .NAlice.NData.TExternalEntityDescription.TEntityItem.TEntityValue Value = 1 [json_name = "value"];
    repeated .NAlice.NData.TExternalEntityDescription.TEntityItem.TEntityItemPhrase Phrases = 2 [json_name = "phrases"];
    oneof Meta {
      .NAlice.TVideoGalleryItemMeta VideoMeta = 3 [json_name = "video_meta"];
      .NAlice.TTvChannelItemMeta TvChannelMeta = 4 [json_name = "tv_channel_meta"];
      .NAlice.TRecentTvItemMeta RecentTvItemMeta = 5 [json_name = "recent_tv_item_meta"];
      .NAlice.TRemindersMeta RemindersMeta = 6 [json_name = "reminders_meta"];
    }
  }

  string Name = 1 [json_name = "name"];
  repeated .NAlice.NData.TExternalEntityDescription.TEntityItem Items = 2 [json_name = "items"];
}

