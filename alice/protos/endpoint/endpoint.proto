syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint";
option java_outer_classname = "EndpointProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint;endpointpb";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "alice/library/client/protos/client_info.proto";
import "alice/protos/data/color/color.proto";
import "alice/protos/endpoint/any_capability.proto";
import "alice/protos/endpoint/common.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TEndpoint {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  message TMeta {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    message TTag {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      enum ELayoutTag {
        UnknownLayout = 0;
        Center = 1;
        Left = 2;
        Right = 3;
        Front = 4;
        Back = 5;
        Top = 6;
        Bottom = 7;
      }

      oneof Tag {
        option (.NYT.variant_field_name) = "tag";
        .NAlice.TEndpoint.TMeta.TTag.ELayoutTag Layout = 1 [json_name = "layout", (.NYT.column_name) = "layout"];
      }
    }

    .NAlice.TEndpoint.EEndpointType Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
    .NAlice.TEndpoint.TDeviceInfo DeviceInfo = 2 [json_name = "device_info", (.NYT.column_name) = "device_info"];
    .NAlice.TEndpoint.EAccessType AccessType = 3 [json_name = "access_type", (.NYT.column_name) = "access_type"];
    repeated .NAlice.TEndpoint.TMeta.TTag Tags = 4 [json_name = "tags", (.NYT.column_name) = "tags"];
    .NAlice.TClientInfoProto ClientInfo = 5 [json_name = "client_info", (.NYT.column_name) = "client_info"];
  }

  message TStatus {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TEndpoint.EEndpointStatus Status = 1 [json_name = "status", (.NYT.column_name) = "status"];
    .google.protobuf.Timestamp UpdatedAt = 2 [json_name = "updated_at", (.NYT.column_name) = "updated_at"];
  }

  message TDeviceInfo {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string Manufacturer = 1 [json_name = "manufacturer", (.NYT.column_name) = "manufacturer"];
    string Model = 2 [json_name = "model", (.NYT.column_name) = "model"];
    string HwVersion = 3 [json_name = "hw_version", (.NYT.column_name) = "hw_version"];
    string SwVersion = 4 [json_name = "sw_version", (.NYT.column_name) = "sw_version"];
    .NAlice.EProtocol Protocol = 5 [json_name = "protocol", (.NYT.column_name) = "protocol"];
    string SerialNumber = 6 [json_name = "serial_number", (.NYT.column_name) = "serial_number"];
    .NAlice.NData.EColor Color = 7 [json_name = "color", (.NYT.column_name) = "color"];
    string SetupCodePayload = 8 [json_name = "setup_code_payload", (.NYT.column_name) = "setup_code_payload"];
  }

  enum EEndpointStatus {
    Unknown = 0;
    Offline = 1;
    Online = 2;
  }

  enum EEndpointType {
    UnknownEndpointType = 0;
    SpeakerEndpointType = 1;
    LightEndpointType = 2;
    SocketEndpointType = 3;
    SensorEndpointType = 4;
    WebOsTvEndpointType = 5;
    SwitchEndpointType = 6;
    WindowCoveringEndpointType = 7;
    DongleEndpointType = 8;
    MotionSensorDeviceType = 9;
    VibrationSensorDeviceType = 10;
    IlluminationSensorDeviceType = 11;
    OpenSensorDeviceType = 12;
    ClimateSensorDeviceType = 13;
    WaterLeakSensorDeviceType = 14;
    ButtonSensorDeviceType = 15;
    GasSensorDeviceType = 16;
    SmokeSensorDeviceType = 17;
    ThermostatDeviceType = 18;
    WarningDeviceType = 19;
    CradleDeviceType = 20;
    PresenceSensorDeviceType = 21;
    PresenceSensorZoneDeviceType = 22;
    BridgeDeviceType = 23;
    IrRemoteDeviceType = 24;
    EarbudsEndpointType = 25;
    EarbudDeviceType = 26;
    EarbudsCaseDeviceType = 27;
    WaterGuardSystemDeviceType = 28;
    WaterValveDeviceType = 29;
    WaterMeterDeviceType = 30;
    RelayDeviceType = 31;
    PowerSourceUpsDeviceType = 32;
    AeroGrillDeviceType = 33;
    ElectricGrillDeviceType = 37;
    WearableAudioRecorderEndpointType = 34;
    DoorLockDeviceType = 35;
    SmartwatchEndpointType = 36;
  }

  enum EAccessType {
    UnknownAccessType = 0;
    Local = 1;
    Embedded = 2;
    Remote = 3;
    Virtual = 4;
  }

  string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  .NAlice.TEndpoint.TMeta Meta = 2 [json_name = "meta", (.NYT.column_name) = "meta"];
  repeated .google.protobuf.Any Capabilities = 3 [json_name = "capabilities", (.NYT.column_name) = "capabilities"];
  repeated .NAlice.TAnyCapabilityHolder AnyCapabilities = 5 [json_name = "any_capabilities", (.NYT.column_name) = "any_capabilities"];
  .NAlice.TEndpoint.TStatus Status = 4 [json_name = "status", (.NYT.column_name) = "status"];
}

