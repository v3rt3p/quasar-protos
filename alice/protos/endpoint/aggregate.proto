syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint";
option java_outer_classname = "AggregateProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint;endpointpb";

import "yt/yt_proto/yt/formats/extension.proto";

message TAggregate {
  message TCompositeMeta {
  }

  message THubMeta {
  }

  message TTandemMeta {
  }

  string MainEndpointId = 1 [json_name = "main_endpoint_id"];
  repeated string EndpointIDs = 2 [json_name = "endpoint_ids"];
  oneof Meta {
    .NAlice.TAggregate.TCompositeMeta CompositeMeta = 3 [json_name = "composite_meta"];
    .NAlice.TAggregate.THubMeta HubMeta = 4 [json_name = "hub_meta"];
    .NAlice.TAggregate.TTandemMeta TandemMeta = 5 [json_name = "tandem_meta"];
  }
}

