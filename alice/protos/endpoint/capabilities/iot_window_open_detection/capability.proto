syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotWindowOpenDetectionCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_window_open_detection;iotwindowopendetectionpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotWindowOpenDetectionCapability {
  message TParameters {
  }

  message TState {
    bool Enable = 1 [json_name = "enable"];
    bool IsOpen = 2 [json_name = "is_open"];
  }

  message TSetIotWindowOpenDetectionDirective {
    string Name = 1000 [json_name = "name"];
    bool Enable = 1 [json_name = "enable"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotWindowOpenDetectionCapability Capability = 1 [json_name = "capability"];
  }

  message TCondition {
    enum EState {
      OpenCondition = 0;
      CloseCondition = 1;
    }

    .NAlice.TIotWindowOpenDetectionCapability.TCondition.EState State = 1 [json_name = "state"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotWindowOpenDetectionCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotWindowOpenDetectionCapability.TState State = 3 [json_name = "state"];
}

