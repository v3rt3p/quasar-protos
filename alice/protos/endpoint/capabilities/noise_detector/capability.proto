syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "NoiseDetectorCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/noise_detector;noisedetectorpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TNoiseDetectorCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = NoiseDetectorCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TCustomNoise {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string Id = 1 [json_name = "id", (.NYT.column_name) = "id"];
  }

  message TNoiseDetectedEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = NoiseDetectedEventType;
    .NAlice.TNoiseDetectorCapability.ENoiseEventType NoiseEventType = 1 [json_name = "noise_event_type", (.NYT.column_name) = "noise_event_type"];
    optional string EventId = 2 [json_name = "event_id", (.NYT.column_name) = "event_id"];
    optional .NAlice.TNoiseDetectorCapability.TCustomNoise CustomNoise = 3 [json_name = "custom_noise", (.NYT.column_name) = "custom_noise"];
  }

  message TStartCustomNoiseRecordingDirective {
    option (.NAlice.SpeechKitName) = "start_custom_noise_recording_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = StartCustomNoiseRecordingDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string SessionId = 1 [json_name = "session_id", (.NYT.column_name) = "session_id"];
  }

  message TStopCustomNoiseRecordingDirective {
    option (.NAlice.SpeechKitName) = "stop_custom_noise_recording_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = StopCustomNoiseRecordingDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string SessionId = 1 [json_name = "session_id", (.NYT.column_name) = "session_id"];
  }

  message TCondition {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.ConditionEvents) = NoiseDetectedEventType;
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events", (.NYT.column_name) = "events"];
    repeated .NAlice.TNoiseDetectorCapability.ENoiseEventType NoiseEventTypes = 2 [json_name = "noise_event_types", (.NYT.column_name) = "noise_event_types"];
    repeated .NAlice.TNoiseDetectorCapability.TCustomNoise CustomNoises = 3 [json_name = "custom_noises", (.NYT.column_name) = "custom_noises"];
  }

  enum ENoiseEventType {
    UNKNOWN = 0;
    CLAP = 1;
    SNAP = 2;
    FALL = 3;
    STOMP = 4;
    CHILD_CRY = 5;
    WATER_SOUND = 6;
    ALARM = 7;
    BREAK_GLASS = 8;
    DOG_BARK = 9;
    MEOW = 10;
    SNEEZING = 11;
    UNIDENTIFIED = 12;
    DOUBLE_CLAP = 13;
    CUSTOM = 14;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TNoiseDetectorCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TNoiseDetectorCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

