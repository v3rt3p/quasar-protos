syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "NoiseDetectorCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/noise_detector;noisedetectorpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TNoiseDetectorCapability {
  message TParameters {
  }

  message TState {
    bool Enabled = 1 [json_name = "enabled"];
  }

  message TCustomNoise {
    string Id = 1 [json_name = "id"];
  }

  message TNoiseDetectedEvent {
    .NAlice.TNoiseDetectorCapability.ENoiseEventType NoiseEventType = 1 [json_name = "noise_event_type"];
    optional string EventId = 2 [json_name = "event_id"];
    optional .NAlice.TNoiseDetectorCapability.TCustomNoise CustomNoise = 3 [json_name = "custom_noise"];
  }

  message TStartCustomNoiseRecordingDirective {
    string Name = 1000 [json_name = "name"];
    string SessionId = 1 [json_name = "session_id"];
  }

  message TStopCustomNoiseRecordingDirective {
    string Name = 1000 [json_name = "name"];
    string SessionId = 1 [json_name = "session_id"];
  }

  message TCondition {
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events"];
    repeated .NAlice.TNoiseDetectorCapability.ENoiseEventType NoiseEventTypes = 2 [json_name = "noise_event_types"];
    repeated .NAlice.TNoiseDetectorCapability.TCustomNoise CustomNoises = 3 [json_name = "custom_noises"];
  }

  enum ENoiseEventType {
    UNKNOWN = 0;
    CLAP = 1;
    SNAP = 2;
    FALL = 3;
    STOMP = 4;
    CHILD_CRY = 5;
    WATER_SOUND = 6;
    ALARM = 7;
    BREAK_GLASS = 8;
    DOG_BARK = 9;
    MEOW = 10;
    SNEEZING = 11;
    UNIDENTIFIED = 12;
    DOUBLE_CLAP = 13;
    CUSTOM = 14;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TNoiseDetectorCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TNoiseDetectorCapability.TState State = 3 [json_name = "state"];
}

