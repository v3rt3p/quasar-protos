    message TColorSchemeData {
      .NAlice.TBrowserControlCapability.EColorScheme ColorScheme = 1 [json_name = "color_scheme"];
      optional .NAlice.TBrowserControlCapability.EColor Color = 2 [json_name = "color"];
      optional .NAlice.TBrowserControlCapability.ETint Tint = 3 [json_name = "tint"];
    }

    message TAvailableThemesData {
      repeated .NAlice.TBrowserControlCapability.EColorScheme AvailableColorSchemes = 1 [json_name = "available_color_schemes"];
      repeated .NAlice.TBrowserControlCapability.EColor AvailableColors = 2 [json_name = "available_colors"];
      repeated .NAlice.TBrowserControlCapability.ETint AvailableTints = 3 [json_name = "available_tints"];
    }

    message TTabGroupsUserSettings {
      optional bool PrefersCloudTabGroups = 1 [json_name = "prefers_cloud_tab_groups"];
      optional bool PrefersPinnedTabGroups = 2 [json_name = "prefers_pinned_tab_groups"];
    }

    message TBrowserState {
      reserved "AvailableThemes";
      reserved "AvailableBrowsingDataTypes";
      reserved 4;
      reserved 5;
      .NAlice.TBrowserControlCapability.TState.TColorSchemeData CurrentColorScheme = 1 [json_name = "current_color_scheme"];
      .NAlice.TBrowserControlCapability.TState.TAliceChatData AliceChatData = 2 [json_name = "alice_chat_data"];
      string BrowserVersion = 3 [json_name = "browser_version"];
      .NAlice.TBrowserControlCapability.TState.TTabGroupsUserSettings TabGroupsUserSettings = 6 [json_name = "tab_groups_user_settings"];
      .NAlice.TBrowserControlCapability.EBookmarksPanelVisibility BookmarksPanelVisibilityState = 7 [json_name = "bookmarks_panel_visibility_state"];
    }

    .NAlice.TBrowserControlCapability.TState.TBrowserState CurrentBrowserState = 2 [json_name = "current_browser_state", (.NYT.column_name) = "current_browser_state"];
    .NAlice.TBrowserControlCapability.TState.TAvailableThemesData AvailableThemes = 3 [json_name = "available_themes", (.NYT.column_name) = "available_themes"];
    repeated .NAlice.TBrowserControlCapability.EClearData AvailableBrowsingDataTypes = 4 [json_name = "available_browsing_data_types", (.NYT.column_name) = "available_browsing_data_types"];
  }

