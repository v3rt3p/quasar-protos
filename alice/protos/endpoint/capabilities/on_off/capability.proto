syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "OnOffCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/on_off;onoffpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TOnOffCapability {
  message TParameters {
    bool Split = 1 [json_name = "split"];
    .NAlice.TOnOffCapability.EInstance Instance = 2 [json_name = "instance"];
  }

  message TState {
    bool On = 1 [json_name = "on"];
    .NAlice.TOnOffCapability.EStartupMode StartupMode = 2 [json_name = "startup_mode"];
  }

  message TOnOffDirective {
    string Name = 1000 [json_name = "name"];
    bool On = 1 [json_name = "on"];
  }

  message TToggleDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TSetStartupModeDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.TOnOffCapability.EStartupMode StartupMode = 1 [json_name = "startup_mode"];
  }

  message TScreenOffDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TOnWithTimedOffDirective {
    string Name = 1000 [json_name = "name"];
    uint32 OnTimeMs = 1 [json_name = "on_time_ms"];
  }

  message TUpdateStateEvent {
    .NAlice.TOnOffCapability Capability = 1 [json_name = "capability"];
  }

  message TCondition {
    .NAlice.TOnOffCapability.EOnOffConditionState OnOffState = 1 [json_name = "on_off_state"];
  }

  message TOnOffFilter {
    .NAlice.TOnOffCapability.EOnOffConditionState OnOffState = 1 [json_name = "on_off_state"];
  }

  enum EInstance {
    UnknownInstance = 0;
    BacklightInstance = 1;
  }

  enum EStartupMode {
    Unknown = 0;
    Keep = 1;
    On = 2;
    Off = 3;
  }

  enum EOnOffConditionState {
    OnCondition = 0;
    OffCondition = 1;
    ToggleCondition = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TOnOffCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TOnOffCapability.TState State = 3 [json_name = "state"];
}

