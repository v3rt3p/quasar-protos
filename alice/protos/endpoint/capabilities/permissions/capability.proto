syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "PermissionsCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/permissions;permissionspb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TServerPermissionsCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = ServerPermissionsCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TServerPermissionsCapability.TPermission Permissions = 1 [json_name = "permissions", (.NYT.column_name) = "permissions"];
  }

  message TGrantablePermission {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "Status";
    reserved 2;
    bool Granted = 1 [json_name = "granted", (.NYT.column_name) = "granted"];
  }

  message TStatusPermission {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum EStatus {
      UnknownStatus = 0;
      Granted = 1;
      Denied = 2;
      AskEveryTime = 3;
    }

    .NAlice.TServerPermissionsCapability.TStatusPermission.EStatus Status = 1 [json_name = "status", (.NYT.column_name) = "status"];
  }

  message TVersatilePermission {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "Status";
    reserved 2;
    enum EGrantType {
      UnknownGrantType = 0;
      Blocked = 1;
      WhenInApp = 2;
      Always = 3;
    }

    .NAlice.TServerPermissionsCapability.TVersatilePermission.EGrantType GrantType = 1 [json_name = "grant_type", (.NYT.column_name) = "grant_type"];
  }

  message TPermission {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "AllowScheduleExactAlarm";
    reserved "AllowAccessMicrophone";
    reserved 4;
    reserved 12;
    oneof Permission {
      option (.NYT.oneof_flags) = VARIANT;
      option (.NYT.variant_field_name) = "permission";
      .NAlice.TServerPermissionsCapability.TVersatilePermission AllowAccessLocation = 1 [json_name = "allow_access_location", (.NYT.column_name) = "allow_access_location"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowReadContacts = 2 [json_name = "allow_read_contacts", (.NYT.column_name) = "allow_read_contacts"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowCallPhone = 3 [json_name = "allow_call_phone", (.NYT.column_name) = "allow_call_phone"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowPostNotifications = 5 [json_name = "allow_post_notifications", (.NYT.column_name) = "allow_post_notifications"];
      .NAlice.TServerPermissionsCapability.TVersatilePermission AllowInternetConnectionInfo = 6 [json_name = "allow_internet_connection_info", (.NYT.column_name) = "allow_internet_connection_info"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowReadCalendar = 7 [json_name = "allow_read_calendar", (.NYT.column_name) = "allow_read_calendar"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowWriteCalendar = 8 [json_name = "allow_write_calendar", (.NYT.column_name) = "allow_write_calendar"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowScheduleExactAlarms = 9 [json_name = "allow_schedule_exact_alarms", (.NYT.column_name) = "allow_schedule_exact_alarms"];
      .NAlice.TServerPermissionsCapability.TVersatilePermission AllowAccessPreciseLocation = 10 [json_name = "allow_access_precise_location", (.NYT.column_name) = "allow_access_precise_location"];
      .NAlice.TServerPermissionsCapability.TGrantablePermission AllowAccessCamera = 11 [json_name = "allow_access_camera", (.NYT.column_name) = "allow_access_camera"];
      .NAlice.TServerPermissionsCapability.TStatusPermission AllowAccessMicrophoneStatus = 13 [json_name = "allow_access_microphone_status", (.NYT.column_name) = "allow_access_microphone_status"];
    }
  }

  message TRequestPermissionDirective {
    option (.NAlice.SpeechKitName) = "request_permission_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = RequestPermissionDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TServerPermissionsCapability.TPermission Permission = 2 [json_name = "permission", (.NYT.column_name) = "permission"];
    bool IgnoreThrottle = 3 [json_name = "ignore_throttle", (.NYT.column_name) = "ignore_throttle"];
  }

  message TPermissionRequestSuccessEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = PermissionRequestSuccessEventType;
    .NAlice.TServerPermissionsCapability.TPermission Permission = 1 [json_name = "permission", (.NYT.column_name) = "permission"];
  }

  message TPermissionRequestFailureEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = PermissionRequestFailureEventType;
    .NAlice.TServerPermissionsCapability.TPermission Permission = 1 [json_name = "permission", (.NYT.column_name) = "permission"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TServerPermissionsCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TServerPermissionsCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

