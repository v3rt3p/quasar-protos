syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceChatProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_chat;alicechatpb";

import "google/protobuf/descriptor.proto";
import "alice/cuttlefish/services/features_limiter/proto/api/api.proto";
import "alice/protos/api/alicekit/directives/directive.proto";
import "alice/protos/api/alice_mode_info/alice_mode_info.proto";
import "alice/protos/data/dialog_state/dialog_state.proto";
import "alice/protos/div/div2card.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceChatCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceChatCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional bool SupportsRichSuggests = 1 [json_name = "supports_rich_suggests", (.NYT.column_name) = "supports_rich_suggests"];
    optional bool SupportsRichAnswers = 2 [json_name = "supports_rich_answers", (.NYT.column_name) = "supports_rich_answers"];
    optional bool SupportsRichSummary = 3 [json_name = "supports_rich_summary", (.NYT.column_name) = "supports_rich_summary"];
  }

  message TChatNavigationEntry {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum EType {
      Unknown = 0;
      Chat = 1;
      ChatList = 2;
      Skill = 3;
      ChatFolder = 4;
    }

    .NAlice.TAliceChatCapability.TChatNavigationEntry.EType Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
    string Title = 2 [json_name = "title", (.NYT.column_name) = "title"];
    bool CanNavigateBack = 3 [json_name = "can_navigate_back", (.NYT.column_name) = "can_navigate_back"];
    string Id = 4 [json_name = "id", (.NYT.column_name) = "id"];
  }

  message TNavigationState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TAliceChatCapability.TChatNavigationEntry TopmostNavigationEntry = 1 [json_name = "topmost_navigation_entry", (.NYT.column_name) = "topmost_navigation_entry"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool IsChatActive = 1 [json_name = "is_chat_active", (.NYT.column_name) = "is_chat_active"];
    .NAlice.TAliceChatCapability.TNavigationState NavigationState = 2 [json_name = "navigation_state", (.NYT.column_name) = "navigation_state"];
    .NAlice.TDialogState ActiveChatDialogContext = 3 [json_name = "active_chat_dialog_context", (.NYT.column_name) = "active_chat_dialog_context"];
  }

  message TFillChatInputDirective {
    option (.NAlice.SpeechKitName) = "fill_chat_input_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = FillChatInputDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Text = 2 [json_name = "text", (.NYT.column_name) = "text", (.NAlice.LanguageDependent) = NlgText];
  }

  message TShowProPurchaseScreenDirective {
    option (.NAlice.SpeechKitName) = "show_pro_purchase_screen_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowProPurchaseScreenDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TShowFullscreenImageGalleryDirective {
    option (.NAlice.SpeechKitName) = "show_fullscreen_image_gallery_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowFullscreenImageGalleryDirectiveType;
    message TButton {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      string Title = 1 [json_name = "title", (.NYT.column_name) = "title"];
      string IconUrl = 2 [json_name = "icon_url", (.NYT.column_name) = "icon_url"];
      bool IsEnabled = 4 [json_name = "is_enabled", (.NYT.column_name) = "is_enabled"];
      .NAlice.NAliceApi.TDirective Directive = 3 [json_name = "directive", (.NYT.column_name) = "directive"];
    }

    message TImage {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      string ImageUrl = 1 [json_name = "image_url", (.NYT.column_name) = "image_url"];
      repeated .NAlice.TAliceChatCapability.TShowFullscreenImageGalleryDirective.TButton Buttons = 2 [json_name = "buttons", (.NYT.column_name) = "buttons"];
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    uint32 CurrentImage = 2 [json_name = "current_image", (.NYT.column_name) = "current_image"];
    repeated .NAlice.TAliceChatCapability.TShowFullscreenImageGalleryDirective.TImage Images = 3 [json_name = "images", (.NYT.column_name) = "images"];
  }

  message TZoomImageDirective {
    option (.NAlice.SpeechKitName) = "zoom_image_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ZoomImageDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    int32 Step = 2 [json_name = "step", (.NYT.column_name) = "step"];
  }

  message TDownloadImageDirective {
    option (.NAlice.SpeechKitName) = "download_image_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = DownloadImageDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string ImageUrl = 2 [json_name = "image_url", (.NYT.column_name) = "image_url"];
  }

  message TShareImageDirective {
    option (.NAlice.SpeechKitName) = "share_image_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShareImageDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string ImageUrl = 2 [json_name = "image_url", (.NYT.column_name) = "image_url"];
  }

  message TShowPromoScreenDirective {
    option (.NAlice.SpeechKitName) = "show_promo_screen_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowPromoScreenDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string PromoId = 2 [json_name = "promo_id", (.NYT.column_name) = "promo_id"];
  }

  message TSetChatRequestModeDirective {
    option (.NAlice.SpeechKitName) = "set_chat_request_mode_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetChatRequestModeDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NApi.NAlice2Mode.TAlice2ModeInfo.EMode Mode = 2 [json_name = "mode", deprecated = true, (.NYT.column_name) = "mode"];
    .NAlice.NApi.NAlice2Mode.TAlice2ModeInfo RequestModeInfo = 3 [json_name = "request_mode_info", (.NYT.column_name) = "request_mode_info"];
    string Id = 4 [json_name = "id", (.NYT.column_name) = "id"];
  }

  message TAddChatDiv2CardDirective {
    option (.NAlice.SpeechKitName) = "add_chat_div2_card_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = AddChatDiv2CardDirectiveType;
    message TRenderRequestParams {
      string CardId = 1 [json_name = "card_id", (.NYT.column_name) = "card_id"];
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string DialogId = 4 [json_name = "dialog_id", (.NYT.column_name) = "dialog_id"];
    oneof DivCard {
      option (.NYT.variant_field_name) = "div_card";
      .NAlice.TDiv2Card Div2Card = 2 [json_name = "div2_card", (.NYT.column_name) = "div2_card"];
      .NAlice.TAliceChatCapability.TAddChatDiv2CardDirective.TRenderRequestParams RenderRequestParams = 3 [json_name = "render_request_params", (.NYT.column_name) = "render_request_params"];
    }
  }

  message TFinishChatDirective {
    option (.NAlice.SpeechKitName) = "finish_chat_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = FinishChatDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TLimitExceededBannerDirective {
    option (.NAlice.SpeechKitName) = "limit_exceeded_banner_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = LimitExceededBannerDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Text = 2 [json_name = "text", (.NYT.column_name) = "text"];
    string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    .NAlice.NFeaturesLimiter.NProto.NApi.EDecision Decision = 4 [json_name = "decision", (.NYT.column_name) = "decision"];
  }

  message TFewRequestsLeftBannerDirective {
    option (.NAlice.SpeechKitName) = "few_requests_left_banner_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = FewRequestsLeftBannerDirective;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    uint64 RequestsUsed = 2 [json_name = "requests_used", (.NYT.column_name) = "requests_used"];
    uint64 RequestsLimit = 3 [json_name = "requests_limit", (.NYT.column_name) = "requests_limit"];
    uint64 RefreshTimestampSeconds = 4 [json_name = "refresh_timestamp_seconds", (.NYT.column_name) = "refresh_timestamp_seconds"];
    string Text = 5 [json_name = "text", (.NYT.column_name) = "text"];
  }

  message TOpenChatListDirective {
    option (.NAlice.SpeechKitName) = "open_chat_list_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = OpenChatListDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TCreateNewChatDirective {
    option (.NAlice.SpeechKitName) = "create_new_chat_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CreateNewChatDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TChatNavigateBackDirective {
    option (.NAlice.SpeechKitName) = "chat_navigate_back_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ChatNavigateBackDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string NavigationEntryId = 2 [json_name = "navigation_entry_id", (.NYT.column_name) = "navigation_entry_id"];
  }

  message TShowBannerDirective {
    option (.NAlice.SpeechKitName) = "show_banner_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowBannerDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Text = 2 [json_name = "text", (.NYT.column_name) = "text"];
    string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    string Type = 4 [json_name = "type", (.NYT.column_name) = "type"];
  }

  message TShowModalDirective {
    option (.NAlice.SpeechKitName) = "show_modal_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowModalDirectiveType;
    message TButton {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      reserved "Directives";
      reserved 2;
      string Text = 1 [json_name = "text", (.NYT.column_name) = "text"];
      repeated .NAlice.NAliceApi.TDirective Actions = 3 [json_name = "actions", (.NYT.column_name) = "actions"];
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
    string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    repeated .NAlice.TAliceChatCapability.TShowModalDirective.TButton Buttons = 7 [json_name = "buttons", (.NYT.column_name) = "buttons"];
    optional string Description = 4 [json_name = "description", (.NYT.column_name) = "description"];
    optional bool PreventClose = 5 [json_name = "prevent_close", (.NYT.column_name) = "prevent_close"];
    optional bool ShowOnce = 6 [json_name = "show_once", (.NYT.column_name) = "show_once"];
    optional uint32 ShowTimeout = 8 [json_name = "show_timeout", (.NYT.column_name) = "show_timeout"];
  }

  message TShowNotificationDirective {
    option (.NAlice.SpeechKitName) = "show_notification_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowNotificationDirectiveType;
    message TButton {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      string Text = 1 [json_name = "text", (.NYT.column_name) = "text"];
      repeated .NAlice.NAliceApi.TDirective Actions = 2 [json_name = "actions", (.NYT.column_name) = "actions"];
    }

    message TLink {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      string Text = 1 [json_name = "text", (.NYT.column_name) = "text"];
      repeated .NAlice.NAliceApi.TDirective Actions = 3 [json_name = "actions", (.NYT.column_name) = "actions"];
      optional string Href = 2 [json_name = "href", (.NYT.column_name) = "href"];
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
    string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    repeated .NAlice.TAliceChatCapability.TShowNotificationDirective.TButton Buttons = 6 [json_name = "buttons", (.NYT.column_name) = "buttons"];
    repeated .NAlice.TAliceChatCapability.TShowNotificationDirective.TLink Links = 7 [json_name = "links", (.NYT.column_name) = "links"];
    optional string Description = 4 [json_name = "description", (.NYT.column_name) = "description"];
    optional bool ShowOnce = 5 [json_name = "show_once", (.NYT.column_name) = "show_once"];
    optional uint32 ShowTimeout = 8 [json_name = "show_timeout", (.NYT.column_name) = "show_timeout"];
  }

  message TLoginWithCallbackDirective {
    option (.NAlice.SpeechKitName) = "login_with_callback_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = LoginWithCallbackDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Text = 2 [json_name = "text", (.NYT.column_name) = "text"];
    string Title = 3 [json_name = "title", (.NYT.column_name) = "title"];
    repeated .NAlice.NAliceApi.TDirective CallbacksDirectives = 4 [json_name = "callbacks_directives", (.NYT.column_name) = "callbacks_directives"];
  }

  message TVideoFragment {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional string VideoId = 1 [json_name = "video_id", (.NYT.column_name) = "video_id"];
    optional double SeekTime = 2 [json_name = "seek_time", (.NYT.column_name) = "seek_time"];
  }

  message TTextFragment {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional string Text = 1 [json_name = "text", (.NYT.column_name) = "text"];
  }

  message TScrollToFragmentDirective {
    option (.NAlice.SpeechKitName) = "scroll_to_fragment_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ScrollToFragmentDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string ContentUrl = 2 [json_name = "content_url", (.NYT.column_name) = "content_url"];
    string NavigationToFragmentUrl = 3 [json_name = "navigation_to_fragment_url", (.NYT.column_name) = "navigation_to_fragment_url"];
    oneof Fragment {
      option (.NYT.variant_field_name) = "fragment";
      .NAlice.TAliceChatCapability.TTextFragment TextFragment = 4 [json_name = "text_fragment", (.NYT.column_name) = "text_fragment"];
      .NAlice.TAliceChatCapability.TVideoFragment VideoFragment = 5 [json_name = "video_fragment", (.NYT.column_name) = "video_fragment"];
    }
  }

  message TScrollToTopDirective {
    option (.NAlice.SpeechKitName) = "scroll_to_top_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ScrollToTopDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TScreenshotTakenDirective {
    option (.NAlice.SpeechKitName) = "screenshot_taken_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ScreenshotTakenDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TOpenSerpViewDirective {
    option (.NAlice.SpeechKitName) = "open_serp_view_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = OpenSerpViewDirectiveType;
    enum ESerpViewType {
      UnknownSerpViewType = 0;
      SerpEthicNews = 1;
      SerpEthicCelebs = 2;
      SerpEthicPorno = 3;
      SerpEthicVpn = 4;
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Url = 2 [json_name = "url", (.NYT.column_name) = "url"];
    string Query = 3 [json_name = "query", (.NYT.column_name) = "query"];
    .NAlice.TAliceChatCapability.TOpenSerpViewDirective.ESerpViewType SerpViewType = 4 [json_name = "serp_view_type", (.NYT.column_name) = "serp_view_type"];
  }

  message TSuggestReaskDirective {
    option (.NAlice.SpeechKitName) = "suggest_reask_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SuggestReaskDirectiveType;
    enum EReason {
      R_UNKNOWN = 0;
      R_LIMIT_ALMOST_EXCEEDED = 1;
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string RequestId = 2 [json_name = "request_id", (.NYT.column_name) = "request_id"];
    .NAlice.NApi.NAlice2Mode.TAlice2ModeInfo ModeInfo = 3 [json_name = "mode_info", (.NYT.column_name) = "mode_info"];
    string Text = 4 [json_name = "text", (.NYT.column_name) = "text"];
    .NAlice.TAliceChatCapability.TSuggestReaskDirective.EReason Reason = 5 [json_name = "reason", (.NYT.column_name) = "reason"];
