  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceChatCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceChatCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

