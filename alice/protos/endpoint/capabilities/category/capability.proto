syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "CategoryCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/category;categorypb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCategoryCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = CategoryCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TCategoryCapability.Category Categories = 1 [json_name = "categories", (.NYT.column_name) = "categories"];
    optional .NAlice.TCategoryCapability.Category CurrentCategory = 2 [json_name = "current_category", (.NYT.column_name) = "current_category"];
    optional bool IsCategoriesVisible = 3 [json_name = "is_categories_visible", (.NYT.column_name) = "is_categories_visible"];
  }

  message Category {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string CategoryId = 1 [json_name = "category_id", (.NYT.column_name) = "category_id"];
    optional string CategoryName = 2 [json_name = "category_name", (.NYT.column_name) = "category_name"];
  }

  message TOpenCategoryDirective {
    option (.NAlice.SpeechKitName) = "open_tv_category_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CategoryDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string CategoryId = 1 [json_name = "category_id", (.NYT.column_name) = "category_id"];
  }

  message TShowTvCategoriesDirective {
    option (.NAlice.SpeechKitName) = "show_tv_categories_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowTvCategoriesDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message THideTvCategoriesDirective {
    option (.NAlice.SpeechKitName) = "hide_tv_categories_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = HideTvCategoriesDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TShowWhatYouCanDirective {
    option (.NAlice.SpeechKitName) = "show_what_you_can_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowWhatYouCanDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string VideoUrl = 1 [json_name = "video_url", (.NYT.column_name) = "video_url"];
    string PlaceholderUrl = 2 [json_name = "placeholder_url", (.NYT.column_name) = "placeholder_url"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TCategoryCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TCategoryCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

