syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IntonationSpottingProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/intonation_spotting;intonation_spotting";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/spotter/threshold_type.proto";
import "alice/protos/data/spotter/enabling_reason.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIntonationSpottingCapability {
  message TParameters {
  }

  message TSettings {
    optional bool Enabled = 1 [json_name = "enabled"];
    optional uint32 EnableTimeMs = 2 [json_name = "enable_time_ms"];
  }

  message TState {
    reserved "ActivationReason";
    reserved 3;
    bool IsIntonationSpottingEnabled = 1 [json_name = "is_intonation_spotting_enabled"];
    .NAlice.NData.ESpotterThresholdType Threshold = 2 [json_name = "threshold"];
    .NAlice.NData.ESpotterEnablingReason EnablingReason = 4 [json_name = "enabling_reason"];
    .NAlice.TIntonationSpottingCapability.TSettings Settings = 5 [json_name = "settings"];
  }

  message TSetIntonationSpottingDirective {
    reserved "ActivationReason";
    reserved 3;
    string Name = 1000 [json_name = "name"];
    bool EnableIntonationSpotting = 1 [json_name = "enable_intonation_spotting"];
    .NAlice.NData.ESpotterThresholdType Threshold = 2 [json_name = "threshold"];
    optional .NAlice.NData.ESpotterEnablingReason EnablingReason = 4 [json_name = "enabling_reason"];
    optional uint32 EnableTimeMs = 5 [json_name = "enable_time_ms"];
  }

  message TSetIntonationSpottingSettingsDirective {
    string Name = 1000 [json_name = "name"];
    optional bool Enabled = 1 [json_name = "enabled"];
    optional uint32 EnableTimeMs = 2 [json_name = "enable_time_ms"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIntonationSpottingCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIntonationSpottingCapability.TState State = 3 [json_name = "state"];
}

