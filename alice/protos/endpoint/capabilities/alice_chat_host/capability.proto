syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceChatHostProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_chat_host;alicechathostpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceChatHostCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceChatHostCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TDismissChatDirective {
    option (.NAlice.SpeechKitName) = "dismiss_chat_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = DismissChatDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceChatHostCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceChatHostCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

