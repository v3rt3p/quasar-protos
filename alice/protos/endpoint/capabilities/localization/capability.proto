syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LocalizationProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/localization;localizationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/localization/localization.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLocalizationCapability {
  message TParameters {
  }

  message TState {
    .NAlice.NData.ECountry Country = 1 [json_name = "country"];
    .NAlice.NData.ELocale Locale = 2 [json_name = "locale"];
  }

  message TSetLocalizationDirective {
    .NAlice.NData.ECountry Country = 1 [json_name = "country"];
    .NAlice.NData.ELocale Locale = 2 [json_name = "locale"];
    string Name = 3 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TLocalizationCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TLocalizationCapability.TState State = 3 [json_name = "state"];
}

