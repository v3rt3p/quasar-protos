syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LocalizationProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/localization;localizationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/localization/localization.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLocalizationCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = LocalizationCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.NData.ECountry Country = 1 [json_name = "country", (.NYT.column_name) = "country"];
    .NAlice.NData.ELocale Locale = 2 [json_name = "locale", (.NYT.column_name) = "locale"];
  }

  message TSetLocalizationDirective {
    option (.NAlice.SpeechKitName) = "set_localization";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetLocalizationDirectiveType;
    .NAlice.NData.ECountry Country = 1 [json_name = "country", (.NYT.column_name) = "country"];
    .NAlice.NData.ELocale Locale = 2 [json_name = "locale", (.NYT.column_name) = "locale"];
    string Name = 3 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TLocalizationCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TLocalizationCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

