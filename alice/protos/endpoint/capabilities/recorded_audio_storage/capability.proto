syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "RecordedAudioStorageProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/recorded_audio_storage;recordedaudiostoragepb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TRecordedAudioStorageCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = RecordedAudioStorageCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    int64 UsedDataSize = 1 [json_name = "used_data_size", (.NYT.column_name) = "used_data_size"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TRecordedAudioStorageCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TRecordedAudioStorageCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

