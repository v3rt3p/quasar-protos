syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "SetupProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/setup;setuppb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSetupCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = SetupCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TStartSetupDirective {
    option (.NAlice.SpeechKitName) = "start_setup_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = StartSetupDirectiveType;
    enum EMode {
      Unknown = 0;
      FirstSetup = 1;
      Setup = 2;
      AddNetwork = 3;
    }

    .NAlice.TSetupCapability.TStartSetupDirective.EMode SetupMode = 1 [json_name = "setup_mode", (.NYT.column_name) = "setup_mode"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TSetupCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TSetupCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

