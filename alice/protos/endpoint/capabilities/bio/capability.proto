syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "BioProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/bio;biopb";

import "google/protobuf/descriptor.proto";
import "alice/library/censor/protos/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "alice/megamind/protos/guest/enrollment_headers/enrollment_headers.proto";
import "alice/protos/data/scenario/voiceprint/personalization_data.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBioCapability {
  message TParameters {
  }

  message TState {
    map<string, .NAlice.TEnrollmentHeader> Enrollments = 1 [json_name = "enrollments"];
  }

  message TBioStartSoundEnrollmentDirective {
  }

  message TMultiaccountAddAccountDirective {
    enum ETokenType {
      Unknown = 0;
      XToken = 1;
      OAuthToken = 2;
    }

    string Name = 1000 [json_name = "name"];
    string EncryptedCode = 1 [json_name = "encrypted_code"];
    string Signature = 2 [json_name = "signature"];
    string EncryptedSessionKey = 3 [json_name = "encrypted_session_key"];
    string Puid = 4 [json_name = "puid"];
    .NAlice.TBioCapability.TMultiaccountAddAccountDirective.ETokenType TokenType = 5 [json_name = "token_type"];
    string UserType = 6 [json_name = "user_type"];
  }

  message TMultiaccountRemoveAccountDirective {
    string Name = 1 [json_name = "name"];
    uint64 Puid = 2 [json_name = "puid"];
  }

  message TMultiaccountRemoveAccountPersIdDirective {
    string Name = 1 [json_name = "name"];
    string PersId = 2 [json_name = "pers_id"];
  }

  message TEnrollmentStartDirective {
    uint32 TimeoutMs = 1 [json_name = "timeout_ms"];
    uint64 Puid = 2 [json_name = "puid"];
  }

  message TEnrollmentCancelDirective {
  }

  message TEnrollmentFinishDirective {
    string PersId = 1 [json_name = "pers_id"];
    bool SendGuestEnrollmentFinishFrame = 2 [json_name = "send_guest_enrollment_finish_frame"];
  }

  message TShareEnrolledPersonDirective {
    string Name = 1000 [json_name = "name"];
    uint64 Puid = 1 [json_name = "puid"];
    string UserName = 2 [json_name = "user_name"];
    .NAlice.NData.NVoiceprint.EGender Gender = 3 [json_name = "gender"];
    repeated string DeviceIds = 4 [json_name = "device_ids"];
  }

  message TAddEnrolledPersonDirective {
    reserved "Puid";
    reserved 2;
    string Name = 1000 [json_name = "name"];
    string Code = 1 [json_name = "code"];
    string PersId = 3 [json_name = "pers_id"];
    string UserName = 4 [json_name = "user_name"];
    .NAlice.EUserType UserType = 7 [json_name = "user_type"];
    .NAlice.NData.NVoiceprint.EGender Gender = 5 [json_name = "gender"];
    bytes EnrollmentAudio = 6 [json_name = "enrollment_audio"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TBioCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TBioCapability.TState State = 3 [json_name = "state"];
}

