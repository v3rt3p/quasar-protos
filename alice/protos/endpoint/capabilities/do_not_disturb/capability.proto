syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "DoNotDisturbProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/do_not_disturb;do_not_disturbpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDoNotDisturbCapability {
  message TParameters {
  }

  message TFeatures {
    bool AllowIncomingCalls = 1 [json_name = "allow_incoming_calls"];
  }

  message TState {
    bool IsDoNotDisturbEnabled = 1 [json_name = "is_do_not_disturb_enabled"];
    .NAlice.TDoNotDisturbCapability.TFeatures Features = 2 [json_name = "features"];
  }

  message TSetDoNotDisturbStateDirective {
    enum EForceDoNotDisturbState {
      NoForceState = 0;
      ForceDisable = 1;
      ForceEnable = 2;
    }

    string Name = 1000 [json_name = "name"];
    .NAlice.TDoNotDisturbCapability.TSetDoNotDisturbStateDirective.EForceDoNotDisturbState ForceDoNotDisturbState = 1 [json_name = "force_do_not_disturb_state"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TDoNotDisturbCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TDoNotDisturbCapability.TState State = 3 [json_name = "state"];
}

