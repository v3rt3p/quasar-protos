syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "ClockCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/clock;clockpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/time/time_format.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TClockCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = ClockCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.NData.TTimeFormat Format = 1 [json_name = "format", (.NYT.column_name) = "format"];
    bool IsShown = 2 [json_name = "is_shown", (.NYT.column_name) = "is_shown"];
  }

  message TShowClockDirective {
    option (.NAlice.SpeechKitName) = "show_clock";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowClockDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message THideClockDirective {
    option (.NAlice.SpeechKitName) = "hide_clock";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = HideClockDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TClockCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TClockCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

