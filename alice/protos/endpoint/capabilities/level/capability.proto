syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LevelCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/level;levelpb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/wrappers.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLevelCapability {
  message TParameters {
    .NAlice.TLevelCapability.EInstance Instance = 1 [json_name = "instance"];
    .NAlice.TRange Range = 2 [json_name = "range"];
    .NAlice.EUnit Unit = 3 [json_name = "unit"];
    bool SupportsCalibration = 4 [json_name = "supports_calibration"];
  }

  message TState {
    double Level = 1 [json_name = "level"];
    bool Calibrating = 2 [json_name = "calibrating"];
  }

  message TSetAbsoluteLevelDirective {
    string Name = 1000 [json_name = "name"];
    double TargetLevel = 1 [json_name = "target_level"];
    uint32 TransitionTime = 2 [json_name = "transition_time"];
    bool WithOnOff = 3 [json_name = "with_on_off"];
  }

  message TSetRelativeLevelDirective {
    string Name = 1000 [json_name = "name"];
    double RelativeLevel = 1 [json_name = "relative_level"];
    uint32 TransitionTime = 2 [json_name = "transition_time"];
    bool WithOnOff = 3 [json_name = "with_on_off"];
  }

  message TTransitionLevelDirective {
    string Name = 1000 [json_name = "name"];
    double StartLevel = 1 [json_name = "start_level"];
    double EndLevel = 2 [json_name = "end_level"];
    uint32 TransitionTime = 3 [json_name = "transition_time"];
    bool WithOnOff = 4 [json_name = "with_on_off"];
  }

  message TStopTransitionLevelDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TStartCalibrationDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TUpdateStateEvent {
    .NAlice.TLevelCapability Capability = 1 [json_name = "capability"];
  }

  message TCondition {
    .NAlice.TLevelCapability.EInstance Instance = 1 [json_name = "instance"];
    .google.protobuf.DoubleValue LowerBound = 2 [json_name = "lower_bound"];
    .google.protobuf.DoubleValue UpperBound = 3 [json_name = "upper_bound"];
    double Hysteresis = 4 [json_name = "hysteresis"];
  }

  message TLevelFilter {
    .NAlice.TLevelCapability.EInstance Instance = 1 [json_name = "instance"];
    .google.protobuf.DoubleValue LowerBound = 2 [json_name = "lower_bound"];
    .google.protobuf.DoubleValue UpperBound = 3 [json_name = "upper_bound"];
  }

  enum EInstance {
    UnknownInstance = 0;
    TemperatureInstance = 1;
    HumidityInstance = 2;
    PressureInstance = 3;
    BrightnessInstance = 4;
    IlluminanceInstance = 5;
    CoverInstance = 6;
    TVOCInstance = 7;
    AmperageInstance = 8;
    VoltageInstance = 9;
    PowerInstance = 10;
    CO2Instance = 11;
    ParticulateMatter_1_0_Instance = 12;
    ParticulateMatter_2_5_Instance = 13;
    ParticulateMatter_10_0_Instance = 14;
    FuelInstance = 15;
    NOXInstance = 16;
  }

  enum EMoveMode {
    Up = 0;
    Down = 1;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TLevelCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TLevelCapability.TState State = 3 [json_name = "state"];
}

