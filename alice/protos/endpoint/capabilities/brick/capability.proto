syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "BrickProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/brick;brickpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBrickCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = BrickCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TBrickCapability.EBrickStatus BrickStatus = 1 [json_name = "brick_status", (.NYT.column_name) = "brick_status"];
    string DisabledReason = 2 [json_name = "disabled_reason", (.NYT.column_name) = "disabled_reason"];
    string StatusUrl = 3 [json_name = "status_url", (.NYT.column_name) = "status_url"];
    bool SubscriptionMode = 4 [json_name = "subscription_mode", deprecated = true, (.NYT.column_name) = "subscription_mode"];
    .NAlice.TBrickCapability.ESubscriptionStatus SubscriptionStatus = 5 [json_name = "subscription_status", (.NYT.column_name) = "subscription_status"];
  }

  enum EBrickStatus {
    Unknown = 0;
    Brick = 1;
    NotBrick = 2;
    BrickByTTL = 3;
    BrickStolen = 4;
  }

  enum ESubscriptionStatus {
    SubscriptionUnknown = 0;
    SubscriptionDisabled = 1;
    SubscriptionEnabled = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TBrickCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TBrickCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

