syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TIotTrackingCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_tracking;trackingpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/protos/data/iot/geometry.proto";

message TIotTrackingCapability {
  message TParameters {
  }

  message TState {
    bool Active = 1 [json_name = "active"];
    uint64 ReportFrequencyMs = 2 [json_name = "report_frequency_ms"];
  }

  message TIotStartTrackingDirective {
    uint64 ReportFrequencyMs = 1 [json_name = "report_frequency_ms"];
    uint64 TimeoutMs = 2 [json_name = "timeout_ms"];
  }

  message TIotStopTrackingDirective {
  }

  message TUpdateStateEvent {
    .NAlice.TIotTrackingCapability Capability = 1 [json_name = "capability"];
  }

  message TIotTrackingEvent {
    message TObjectState {
      uint32 ID = 1 [json_name = "id"];
      .NAlice.NIot.TPoint Position = 2 [json_name = "position"];
      float VelocityMmS = 4 [json_name = "velocity_mm_s"];
      float XVelocityMmS = 5 [json_name = "x_velocity_mm_s"];
      float YVelocityMmS = 6 [json_name = "y_velocity_mm_s"];
    }

    repeated .NAlice.TIotTrackingCapability.TIotTrackingEvent.TObjectState ObjectStates = 1 [json_name = "object_states"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotTrackingCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotTrackingCapability.TState State = 3 [json_name = "state"];
}

