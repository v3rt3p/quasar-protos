syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "MotionCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/motion;motionpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/endpoint/events/events.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMotionCapability {
  message TParameters {
    .NAlice.TPositiveIntegerRange MotionDetectionIntervalRangeSec = 1 [json_name = "motion_detection_interval_range_sec"];
    repeated .NAlice.TMotionCapability.TSetting SupportedSettings = 2 [json_name = "supported_settings"];
  }

  message TState {
    uint32 MotionDetectionIntervalSec = 1 [json_name = "motion_detection_interval_sec"];
    .NAlice.TTypedCapabilityEvent LastEvent = 2 [json_name = "last_event"];
    repeated .NAlice.TMotionCapability.TSetting Settings = 3 [json_name = "settings"];
  }

  message TSetting {
    message TAdvancedDetectionParams {
      uint32 MotionEventCount = 1 [json_name = "motion_event_count"];
      uint32 TimeWindowSec = 2 [json_name = "time_window_sec"];
    }

    oneof Setting {
      uint32 MotionDetectionIntervalSec = 1 [json_name = "MotionDetectionIntervalSec"];
      uint32 OccupiedToUnoccupiedDelaySec = 2 [json_name = "OccupiedToUnoccupiedDelaySec"];
      .NAlice.TMotionCapability.ESensitivityLevel SensitivityLevel = 3 [json_name = "SensitivityLevel"];
      .NAlice.TMotionCapability.EDetectionRangeLevel RangeLevel = 4 [json_name = "RangeLevel"];
      .NAlice.TMotionCapability.TSetting.TAdvancedDetectionParams AdvancedParameters = 10 [json_name = "AdvancedParameters"];
    }
  }

  message TSetMotionDetectionInterval {
    string Name = 1000 [json_name = "name"];
    uint32 MotionDetectionIntervalSec = 1 [json_name = "motion_detection_interval_sec"];
  }

  message TSetMotionSettingDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.TMotionCapability.TSetting Setting = 1 [json_name = "setting"];
  }

  message TMotionDetectedEvent {
  }

  message TMotionFinishedEvent {
  }

  message TNoMotionEvent {
  }

  message TCondition {
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events"];
  }

  enum ESensitivityLevel {
    SensitivityUnknown = 0;
    SensitivityLow = 1;
    SensitivityMedium = 2;
    SensitivityHigh = 3;
  }

  enum EDetectionRangeLevel {
    RangeUnknown = 0;
    RangeNear = 1;
    RangeMedium = 2;
    RangeFar = 3;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TMotionCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TMotionCapability.TState State = 3 [json_name = "state"];
}

