syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LyricsProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/lyrics;lyricspb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "alice/protos/data/lyrics/lyrics.proto";
import "alice/protos/extensions/extensions.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLyricsCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = LyricsCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.NData.TLyrics Lyrics = 1 [json_name = "lyrics", (.NYT.column_name) = "lyrics"];
    bool Enabled = 2 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TSetLyricsDirective {
    option (.NAlice.SpeechKitName) = "set_lyrics_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetLyricsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NData.TLyrics Lyrics = 2 [json_name = "lyrics", (.NYT.column_name) = "lyrics"];
    .google.protobuf.Struct ShowLyricsCallback = 3 [json_name = "show_lyrics_callback", (.NYT.column_name) = "show_lyrics_callback"];
  }

  message TEnableLyricsDirective {
    option (.NAlice.SpeechKitName) = "enable_lyrics_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = EnableLyricsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TDisableLyricsDirective {
    option (.NAlice.SpeechKitName) = "disable_lyrics_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = DisableLyricsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TLyricsCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TLyricsCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

