syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "ButtonCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/button;buttonpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/events/events.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TButtonCapability {
  message TParameters {
  }

  message TState {
    .NAlice.TTypedCapabilityEvent LastEvent = 1 [json_name = "last_event"];
  }

  message TButtonClickEvent {
  }

  message TButtonDoubleClickEvent {
  }

  message TButtonLongPressEvent {
  }

  message TButtonLongReleaseEvent {
  }

  message TCondition {
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TButtonCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TButtonCapability.TState State = 3 [json_name = "state"];
}

