syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LedMaskCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/led_mask;ledmaskpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLedMaskCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = LedMaskCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    uint64 LedCount = 1 [json_name = "led_count", (.NYT.column_name) = "led_count"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bytes Bitmask = 1 [json_name = "bitmask", (.NYT.column_name) = "bitmask"];
  }

  message TSetLedMaskDirective {
    option (.NAlice.SpeechKitName) = "set_led_mask_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetLedMaskDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bytes Bitmask = 1 [json_name = "bitmask", (.NYT.column_name) = "bitmask"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = LedMaskUpdateStateEventType;
    .NAlice.TLedMaskCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TLedMaskCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TLedMaskCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

