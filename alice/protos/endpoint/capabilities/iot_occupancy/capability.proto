syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TIotOccupancyCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_occupancy;occupancypb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/wrappers.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotOccupancyCapability {
  message TParameters {
  }

  message TSonarDetection {
    double DistanceMeters = 1 [json_name = "distance_meters"];
  }

  message TRadarDetection {
    uint32 ID = 1 [json_name = "id"];
  }

  message TDetection {
    oneof Detection {
      .NAlice.TIotOccupancyCapability.TSonarDetection SonarDetection = 1 [json_name = "sonar_detection"];
      .NAlice.TIotOccupancyCapability.TRadarDetection RadarDetection = 2 [json_name = "radar_detection"];
    }
  }

  message TObject {
    .NAlice.TIotOccupancyCapability.TDetection Detection = 1 [json_name = "detection"];
  }

  message TState {
    repeated .NAlice.TIotOccupancyCapability.TObject Objects = 1 [json_name = "objects"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotOccupancyCapability Capability = 1 [json_name = "capability"];
  }

  message TIotOccupancyEnterEvent {
  }

  message TIotOccupancyLeaveEvent {
  }

  message TCondition {
    reserved "Events";
    reserved 1;
    oneof Condition {
      .google.protobuf.DoubleValue LowerBound = 2 [json_name = "lower_bound"];
      .google.protobuf.DoubleValue UpperBound = 3 [json_name = "upper_bound"];
      .google.protobuf.DoubleValue Delta = 4 [json_name = "delta"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotOccupancyCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotOccupancyCapability.TState State = 3 [json_name = "state"];
}

