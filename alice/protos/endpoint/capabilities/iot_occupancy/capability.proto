syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TIotOccupancyCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_occupancy;occupancypb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/wrappers.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotOccupancyCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotOccupancyCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TSonarDetection {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    double DistanceMeters = 1 [json_name = "distance_meters", (.NYT.column_name) = "distance_meters"];
  }

  message TRadarDetection {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    uint32 ID = 1 [json_name = "id", (.NYT.column_name) = "id"];
  }

  message TDetection {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    oneof Detection {
      .NAlice.TIotOccupancyCapability.TSonarDetection SonarDetection = 1 [json_name = "sonar_detection", (.NYT.column_name) = "sonar_detection"];
      .NAlice.TIotOccupancyCapability.TRadarDetection RadarDetection = 2 [json_name = "radar_detection", (.NYT.column_name) = "radar_detection"];
    }
  }

  message TObject {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotOccupancyCapability.TDetection Detection = 1 [json_name = "detection", (.NYT.column_name) = "detection"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TIotOccupancyCapability.TObject Objects = 1 [json_name = "objects", (.NYT.column_name) = "objects"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotOccupancyUpdateStateEventType;
    .NAlice.TIotOccupancyCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  message TIotOccupancyEnterEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotOccupancyEnterEventType;
  }

  message TIotOccupancyLeaveEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotOccupancyLeaveEventType;
  }

  message TCondition {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "Events";
    reserved 1;
    oneof Condition {
      .google.protobuf.DoubleValue LowerBound = 2 [json_name = "lower_bound"];
      .google.protobuf.DoubleValue UpperBound = 3 [json_name = "upper_bound"];
      .google.protobuf.DoubleValue Delta = 4 [json_name = "delta"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotOccupancyCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotOccupancyCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

