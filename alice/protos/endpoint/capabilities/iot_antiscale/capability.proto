syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotAntiscaleCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_antiscale;iotantiscalepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotAntiscaleCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotAntiscaleCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TSetIotAntiscaleDirective {
    option (.NAlice.SpeechKitName) = "set_iot_antiscale_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotAntiscaleDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotAntiscaleUpdateStateEventType;
    .NAlice.TIotAntiscaleCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotAntiscaleCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotAntiscaleCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

