syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "VideoCallCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/video_call;videocallpb";

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "alice/protos/data/scenario/video_call/recent.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TVideoCallCapability {
  message TParameters {
  }

  message TState {
    repeated .NAlice.TVideoCallCapability.TProviderState ProviderStates = 1 [json_name = "provider_states"];
    repeated .NAlice.TVideoCallCapability.TProviderCall Incoming = 2 [json_name = "incoming"];
    .NAlice.TVideoCallCapability.TProviderCall Current = 3 [json_name = "current"];
    .NAlice.TVideoCallCapability.TProviderCall Outgoing = 4 [json_name = "outgoing"];
  }

  message TProviderState {
    oneof ProviderState {
      .NAlice.TVideoCallCapability.TTelegramProviderState TelegramProviderState = 1 [json_name = "telegram_provider_state"];
    }
  }

  message TTelegramProviderState {
    message TLogin {
      enum EState {
        InProgress = 0;
        Success = 1;
      }

      string UserId = 1 [json_name = "user_id"];
      .NAlice.TVideoCallCapability.TTelegramProviderState.TLogin.EState State = 2 [json_name = "state"];
      bool FullContactsUploadFinished = 3 [json_name = "full_contacts_upload_finished"];
      repeated .NAlice.TVideoCallCapability.TTelegramProviderState.TRecentContactData RecentContacts = 4 [json_name = "recent_contacts"];
      string DisplayName = 5 [json_name = "display_name"];
      string Login = 6 [json_name = "login"];
      repeated .NAlice.NData.TRecentCall Recents = 7 [json_name = "recents"];
    }

    message TContactSyncProgress {
    }

    message TRecentContactData {
      string UserId = 1 [json_name = "user_id"];
    }

    .NAlice.TVideoCallCapability.TTelegramProviderState.TLogin Login = 1 [json_name = "login"];
    .NAlice.TVideoCallCapability.TTelegramProviderState.TContactSyncProgress ContactSync = 2 [json_name = "contact_sync"];
  }

  message TTelegramVideoCallOwnerData {
    string CallId = 1 [json_name = "call_id"];
    string UserId = 2 [json_name = "user_id"];
  }

  message TProviderCall {
    message TTelegramCallData {
      message TRecipientData {
        string UserId = 1 [json_name = "user_id"];
        string DisplayName = 2 [json_name = "display_name"];
        bool MicMuted = 3 [json_name = "mic_muted"];
        bool VideoEnabled = 4 [json_name = "video_enabled"];
      }

      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .NAlice.TVideoCallCapability.TProviderCall.TTelegramCallData.TRecipientData Recipient = 2 [json_name = "recipient"];
      bool MicMuted = 3 [json_name = "mic_muted"];
      bool VideoEnabled = 4 [json_name = "video_enabled"];
      bool AudioCall = 5 [json_name = "audio_call"];
      bool AutoCropEnabled = 6 [json_name = "auto_crop_enabled"];
    }

    enum EState {
      Ringing = 0;
      Accepted = 1;
      Established = 2;
    }

    .NAlice.TVideoCallCapability.TProviderCall.EState State = 1 [json_name = "state"];
    oneof ProviderCallData {
      .NAlice.TVideoCallCapability.TProviderCall.TTelegramCallData TelegramCallData = 2 [json_name = "telegram_call_data"];
    }
  }

  message TStartVideoCallLoginDirective {
    message TTelegramStartLoginData {
      string Id = 1 [json_name = "id"];
      optional .google.protobuf.Struct OnFailCallback = 2 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TStartVideoCallLoginDirective.TTelegramStartLoginData TelegramStartLoginData = 1 [json_name = "telegram_start_login_data"];
    }
  }

  message TVideoCallLogoutDirective {
    message TTelegramLogoutData {
      .google.protobuf.Struct OnFailCallback = 1 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TVideoCallLogoutDirective.TTelegramLogoutData TelegramLogoutData = 1 [json_name = "telegram_logout_data"];
    }
  }

  message TStartVideoCallDirective {
    message TTelegramStartVideoCallData {
      string Id = 1 [json_name = "id"];
      string UserId = 2 [json_name = "user_id"];
      string RecipientUserId = 3 [json_name = "recipient_user_id"];
      bool VideoEnabled = 7 [json_name = "video_enabled"];
      .google.protobuf.Struct OnAcceptedCallback = 4 [json_name = "on_accepted_callback"];
      .google.protobuf.Struct OnDiscardedCallback = 5 [json_name = "on_discarded_callback"];
      .google.protobuf.Struct OnFailCallback = 6 [json_name = "on_fail_callback"];
      .google.protobuf.Struct OnEndedCallback = 8 [json_name = "on_ended_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TStartVideoCallDirective.TTelegramStartVideoCallData TelegramStartVideoCallData = 1 [json_name = "telegram_start_video_call_data"];
    }
  }

  message TProcessIncomingVideoCallDirective {
    message TProcessIncomingVideoCallData {
      string CallId = 1 [json_name = "call_id"];
      string UserId = 2 [json_name = "user_id"];
      .google.protobuf.Struct OnEndedCallback = 3 [json_name = "on_ended_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TProcessIncomingVideoCallDirective.TProcessIncomingVideoCallData TelegramProcessIncomingVideoCallData = 1 [json_name = "telegram_process_incoming_video_call_data"];
    }
  }

  message TAcceptVideoCallDirective {
    message TTelegramAcceptVideoCallData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TAcceptVideoCallDirective.TTelegramAcceptVideoCallData TelegramAcceptVideoCallData = 1 [json_name = "telegram_accept_video_call_data"];
    }
  }

  message TDiscardVideoCallDirective {
    message TTelegramDiscardVideoCallData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TDiscardVideoCallDirective.TTelegramDiscardVideoCallData TelegramDiscardVideoCallData = 1 [json_name = "telegram_discard_video_call_data"];
    }
  }

  message TMuteMicDirective {
    message TTelegramMuteMicData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TMuteMicDirective.TTelegramMuteMicData TelegramMuteMicData = 1 [json_name = "telegram_mute_mic_data"];
    }
  }

  message TUnmuteMicDirective {
    message TTelegramUnmuteMicData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TUnmuteMicDirective.TTelegramUnmuteMicData TelegramUnmuteMicData = 1 [json_name = "telegram_unmute_mic_data"];
    }
  }

  message TTurnOnVideoDirective {
    message TTelegramTurnOnVideoData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TTurnOnVideoDirective.TTelegramTurnOnVideoData TelegramMuteTurnOnVideoData = 1 [json_name = "telegram_turn_on_video_data"];
    }
  }

  message TTurnOffVideoDirective {
    message TTelegramTurnOffVideoData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TTurnOffVideoDirective.TTelegramTurnOffVideoData TelegramMuteTurnOffVideoData = 1 [json_name = "telegram_turn_off_video_data"];
    }
  }

  message TTurnOnAutoCropDirective {
    message TTelegramTurnOnAutoCropData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TTurnOnAutoCropDirective.TTelegramTurnOnAutoCropData TelegramTurnOnAutoCropData = 1 [json_name = "telegram_turn_on_auto_crop_data"];
    }
  }

  message TTurnOffAutoCropDirective {
    message TTelegramTurnOffAutoCropData {
      .NAlice.TVideoCallCapability.TTelegramVideoCallOwnerData CallOwnerData = 1 [json_name = "call_owner_data"];
      .google.protobuf.Struct OnSuccessCallback = 2 [json_name = "on_success_callback"];
      .google.protobuf.Struct OnFailCallback = 3 [json_name = "on_fail_callback"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TTurnOffAutoCropDirective.TTelegramTurnOffAutoCropData TelegramTurnOffAutoCropData = 1 [json_name = "telegram_turn_off_auto_crop_data"];
    }
  }

  message TSetActionOnCallEndDirective {
    message TTelegramSetActionOnCallEndData {
      .google.protobuf.Any Action = 1 [json_name = "action"];
    }

    string Name = 1000 [json_name = "name"];
    oneof ProviderData {
      .NAlice.TVideoCallCapability.TSetActionOnCallEndDirective.TTelegramSetActionOnCallEndData TelegramSetActionOnCallEndData = 1 [json_name = "telegram_set_action_on_call_end_data"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TVideoCallCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TVideoCallCapability.TState State = 3 [json_name = "state"];
}

