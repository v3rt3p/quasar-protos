syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "Mail360ContextCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/mail360_context;mail360contextpb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMail360ContextCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = Mail360ContextCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional string CurrentMessageId = 1 [json_name = "current_message_id", (.NYT.column_name) = "current_message_id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TMail360ContextCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TMail360ContextCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

