syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "WhatsNewCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/whats_new;whatsnewpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/protos/data/tv/whats_new/whats_new.proto";

message TWhatsNewCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = WhatsNewCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TShowWhatsNewDirective {
    option (.NAlice.SpeechKitName) = "show_whats_new";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowWhatsNewDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Id = 2 [json_name = "whats_new_id", (.NYT.column_name) = "whats_new_id"];
    .NAlice.NTv.TWhatsNewContent WhatsNewContent = 3 [json_name = "whats_new_content", (.NYT.column_name) = "whats_new_content"];
  }

  message TShowWhatsNewInSourcesDirective {
    option (.NAlice.SpeechKitName) = "show_whats_new_in_sources";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowWhatsNewInSourcesDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string Id = 2 [json_name = "whats_new_id", (.NYT.column_name) = "whats_new_id"];
    .NAlice.NTv.TWhatsNewContent WhatsNewContent = 3 [json_name = "whats_new_content", (.NYT.column_name) = "whats_new_content"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TWhatsNewCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TWhatsNewCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

