syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TIotServiceabilityCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_door;door";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotDoorCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotDoorCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TIotDoorOpenedEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDoorOpenedEventType;
  }

  message TIotDoorClosedEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDoorClosedEventType;
  }

  message TIotDoorAjarEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDoorAjarEventType;
  }

  message TIotDoorLockedEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDoorLockedEventType;
  }

  message TIotDoorRangEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDoorRangEventType;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotDoorCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotDoorCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

