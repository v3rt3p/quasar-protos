syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotSwitchModeCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_switch_mode;iotswitchmodepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotSwitchModeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotSwitchModeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TIotSwitchModeCapability.EMode SupportedModes = 1 [json_name = "supported_modes", (.NYT.column_name) = "supported_modes"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotSwitchModeCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TSetModeDirective {
    option (.NAlice.SpeechKitName) = "iot_set_switch_mode_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IotSetSwitchModeDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TIotSwitchModeCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotSwitchModeUpdateStateEventType;
    .NAlice.TIotSwitchModeCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EMode {
    Undefined = 0;
    Native = 1;
    TopRowMultifunction = 2;
    AllRowMultifunction = 3;
    BottomRowMultifunction = 4;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotSwitchModeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotSwitchModeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

