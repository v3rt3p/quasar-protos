syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotLevelEmitterCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_level_emitter;iotlevelemitterpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotLevelEmitterCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotLevelEmitterCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TUpdateAbsoluteLevelEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotLevelEmitterUpdateAbsoluteLevelEventType;
    double Level = 1 [json_name = "level", (.NYT.column_name) = "level"];
    uint32 TransitionTime = 2 [json_name = "transition_time", (.NYT.column_name) = "transition_time"];
    bool WithOnOff = 3 [json_name = "with_on_off", (.NYT.column_name) = "with_on_off"];
  }

  message TUpdateRelativeLevelEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotLevelEmitterUpdateRelativeLevelEventType;
    double Level = 1 [json_name = "level", (.NYT.column_name) = "level"];
    uint32 TransitionTime = 2 [json_name = "transition_time", (.NYT.column_name) = "transition_time"];
    bool WithOnOff = 3 [json_name = "with_on_off", (.NYT.column_name) = "with_on_off"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotLevelEmitterCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotLevelEmitterCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

