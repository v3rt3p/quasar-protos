syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TWebPlayerCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/web_player;webplayerpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TWebPlayerCapability {
  message TParameters {
  }

  message TState {
  }

  message TPlayWebVideoDirective {
    message TEmbedContent {
      oneof source {
        string EmbedUri = 1 [json_name = "embed_uri"];
        string EmbedHtml = 2 [json_name = "embed_html"];
      }
    }

    message TPlaybackTiming {
      uint32 Progress = 1 [json_name = "progress"];
      uint32 Duration = 2 [json_name = "duration"];
    }

    message TEpisodeInfo {
      uint32 Episode = 1 [json_name = "episode"];
      uint32 Season = 2 [json_name = "season"];
      string OntoId = 3 [json_name = "onto_id"];
    }

    message TRestrictions {
      bool IsPorn = 1 [json_name = "is_porn"];
      optional string AgeLimit = 2 [json_name = "age_limit"];
    }

    string Name = 1000 [json_name = "name"];
    .NAlice.TWebPlayerCapability.TPlayWebVideoDirective.TEmbedContent EmbedContent = 1 [json_name = "embed_content"];
    string HostDomain = 2 [json_name = "host_domain"];
    string Title = 3 [json_name = "title"];
    string VideoId = 4 [json_name = "video_id"];
    .NAlice.TWebPlayerCapability.TPlayWebVideoDirective.TPlaybackTiming PlaybackTiming = 6 [json_name = "playback_timing"];
    .NAlice.TWebPlayerCapability.TPlayWebVideoDirective.TRestrictions Restrictions = 7 [json_name = "restrictions"];
    string Doc2docUrl = 8 [json_name = "doc2doc_url"];
    string SearchUrl = 9 [json_name = "search_url"];
    string SandboxName = 11 [json_name = "sandbox_name"];
    optional .NAlice.TWebPlayerCapability.TPlayWebVideoDirective.TEpisodeInfo EpisodeInfo = 5 [json_name = "episode_info"];
    optional string RecommendReqId = 10 [json_name = "recommend_req_id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TWebPlayerCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TWebPlayerCapability.TState State = 3 [json_name = "state"];
}

