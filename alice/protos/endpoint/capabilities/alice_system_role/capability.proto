syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceSystemRoleProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_system_role;alicesystemrolepb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceSystemRoleCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceSystemRoleCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool IsDefaultAssistant = 1 [json_name = "is_default_assistant", (.NYT.column_name) = "is_default_assistant"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceSystemRoleCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceSystemRoleCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

