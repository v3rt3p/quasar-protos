syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AdhanProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/adhan;adhanpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/scenario/adhan/adhan.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAdhanCapability {
  message TParameters {
  }

  message TState {
    repeated .NAlice.NData.TAdhan Adhans = 1 [json_name = "adhans"];
    uint32 SoundLevel = 2 [json_name = "sound_level"];
    .NAlice.NData.TAdhanMuezzinSettings AdhanMuezzinSettings = 3 [json_name = "adhan_muezzin_settings"];
    bool CurrentlyPlaying = 4 [json_name = "currently_playing"];
  }

  message TAdhanSetSoundLevelDirective {
    string Name = 1000 [json_name = "name"];
    uint32 SoundLevel = 1 [json_name = "sound_level"];
  }

  message TAdhanSetMuezzinSettingsDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.NData.TAdhanMuezzinSettings AdhanMuezzinSettings = 1 [json_name = "adhan_muezzin_settings"];
  }

  message TAdhanAddOrUpdateDirective {
    message TAdhanWithActivationTimes {
      .NAlice.NData.TAdhan Adhan = 1 [json_name = "adhan"];
      repeated uint64 ActivationTimestamps = 2 [json_name = "activation_timestamps"];
    }

    string Name = 1000 [json_name = "name"];
    repeated .NAlice.TAdhanCapability.TAdhanAddOrUpdateDirective.TAdhanWithActivationTimes AdhansWithActivationTimes = 1 [json_name = "adhans_with_activation_times"];
  }

  message TAdhanRemoveDirective {
    string Name = 1000 [json_name = "name"];
    repeated string AdhanIds = 1 [json_name = "adhan_ids"];
  }

  message TAdhanUpdateActivationTimesDirective {
    message TAdhanActivationTimes {
      string AdhanId = 1 [json_name = "adhan_id"];
      repeated uint64 ActivationTimestamps = 2 [json_name = "activation_timestamps"];
    }

    string Name = 1000 [json_name = "name"];
    repeated .NAlice.TAdhanCapability.TAdhanUpdateActivationTimesDirective.TAdhanActivationTimes AdhansActivationTimes = 1 [json_name = "adhans_activation_times"];
  }

  message TAdhanStopDirective {
    string Name = 1000 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TAdhanCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TAdhanCapability.TState State = 3 [json_name = "state"];
}

