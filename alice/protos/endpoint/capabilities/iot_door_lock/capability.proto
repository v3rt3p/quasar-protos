syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "DoorLockCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_door_lock;doorlockpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDoorLockCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = DoorLockCapabilityType;
  message TAccessMethod {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TDoorLockCapability.EAccessMethodType AccessMethodType = 1 [json_name = "access_method_type", (.NYT.column_name) = "access_method_type"];
    optional uint32 UserIndex = 2 [json_name = "user_index", (.NYT.column_name) = "user_index"];
  }

  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TDoorLockCapability.EAccessMethodType SupportedAccessMethods = 1 [json_name = "supported_access_methods", (.NYT.column_name) = "supported_access_methods"];
    repeated .NAlice.TDoorLockCapability.EValue SupportedValues = 2 [json_name = "supported_values", (.NYT.column_name) = "supported_values"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TDoorLockCapability.EValue Value = 1 [json_name = "value", (.NYT.column_name) = "value"];
  }

  message TSetOpenDirective {
    option (.NAlice.SpeechKitName) = "iot_door_lock_set_open_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = DoorLockSetOpenDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TDoorLockCapability.EValue Value = 1 [json_name = "value", (.NYT.column_name) = "value"];
  }

  message TLockOperationEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = DoorLockOperationEventType;
    .NAlice.TDoorLockCapability.EValue Value = 1 [json_name = "value", (.NYT.column_name) = "value"];
    .NAlice.TDoorLockCapability.TAccessMethod AccessMethod = 2 [json_name = "access_method", (.NYT.column_name) = "access_method"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = DoorLockUpdateStateEventType;
    .NAlice.TDoorLockCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EValue {
    Unknown = 0;
    Open = 1;
    Closed = 2;
    NotFullyLocked = 3;
  }

  enum EAccessMethodType {
    UnknownAccessMethodType = 0;
    Manual = 1;
    Pin = 2;
    Biometric = 3;
    Rfid = 4;
    Remote = 5;
    Auto = 6;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TDoorLockCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TDoorLockCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

