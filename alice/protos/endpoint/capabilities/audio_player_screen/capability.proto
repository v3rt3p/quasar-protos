syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AudioPlayerScreenCapabilitiesProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/audio_player_screen;audioplayerscreenpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAudioPlayerScreenCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AudioPlayerScreenCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool UseNativeScreen = 1 [json_name = "use_native_screen", (.NYT.column_name) = "use_native_screen"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TShowAudioPlayerScreenDirective {
    option (.NAlice.SpeechKitName) = "show_audio_player_screen_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowAudioPlayerScreenDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string TrackId = 1 [json_name = "track_id", (.NYT.column_name) = "track_id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAudioPlayerScreenCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAudioPlayerScreenCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

