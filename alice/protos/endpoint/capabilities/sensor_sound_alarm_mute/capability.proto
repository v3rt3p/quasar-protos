syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "SensorSoundAlarmMuteCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/sensor_sound_alarm_mute;sensor_sound_alarm_mutepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSensorSoundAlarmMuteCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = SensorSoundAlarmMuteCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool Mute = 1 [json_name = "mute", (.NYT.column_name) = "mute"];
  }

  message TMuteDirective {
    option (.NAlice.SpeechKitName) = "sensor_sound_alarm_mute_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SensorSoundAlarmMuteDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool Mute = 1 [json_name = "mute", (.NYT.column_name) = "mute"];
  }

  message TToggleDirective {
    option (.NAlice.SpeechKitName) = "toggle_sensor_sound_alarm_mute_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ToggleSensorSoundAlarmMuteDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = SensorSoundAlarmMuteUpdateStateEventType;
    .NAlice.TSensorSoundAlarmMuteCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TSensorSoundAlarmMuteCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TSensorSoundAlarmMuteCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

