syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotBallastConfigurationCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_ballast_configuration;iotballastconfigurationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotBallastConfigurationCapability {
  message TParameters {
    .NAlice.TRange PhysicalRange = 1 [json_name = "physical_range"];
  }

  message TState {
    double Min = 1 [json_name = "min"];
    double Max = 2 [json_name = "max"];
  }

  message TSetIotBallastMinDirective {
    string Name = 1000 [json_name = "name"];
    double Min = 1 [json_name = "min"];
  }

  message TSetIotBallastMaxDirective {
    string Name = 1000 [json_name = "name"];
    double Max = 1 [json_name = "max"];
  }

  message TSetIotBallastMinMaxDirective {
    string Name = 1000 [json_name = "name"];
    double Min = 1 [json_name = "min"];
    double Max = 2 [json_name = "max"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotBallastConfigurationCapability Capability = 1 [json_name = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotBallastConfigurationCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotBallastConfigurationCapability.TState State = 3 [json_name = "state"];
}

