syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotBallastConfigurationCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_ballast_configuration;iotballastconfigurationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotBallastConfigurationCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotBallastConfigurationCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TRange PhysicalRange = 1 [json_name = "physical_range", (.NYT.column_name) = "physical_range"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    double Min = 1 [json_name = "min", (.NYT.column_name) = "min"];
    double Max = 2 [json_name = "max", (.NYT.column_name) = "max"];
  }

  message TSetIotBallastMinDirective {
    option (.NAlice.SpeechKitName) = "set_iot_ballast_min_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotBallastMinDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    double Min = 1 [json_name = "min", (.NYT.column_name) = "min"];
  }

  message TSetIotBallastMaxDirective {
    option (.NAlice.SpeechKitName) = "set_iot_ballast_max_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotBallastMaxDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    double Max = 1 [json_name = "max", (.NYT.column_name) = "max"];
  }

  message TSetIotBallastMinMaxDirective {
    option (.NAlice.SpeechKitName) = "set_iot_ballast_min_max_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotBallastMinMaxDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    double Min = 1 [json_name = "min", (.NYT.column_name) = "min"];
    double Max = 2 [json_name = "max", (.NYT.column_name) = "max"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotBallastConfigurationUpdateStateEventType;
    .NAlice.TIotBallastConfigurationCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotBallastConfigurationCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotBallastConfigurationCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

