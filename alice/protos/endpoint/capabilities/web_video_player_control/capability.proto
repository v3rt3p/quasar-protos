syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TWebPlayerControlCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/web_video_player_control;webvideoplayercontrolpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TWebPlayerControlCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = WebVideoPlayerControlCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TDontAutoPlayRelatedVideoDirective {
    option (.NAlice.SpeechKitName) = "dont_auto_play_related_video";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = DontAutoPlayRelatedVideoDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TWebPlayerControlCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TWebPlayerControlCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

