syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "MusicSearchCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/music_search;musicsearchpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/api/rpc/music/music_search/music_search.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMusicSearchCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = MusicSearchCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TOpenMusicSearchDirective {
    option (.NAlice.SpeechKitName) = "open_music_search_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = OpenMusicSearchDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TMusicSearchRequestDirective {
    option (.NAlice.SpeechKitName) = "music_search_request_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = MusicSearchRequestDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NMusic.TMusicSearchRequest.EMusicSearchType Type = 2 [json_name = "type", (.NYT.column_name) = "type"];
    repeated .NAlice.NMusic.TMusicSearchResponse.TMusicSearchElement SearchElements = 3 [json_name = "search_elements", (.NYT.column_name) = "search_elements"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TMusicSearchCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TMusicSearchCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

