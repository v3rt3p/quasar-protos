syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "KidsProCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/kids_pro;kidspropb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TKidsProCapability {
  message TParameters {
  }

  message TState {
    message TSettings {
      bool KidsSearchEnabled = 1 [json_name = "kids_search_enabled"];
      bool KidsContentEnabled = 2 [json_name = "kids_content_enabled"];
    }

    .NAlice.TKidsProCapability.TState.TSettings Settings = 1 [json_name = "settings"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TKidsProCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TKidsProCapability.TState State = 3 [json_name = "state"];
}

