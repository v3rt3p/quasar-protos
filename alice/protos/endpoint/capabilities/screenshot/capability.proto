syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "ScreenshotProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/screenshot;srcinput";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TScreenshotCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = ScreenshotCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TTakeScreenshotDirective {
    option (.NAlice.SpeechKitName) = "take_screenshot_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = TakeScreenshotDirectiveType;
    message TAliceVisionPurpose {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      bool NeedNeuroInfoContext = 1 [json_name = "need_neuro_info_context", (.NYT.column_name) = "need_neuro_info_context"];
    }

    enum EPurpose {
      Undefined = 0;
      ImageSearch = 1;
      AliceVision = 2;
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TScreenshotCapability.TTakeScreenshotDirective.EPurpose Purpose = 2 [json_name = "purpose", deprecated = true, (.NYT.column_name) = "purpose"];
    string Query = 3 [json_name = "query", (.NYT.column_name) = "query"];
    oneof PurposePayload {
      option (.NYT.variant_field_name) = "purpose_payload";
      .NAlice.TScreenshotCapability.TTakeScreenshotDirective.TAliceVisionPurpose AliceVisionPurpose = 4 [json_name = "alice_vision_purpose", (.NYT.column_name) = "alice_vision_purpose"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TScreenshotCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TScreenshotCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

