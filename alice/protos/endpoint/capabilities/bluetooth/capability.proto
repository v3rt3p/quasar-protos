syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "BluetoothCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/bluetooth;bluetoothpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBluetoothCapability {
  message TConnectedDevice {
    .NAlice.TBluetoothCapability.ERole Role = 1 [json_name = "role"];
    string Name = 2 [json_name = "name"];
    string Address = 3 [json_name = "address"];
    uint64 ConnectionTime = 4 [json_name = "connection_time"];
  }

  message TParameters {
  }

  message TState {
    reserved "ConnectedDevice";
    reserved 1;
    repeated .NAlice.TBluetoothCapability.TConnectedDevice ConnectedDevices = 2 [json_name = "connected_devices"];
    bool Playing = 3 [json_name = "playing"];
    bool Discoverable = 4 [json_name = "discoverable"];
    optional uint32 Volume = 5 [json_name = "volume"];
  }

  message TConnectBluetoothDirective {
    string Name = 1000 [json_name = "name"];
    string Address = 1 [json_name = "address"];
  }

  message TDisconnectBluetoothDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TForgetPairedDevicesDirective {
  }

  enum ERole {
    ROLE_NONE = 0;
    ROLE_SINK = 1;
    ROLE_SOURCE = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TBluetoothCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TBluetoothCapability.TState State = 3 [json_name = "state"];
}

