syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "PhoneCommandsCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/phone_commands;phonecommandspb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TPhoneCommandsCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = PhoneCommandsCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TPhoneGetLastCalledContactDirective {
    option (.NAlice.SpeechKitName) = "phone_get_last_called_contact";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = PhoneGetLastCalledContactDirectiveType;
    enum ECallType {
      Unknown = 0;
      Incoming = 1;
      Outgoing = 2;
    }

    .NAlice.TPhoneCommandsCapability.TPhoneGetLastCalledContactDirective.ECallType Type = 1 [json_name = "type", (.NYT.column_name) = "type"];
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TPhoneCommandsCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TPhoneCommandsCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

