syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IpCamStreamingCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/ip_cam_streaming;ipcamstreamingpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIpCamStreamingCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IpCamStreamingCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TCameraState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIpCamStreamingCapability.ECameraState State = 1 [json_name = "state", (.NYT.column_name) = "state"];
    .NAlice.TIpCamStreamingCapability.TCameraUsageLimits UsageLimits = 3 [json_name = "usage_limits", (.NYT.column_name) = "usage_limits"];
    optional string ErrorMessage = 2 [json_name = "error_message", (.NYT.column_name) = "error_message"];
  }

  message TMicrophoneState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIpCamStreamingCapability.EMicrophoneState State = 1 [json_name = "state", (.NYT.column_name) = "state"];
    optional string ErrorMessage = 2 [json_name = "error_message", (.NYT.column_name) = "error_message"];
  }

  message TNightModeState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIpCamStreamingCapability.ENightModeState State = 1 [json_name = "state", (.NYT.column_name) = "state"];
    optional string ErrorMessage = 2 [json_name = "error_message", (.NYT.column_name) = "error_message"];
  }

  message TCameraUsageLimits {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIpCamStreamingCapability.TCameraUsageLimitWarning CurrentWarning = 1 [json_name = "current_warning", (.NYT.column_name) = "current_warning"];
  }

  message TCameraUsageLimitWarning {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string WarningId = 1 [json_name = "warning_id", (.NYT.column_name) = "warning_id"];
    .NAlice.TIpCamStreamingCapability.ECameraUsageLimitWarning Warning = 2 [json_name = "warning", (.NYT.column_name) = "warning"];
    bool Acknowledged = 3 [json_name = "acknowledged", (.NYT.column_name) = "acknowledged"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool StreamingAllowed = 1 [json_name = "streaming_allowed", (.NYT.column_name) = "streaming_allowed"];
    .NAlice.TIpCamStreamingCapability.TCameraState Camera = 2 [json_name = "camera", (.NYT.column_name) = "camera"];
    .NAlice.TIpCamStreamingCapability.TMicrophoneState Microphone = 3 [json_name = "microphone", (.NYT.column_name) = "microphone"];
    .NAlice.TIpCamStreamingCapability.TNightModeState NightMode = 4 [json_name = "night_mode", (.NYT.column_name) = "night_mode"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IpCamStreamingUpdateStateEventType;
    .NAlice.TIpCamStreamingCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  message TAcknowledgeCameraUsageLimitDirective {
    option (.NAlice.SpeechKitName) = "iot_acknowledge_camera_usage_limit_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IotAcknowledgeCameraUsageLimitDirectiveType;
    string WarningId = 1 [json_name = "warning_id", (.NYT.column_name) = "warning_id"];
    bool ContinueStreaming = 2 [json_name = "continue_streaming", (.NYT.column_name) = "continue_streaming"];
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TSetStreamingAllowedDirective {
    option (.NAlice.SpeechKitName) = "ip_cam_set_streaming_allowed_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IpCamSetStreamingAllowedDirectiveType;
    bool StreamingAllowed = 1 [json_name = "streaming_allowed", (.NYT.column_name) = "streaming_allowed"];
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  enum ECameraState {
    UnknownCameraState = 0;
    EnabledCameraState = 1;
    DisabledCameraState = 2;
    InUseCameraState = 3;
    ErrorCameraState = 4;
  }

  enum ECameraUsageLimitWarning {
    NoCameraUsageLimitWarning = 0;
    ContinuousUsageLimitWarning = 1;
    DailyUsageLimitWarning = 2;
    BothLimitsWarning = 3;
  }

  enum EMicrophoneState {
    UnknownMicrophoneState = 0;
    EnabledMicrophoneState = 1;
    DisabledMicrophoneState = 2;
    InUseMicrophoneState = 3;
    ErrorMicrophoneState = 4;
  }

  enum ENightModeState {
    UnknownNightModeState = 0;
    EnabledNightModeState = 1;
    DisabledNightModeState = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIpCamStreamingCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIpCamStreamingCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

