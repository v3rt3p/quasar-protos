syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "DeviceControlPanelProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/device_control_panel;device_control_panelpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/device_control_panel/scenarios.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDeviceControlPanelCapability {
  message TParameters {
  }

  message TState {
    .NAlice.TTotalScenario Total = 1 [json_name = "total"];
    .NAlice.TVideoScenario Video = 2 [json_name = "video"];
    .NAlice.TTvChannelsScenario TvChannels = 3 [json_name = "tv_channels"];
    .NAlice.TInputControlScenario InputControl = 4 [json_name = "input_control"];
    .NAlice.TExternalAppScenario ExternalApp = 5 [json_name = "external_app"];
  }

  message TChildModeUnblockDirective {
    message TSwitchAccount {
      string TargetPersonId = 1 [json_name = "target_person_id"];
    }

    message TLaunchApp {
      string PackageName = 2 [json_name = "package_name"];
    }

    message TProlongation {
      uint32 ProlongationSeconds = 1 [json_name = "prolongation_seconds"];
    }

    string ChildPersonId = 1 [json_name = "child_person_id"];
    bool RequestDeclined = 2 [json_name = "request_declined"];
    string Name = 6 [json_name = "name"];
    oneof Action {
      .NAlice.TDeviceControlPanelCapability.TChildModeUnblockDirective.TSwitchAccount SwitchAccount = 3 [json_name = "switch_account"];
      .NAlice.TDeviceControlPanelCapability.TChildModeUnblockDirective.TLaunchApp LaunchApp = 4 [json_name = "launch_app"];
      .NAlice.TDeviceControlPanelCapability.TChildModeUnblockDirective.TProlongation Prolongation = 5 [json_name = "prolongation"];
    }
  }

  message TOpenProlongationScreenDirective {
    string Name = 1 [json_name = "name"];
    bool IsAdultRequest = 2 [json_name = "is_adult_request"];
  }

  message TSendUnblockRequestDirective {
    string Name = 1 [json_name = "name"];
  }

  message TProlongTimeLimitDirective {
    uint32 ProlongationSeconds = 1 [json_name = "prolongation_seconds"];
    string Name = 2 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TDeviceControlPanelCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TDeviceControlPanelCapability.TState State = 3 [json_name = "state"];
}

