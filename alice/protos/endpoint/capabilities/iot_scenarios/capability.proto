syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotScenariosProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_scenarios;iotscenariospb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/data/iot/scenario.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotScenariosCapability {
  message TParameters {
    repeated .NAlice.NIot.TLocalScenarioCondition.EConditionType SupportedConditionTypes = 1 [json_name = "supported_condition_types"];
    repeated .NAlice.TCapability.EEventType SupportedCapabilityEventConditions = 2 [json_name = "supported_capability_event_conditions"];
  }

  message TState {
    repeated .NAlice.NIot.TLocalScenario Scenarios = 1 [json_name = "scenarios"];
  }

  message TLocalStepsFinishedEvent {
    string LaunchID = 1 [json_name = "launch_id"];
    uint64 LaunchTimestampSeconds = 7 [json_name = "launch_timestamp_seconds"];
    string ScenarioID = 2 [json_name = "scenario_id"];
    map<uint32, .NAlice.NIot.TLocalScenario.TStepResult> StepResults = 3 [json_name = "step_results"];
    uint32 StepIndex = 4 [json_name = "step_index"];
    .NAlice.TIotScenariosCapability.EStepStatus StepStatus = 5 [json_name = "step_status"];
    .NAlice.NIot.TLocalScenarioCondition TriggeredCondition = 6 [json_name = "triggered_condition"];
  }

  message TExecuteNonLocalStepEvent {
    string LaunchID = 1 [json_name = "launch_id"];
    uint64 LaunchTimestampSeconds = 6 [json_name = "launch_timestamp_seconds"];
    string ScenarioID = 2 [json_name = "scenario_id"];
    map<uint32, .NAlice.NIot.TLocalScenario.TStepResult> StepResults = 3 [json_name = "step_results"];
    uint32 StepIndex = 4 [json_name = "step_index"];
    .NAlice.NIot.TLocalScenarioCondition TriggeredCondition = 5 [json_name = "triggered_condition"];
  }

  message TConfirmLocalScenariosEvent {
    repeated string LocalScenarioIDs = 1 [json_name = "local_scenario_ids"];
    repeated string NonLocalScenarioIDs = 2 [json_name = "non_local_scenario_ids"];
  }

  message TRestoreLocalScenariosEvent {
  }

  message TConfirmLocalScenariosActivityEvent {
    repeated string ActiveIDs = 1 [json_name = "active_ids"];
    repeated string InactiveIDs = 2 [json_name = "inactive_ids"];
  }

  message TAddIotScenariosDirective {
    string Name = 1000 [json_name = "name"];
    repeated .NAlice.NIot.TLocalScenario Scenarios = 1 [json_name = "scenarios"];
  }

  message TRemoveIotScenariosDirective {
    string Name = 1000 [json_name = "name"];
    repeated string IDs = 1 [json_name = "ids"];
  }

  message TSyncIotScenariosDirective {
    string Name = 1000 [json_name = "name"];
    repeated .NAlice.NIot.TLocalScenario Scenarios = 1 [json_name = "scenarios"];
  }

  message TContinueScenarioLaunchDirective {
    reserved "ScenarioID";
    reserved 2;
    string Name = 1000 [json_name = "name"];
    string LaunchID = 1 [json_name = "launch_id"];
    uint32 StepIndex = 3 [json_name = "step_index"];
  }

  message TSetIotScenariosActivityDirective {
    string Name = 1000 [json_name = "name"];
    repeated string ActiveIDs = 1 [json_name = "active_ids"];
    repeated string InactiveIDs = 2 [json_name = "inactive_ids"];
  }

  message TSendExecuteNonLocalStepEventDirective {
    string Name = 1000 [json_name = "name"];
    uint32 StepIndex = 1 [json_name = "step_index"];
  }

  message TSendLocalStepsFinishedEventDirective {
    string Name = 1000 [json_name = "name"];
    uint32 StepIndex = 1 [json_name = "step_index"];
    .NAlice.TIotScenariosCapability.EStepStatus StepStatus = 2 [json_name = "step_status"];
  }

  message TWaitScenarioDelayDirective {
    enum EDelayFinishedPolicy {
      Unknown = 0;
      FailScenario = 1;
      ContinueScenario = 2;
    }

    string Name = 1000 [json_name = "name"];
    uint32 DelaySeconds = 1 [json_name = "delay_seconds"];
    .NAlice.TIotScenariosCapability.TWaitScenarioDelayDirective.EDelayFinishedPolicy DelayFinishedPolicy = 2 [json_name = "delay_finished_policy"];
    optional .google.protobuf.Timestamp StartTimestamp = 3 [json_name = "start_timestamp"];
  }

  message TOptionalDirective {
    enum ERunPolicy {
      Unknown = 0;
      SomeDeviceUnreachable = 1;
    }

    string Name = 1000 [json_name = "name"];
    .NAlice.TIotScenariosCapability.TOptionalDirective.ERunPolicy RunPolicy = 1 [json_name = "run_policy"];
    repeated .google.protobuf.Any Directives = 2 [json_name = "directives"];
  }

  message TEffectiveTimeFilter {
    enum ETriggerPolicy {
      Unknown = 0;
      Once = 1;
      Unlimited = 2;
    }

    uint32 StartTimeSeconds = 1 [json_name = "start_time_seconds"];
    uint32 DurationSeconds = 5 [json_name = "duration_seconds"];
    uint32 EndTimeSeconds = 2 [json_name = "end_time_seconds"];
    repeated string DaysOfWeek = 3 [json_name = "days_of_week"];
    .NAlice.TIotScenariosCapability.TEffectiveTimeFilter.ETriggerPolicy TriggerPolicy = 4 [json_name = "trigger_policy"];
  }

  enum EStepStatus {
    Unknown = 0;
    Running = 1;
    Scheduled = 2;
    Finished = 3;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotScenariosCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotScenariosCapability.TState State = 3 [json_name = "state"];
}

