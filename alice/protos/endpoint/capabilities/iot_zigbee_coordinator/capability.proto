syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotZigbeeCoordinatorCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_zigbee_coordinator;iotzigbeecoordinatorpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotZigbeeCoordinatorCapability {
  message TParameters {
    .NAlice.TIotZigbeeCoordinatorCapability.ERadioInterface RadioInterface = 1 [json_name = "radio_interface"];
  }

  message TChannelInterferenceLevel {
    .NAlice.TIotZigbeeCoordinatorCapability.EChannelInterferenceLevel Level = 1 [json_name = "level"];
    int32 CcaRssi = 2 [json_name = "cca_rssi"];
  }

  message TState {
    uint32 Channel = 1 [json_name = "channel"];
    .NAlice.TIotZigbeeCoordinatorCapability.TChannelInterferenceLevel Interference = 2 [json_name = "interference"];
    bool ChannelMigrationInProgress = 3 [json_name = "channel_migration_in_progress"];
    int32 CcaRssi = 4 [json_name = "cca_rssi"];
  }

  message TSetChannelDirective {
    string Name = 1000 [json_name = "name"];
    uint32 Channel = 1 [json_name = "channel"];
  }

  message TStartEnergyScanDirective {
    string Name = 1000 [json_name = "name"];
    uint32 TimeScanPerChannelMs = 1 [json_name = "time_scan_per_channel_ms"];
    uint32 ChannelMask = 2 [json_name = "channel_mask"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotZigbeeCoordinatorCapability Capability = 1 [json_name = "capability"];
  }

  message TEnergyScanResultEvent {
    message TChannelScanResult {
      uint32 Channel = 1 [json_name = "channel"];
      int32 Rssi = 2 [json_name = "rssi"];
      .NAlice.TIotZigbeeCoordinatorCapability.TChannelInterferenceLevel Interference = 3 [json_name = "interference"];
      int32 CcaRssi = 4 [json_name = "cca_rssi"];
    }

    repeated int32 Rssis = 1 [json_name = "rssis"];
    repeated .NAlice.TIotZigbeeCoordinatorCapability.TEnergyScanResultEvent.TChannelScanResult ChannelScanResults = 2 [json_name = "channel_scan_results"];
  }

  enum ERadioInterface {
    RadioInterfaceUnknown = 0;
    RadioInterfaceSilabsEfr32 = 1;
    RadioInterfaceW2l = 2;
    RadioInterfaceTelinkB91 = 3;
  }

  enum EChannelInterferenceLevel {
    ChannelInterferenceLevelUnknown = 0;
    ChannelInterferenceLevelLow = 1;
    ChannelInterferenceLevelModerate = 2;
    ChannelInterferenceLevelHigh = 3;
    ChannelInterferenceLevelCongested = 4;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotZigbeeCoordinatorCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotZigbeeCoordinatorCapability.TState State = 3 [json_name = "state"];
}

