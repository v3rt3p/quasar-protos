syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotAirQualityCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_air_quality;iotairqualitypb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotAirQualityCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotAirQualityCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotAirQualityCapability.EAirQuality AirQuality = 1 [json_name = "air_quality", (.NYT.column_name) = "air_quality"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotAirQualityUpdateStateEventType;
    .NAlice.TIotAirQualityCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EAirQuality {
    Unknown = 0;
    Good = 1;
    Fair = 2;
    Moderate = 3;
    Poor = 4;
    VeryPoor = 5;
    ExtremelyPoor = 6;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotAirQualityCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotAirQualityCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

