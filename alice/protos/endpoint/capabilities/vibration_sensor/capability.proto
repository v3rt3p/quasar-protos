syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "VibrationSensorProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/vibration_sensor;vibrationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/events/events.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TVibrationSensorCapability {
  message TParameters {
  }

  message TState {
    .NAlice.TTypedCapabilityEvent LastEvent = 1 [json_name = "last_event"];
  }

  message TVibrationSensorVibrationEvent {
  }

  message TVibrationSensorTiltEvent {
  }

  message TVibrationSensorFallEvent {
  }

  message TCondition {
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TVibrationSensorCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TVibrationSensorCapability.TState State = 3 [json_name = "state"];
}

