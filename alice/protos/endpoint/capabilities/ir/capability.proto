syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IrCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/ir;irpb";

import "alice/protos/data/ir/ir.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/endpoint.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIrCapability {
  message TParameters {
  }

  message TState {
    reserved "RemoteEndpointIDs";
    reserved 1;
  }

  message TTryIrCommandDirective {
    string Name = 1000 [json_name = "name"];
    repeated uint32 KeyIds = 1 [json_name = "key_ids"];
    .NAlice.NIr.TRemoteData Data = 2 [json_name = "data"];
    uint32 CommandIntervalMs = 3 [json_name = "command_interval_ms"];
  }

  message TTryIrAcCommandDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.NIr.EAcKey AcKey = 1 [json_name = "ac_key"];
    .NAlice.NIr.TAcState AcState = 2 [json_name = "ac_state"];
    .NAlice.NIr.TRemoteData Data = 3 [json_name = "data"];
  }

  message TRecordIrPulseDirective {
    string Name = 1000 [json_name = "name"];
    string RequestId = 1 [json_name = "request_id"];
    uint32 TimeoutSeconds = 2 [json_name = "timeout_seconds"];
  }

  message TCancelRecordIrPulseDirective {
    string Name = 1000 [json_name = "name"];
    string RequestId = 1 [json_name = "request_id"];
  }

  message TAddIrRemoteDirective {
    string Name = 1000 [json_name = "name"];
    string EndpointId = 1 [json_name = "endpoint_id"];
    .NAlice.NIr.TRemote Remote = 2 [json_name = "remote"];
    string RequestId = 3 [json_name = "request_id"];
  }

  message TForgetIrRemoteDirective {
    string Name = 1000 [json_name = "name"];
    string EndpointId = 1 [json_name = "endpoint_id"];
  }

  message TRestoreIrRemotesDirective {
    string Name = 1000 [json_name = "name"];
    map<string, .NAlice.NIr.TRemote> Remotes = 1 [json_name = "remotes"];
  }

  message TIrPulseEvent {
    string RequestId = 1 [json_name = "request_id"];
    repeated uint32 Pulse = 2 [json_name = "pulse"];
    uint32 Frequency = 3 [json_name = "frequency"];
  }

  message TRestoreIrRemotesEvent {
  }

  message TAddIrRemoteEvent {
    reserved "EndpointId";
    reserved "Capabilities";
    reserved 1;
    reserved 2;
    .NAlice.TEndpoint Endpoint = 4 [json_name = "endpoint"];
    string RequestId = 3 [json_name = "request_id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIrCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIrCapability.TState State = 3 [json_name = "state"];
}

message TIrRemoteCapability {
  message TParameters {
    .NAlice.NIr.TRemote Remote = 1 [json_name = "remote"];
  }

  message TState {
    .NAlice.NIr.TAcState AcState = 1 [json_name = "ac_state"];
  }

  message TSendIrCommandDirective {
    string Name = 1000 [json_name = "name"];
    repeated uint32 KeyIds = 1 [json_name = "key_ids"];
    uint32 CommandIntervalMs = 2 [json_name = "command_interval_ms"];
  }

  message TSendIrCustomCommandDirective {
    string Name = 1000 [json_name = "name"];
    repeated uint32 KeyIds = 1 [json_name = "key_ids"];
    .NAlice.NIr.TRemoteData Data = 2 [json_name = "data"];
    uint32 CommandIntervalMs = 3 [json_name = "command_interval_ms"];
  }

  message TSendIrAcCommandDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.NIr.EAcKey AcKey = 1 [json_name = "ac_key"];
    .NAlice.NIr.TAcState AcState = 2 [json_name = "ac_state"];
  }

  message TUpdateStateEvent {
    .NAlice.TIrRemoteCapability Capability = 1 [json_name = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIrRemoteCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIrRemoteCapability.TState State = 3 [json_name = "state"];
}

