syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "DivViewProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/div_view;divviewpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";
import "alice/protos/div/div2id.proto";
import "alice/protos/div/div_external_variable_sources.proto";

message TDivViewCapability {
  message TParameters {
    enum EUIFamily {
      Unknown = 0;
      SmartScreen = 1;
      TV = 2;
      CloudUI = 3;
      SearchApp = 4;
      WebTouch = 5;
      WebDesktop = 6;
      YabroDesktop = 7;
      WebStandaloneDesktop = 8;
      WebStandaloneTouch = 9;
      AliceApp = 10;
    }

    enum EDivKitFeature {
      TextCenteringDivKit39Fix = 0;
    }

    bool SupportsStringDiv2Card = 1 [json_name = "supports_string_div2_card"];
    bool SupportsCardStashing = 2 [json_name = "supports_card_stashing"];
    .NAlice.TDivViewCapability.TParameters.EUIFamily UIFamily = 3 [json_name = "ui_family"];
    repeated .NAlice.TDivViewCapability.TParameters.EDivKitFeature DivKitFeatures = 4 [json_name = "div_kit_features"];
    repeated .NAlice.TDivExternalVariable.ESourceType availableExternalSources = 5 [json_name = "available_external_sources"];
  }

  message TState {
    repeated string GlobalTemplatesCache = 1 [json_name = "global_templates_cache"];
  }

  message TStashViewDirective {
    string Name = 1 [json_name = "name"];
    .NAlice.TDiv2Id CardSearchCriteria = 2 [json_name = "card_search_criteria"];
  }

  message TUnstashViewDirective {
    string Name = 1 [json_name = "name"];
    .NAlice.TDiv2Id CardSearchCriteria = 2 [json_name = "card_search_criteria"];
  }

  message TSetDivVariablesDirective {
    message TSetVariable {
      enum EVariableType {
        Global = 0;
        Local = 1;
        Mixed = 2;
      }

      string VariableName = 4 [json_name = "variable_name"];
      .NAlice.TDivViewCapability.TSetDivVariablesDirective.TSetVariable.EVariableType VariableType = 5 [json_name = "variable_type"];
      oneof SetVariable {
        bool BoolValue = 1 [json_name = "bool_value"];
        string StringValue = 2 [json_name = "string_value"];
        int64 LongValue = 3 [json_name = "long_value"];
      }
    }

    string Name = 1 [json_name = "name"];
    repeated .NAlice.TDivViewCapability.TSetDivVariablesDirective.TSetVariable SetVariable = 2 [json_name = "set_variable"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TDivViewCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TDivViewCapability.TState State = 3 [json_name = "state"];
}

