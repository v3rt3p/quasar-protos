syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TTvPlayerCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/tv_player;tvplayerpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTvPlayerCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = TvPlayerCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TPlayChannelDirective {
    option (.NAlice.SpeechKitName) = "play_channel_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = PlayChannelDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool IsMultiplex = 3 [json_name = "is_multiplex", (.NYT.column_name) = "is_multiplex"];
    oneof Id {
      string Uri = 1 [json_name = "uri", (.NYT.column_name) = "uri"];
      string ContentId = 2 [json_name = "content_id", (.NYT.column_name) = "content_id"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TTvPlayerCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TTvPlayerCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

