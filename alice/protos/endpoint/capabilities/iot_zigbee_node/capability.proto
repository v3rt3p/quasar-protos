syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotZigbeeNodeCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_zigbee_node;iotzigbeenodepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotZigbeeNodeCapability {
  message TParameters {
    .NAlice.TIotZigbeeNodeCapability.TType Type = 1 [json_name = "type"];
  }

  message TSignalQuality {
    .NAlice.TIotZigbeeNodeCapability.ESignalQualityStatus SignalQualityStatus = 1 [json_name = "signal_quality_status"];
    uint32 Lqi = 2 [json_name = "lqi"];
    int32 Rssi = 3 [json_name = "rssi"];
  }

  message TState {
    .NAlice.TIotZigbeeNodeCapability.TSignalQuality SignalQuality = 1 [json_name = "signal_quality"];
    uint32 Channel = 2 [json_name = "channel"];
    bool IsActive = 3 [json_name = "is_active"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotZigbeeNodeCapability Capability = 1 [json_name = "capability"];
  }

  enum TType {
    UNKNOWN = 0;
    ROUTER = 1;
    END_DEVICE = 2;
  }

  enum ESignalQualityStatus {
    Unknown = 0;
    Bad = 1;
    Weak = 2;
    Ok = 3;
    Good = 4;
    Excellent = 5;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotZigbeeNodeCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotZigbeeNodeCapability.TState State = 3 [json_name = "state"];
}

