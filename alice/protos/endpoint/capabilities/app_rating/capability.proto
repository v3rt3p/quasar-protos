syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AppRatingCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/app_rating;appratingpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAppRatingCapability {
  message TParameters {
  }

  message TState {
  }

  message TTriggerRatingDirective {
    string Name = 1 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TAppRatingCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TAppRatingCapability.TState State = 3 [json_name = "state"];
}

