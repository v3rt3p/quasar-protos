syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotAutoCalibrationCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_auto_calibration;iotautocalibrationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotAutoCalibrationCapability {
  message TParameters {
    bool BlocksInterface = 1 [json_name = "blocks_interface"];
  }

  message TState {
    .NAlice.TIotAutoCalibrationCapability.EState State = 1 [json_name = "state"];
    bool RecalibrationEnabled = 2 [json_name = "recalibration_enabled"];
  }

  message TStartIotAutoCalibrationDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TSetRecalibrationEnabledDirective {
    string Name = 1000 [json_name = "name"];
    bool Enabled = 1 [json_name = "enabled"];
  }

  message TResetCalibrationDirective {
    string Name = 1000 [json_name = "name"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotAutoCalibrationCapability Capability = 1 [json_name = "capability"];
  }

  enum EState {
    UNKNOWN = 0;
    NOT_CALIBRATED = 1;
    CALIBRATED = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotAutoCalibrationCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotAutoCalibrationCapability.TState State = 3 [json_name = "state"];
}

