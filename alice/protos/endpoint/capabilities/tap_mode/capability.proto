syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "TapModeCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/tap_mode;tapmodepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TTapModeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = TapModeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TTapModeCapability.EAction SupportedActions = 1 [json_name = "supported_actions", (.NYT.column_name) = "supported_actions"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TTapModeCapability.EAction SelectedAction = 1 [json_name = "selected_action", (.NYT.column_name) = "selected_action"];
  }

  enum EAction {
    Unknown = 0;
    CallVoiceAssistant = 1;
    ToggleNoiseCancelling = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TTapModeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TTapModeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

