syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "GoCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/go;gospb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/data/lat_lon.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TGoCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = GoCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.NData.TLatLon Location = 1 [json_name = "location", (.NYT.column_name) = "location"];
    .NAlice.TGoCapability.EActiveMode ActiveMode = 2 [json_name = "active_mode", (.NYT.column_name) = "active_mode"];
  }

  enum EActiveMode {
    Undefined = 0;
    Go = 1;
    Eats = 2;
    Delivery = 3;
    Grocery = 4;
    Market = 5;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TGoCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TGoCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

