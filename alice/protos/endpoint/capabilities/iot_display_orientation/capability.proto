syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotDisplayOrientationCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_display_orientation;iotdisplayorientationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotDisplayOrientationCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotDisplayOrientationCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotDisplayOrientationCapability.EOrientation Orientation = 1 [json_name = "orientation", (.NYT.column_name) = "orientation"];
  }

  message TSetIotDisplayOrientationDirective {
    option (.NAlice.SpeechKitName) = "set_iot_display_orientation_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotDisplayOrientationDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TIotDisplayOrientationCapability.EOrientation Orientation = 1 [json_name = "orientation", (.NYT.column_name) = "orientation"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotDisplayOrientationUpdateStateEventType;
    .NAlice.TIotDisplayOrientationCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EOrientation {
    VERTICAL = 0;
    VERTICAL_REVERSE = 1;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotDisplayOrientationCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotDisplayOrientationCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

