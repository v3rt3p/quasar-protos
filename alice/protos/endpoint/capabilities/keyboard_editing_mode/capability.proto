syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "KeyboardEditingModeCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/keyboard_editing_mode;keyboardeditingmodepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TKeyboardEditingModeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = KeyboardEditingModeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TKeyboardEditingModeCapability.EEditingMode EditingMode = 1 [json_name = "editing_mode", (.NYT.column_name) = "editing_mode"];
    bool ForceGeneralConversation = 2 [json_name = "force_general_conversation", (.NYT.column_name) = "force_general_conversation"];
  }

  enum EEditingMode {
    EM_DEFAULT = 0;
    EM_EDIT = 1;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TKeyboardEditingModeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TKeyboardEditingModeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

