syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "VolumeProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/volume;volumepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TVolumeCapability {
  message TParameters {
    bool SupportsPercentLevel = 1 [json_name = "supports_platform_level"];
    bool UseCoarseScale = 2 [json_name = "use_coarse_scale"];
    bool SupportVolumeDbLevels = 3 [json_name = "support_volume_db_levels"];
    repeated .NAlice.TVolumeCapability.EAudioStream SupportedStreams = 4 [json_name = "supported_streams"];
  }

  message TState {
    message TStreamState {
      .NAlice.TVolumeCapability.EAudioStream Stream = 1 [json_name = "stream"];
      bool IsMuted = 2 [json_name = "is_muted"];
      uint32 Level = 3 [json_name = "level"];
      uint32 MaxLevel = 4 [json_name = "max_level"];
      float PercentLevel = 5 [json_name = "percent_level"];
      .NAlice.TVolumeCapability.ESource LastChangeSource = 6 [json_name = "last_change_source"];
    }

    bool IsMuted = 1 [json_name = "is_muted"];
    uint32 Level = 2 [json_name = "level"];
    uint32 MaxLevel = 3 [json_name = "max_level"];
    float PercentLevel = 4 [json_name = "percent_level"];
    .NAlice.TVolumeCapability.ESource LastChangeSource = 5 [json_name = "last_change_source"];
    repeated float VolumeDbLevels = 6 [json_name = "volume_db_levels"];
    repeated .NAlice.TVolumeCapability.TState.TStreamState StreamStates = 7 [json_name = "stream_states"];
  }

  message TVolumeMuteDirective {
    bool IsMuted = 1 [json_name = "is_muted"];
    .NAlice.TVolumeCapability.ESource Source = 2 [json_name = "source"];
    .NAlice.TVolumeCapability.EAudioStream Stream = 3 [json_name = "stream"];
  }

  message TVolumeUnmuteDirective {
    .NAlice.TVolumeCapability.EAudioStream Stream = 1 [json_name = "stream"];
  }

  message TVolumeStartVolumeChange {
    uint32 InitialPercentLevel = 1 [json_name = "initial_percent_level"];
    uint32 FinalPercentLevel = 2 [json_name = "final_percent_level"];
    oneof TimeStepPolicy {
      uint32 StepMs = 3 [json_name = "step_ms"];
      uint32 FullTimeMs = 4 [json_name = "full_time_ms"];
    }
    optional uint32 PercentStep = 5 [json_name = "percent_step"];
  }

  message TVolumeStopVolumeChange {
    bool RestoreVolumeLevel = 1 [json_name = "restore_volume_level"];
  }

  message TVolumeSetDirective {
    enum EMode {
      EModeDefault = 0;
      EModeNotLessThan = 1;
      EModeNotMoreThan = 2;
    }

    float PercentLevel = 1 [json_name = "percent_level"];
    .NAlice.TVolumeCapability.TVolumeSetDirective.EMode Mode = 2 [json_name = "mode"];
    .NAlice.TVolumeCapability.ESource Source = 3 [json_name = "source"];
    .NAlice.TVolumeCapability.EAudioStream Stream = 4 [json_name = "stream"];
  }

  enum EAudioStream {
    MEDIA = 0;
    NAVIGATION = 1;
    VOICE_CALL = 2;
    ASSISTANT = 3;
  }

  enum ESource {
    ESourceVoice = 0;
    ESourceButton = 1;
    ESourceBluetooth = 2;
    ESourceRcuHold = 3;
    ESourceRcuPress = 4;
    ESourceOther = 1000;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TVolumeCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TVolumeCapability.TState State = 3 [json_name = "state"];
}

