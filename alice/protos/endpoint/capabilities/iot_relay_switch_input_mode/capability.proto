syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotRelaySwitchInputModeCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_relay_switch_input_mode;iotrelayswitchinputmodepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotRelaySwitchInputModeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotRelaySwitchInputModeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotRelaySwitchInputModeCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TSetModeDirective {
    option (.NAlice.SpeechKitName) = "iot_set_relay_switch_input_mode_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IotSetRelaySwitchInputModeDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TIotRelaySwitchInputModeCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotRelaySwitchInputModeUpdateStateEventType;
    .NAlice.TIotRelaySwitchInputModeCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EMode {
    Undefined = 0;
    Native = 1;
    Pulse = 2;
    PulseWireless = 3;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotRelaySwitchInputModeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotRelaySwitchInputModeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

