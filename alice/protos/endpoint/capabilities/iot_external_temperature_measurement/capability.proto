syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotExternalTemperatureMeasurementCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_external_temperature_measurement;iotexternaltemperaturemeasurementpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotExternalTemperatureMeasurementCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotExternalTemperatureMeasurementCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.EUnit Unit = 1 [json_name = "unit", (.NYT.column_name) = "unit"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool IsEnabled = 1 [json_name = "is_enabled", (.NYT.column_name) = "is_enabled"];
    double MeasuredValue = 2 [json_name = "measured_value", (.NYT.column_name) = "measured_value"];
  }

  message TSetEnabledExternalTemperatureMeasurementDirective {
    option (.NAlice.SpeechKitName) = "set_enabled_external_temperature_measurement_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetEnabledExternalTemperatureMeasurementDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool IsEnabled = 1 [json_name = "is_enabled", (.NYT.column_name) = "is_enabled"];
  }

  message TSetMeasuredValueDirective {
    option (.NAlice.SpeechKitName) = "set_measured_value_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetMeasuredValueDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    double MeasuredValue = 1 [json_name = "measured_value", (.NYT.column_name) = "measured_value"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotExternalTemperatureMeasurementUpdateStateEventType;
    .NAlice.TIotExternalTemperatureMeasurementCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotExternalTemperatureMeasurementCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotExternalTemperatureMeasurementCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

