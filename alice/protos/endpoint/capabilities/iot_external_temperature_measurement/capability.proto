syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotExternalTemperatureMeasurementCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_external_temperature_measurement;iotexternaltemperaturemeasurementpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotExternalTemperatureMeasurementCapability {
  message TParameters {
    .NAlice.EUnit Unit = 1 [json_name = "unit"];
  }

  message TState {
    bool IsEnabled = 1 [json_name = "is_enabled"];
    double MeasuredValue = 2 [json_name = "measured_value"];
  }

  message TSetEnabledExternalTemperatureMeasurementDirective {
    string Name = 1000 [json_name = "name"];
    bool IsEnabled = 1 [json_name = "is_enabled"];
  }

  message TSetMeasuredValueDirective {
    string Name = 1000 [json_name = "name"];
    double MeasuredValue = 1 [json_name = "measured_value"];
  }

  message TUpdateStateEvent {
    .NAlice.TIotExternalTemperatureMeasurementCapability Capability = 1 [json_name = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotExternalTemperatureMeasurementCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotExternalTemperatureMeasurementCapability.TState State = 3 [json_name = "state"];
}

