syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "NoiseReductionCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/noise_reduction;noisereductionpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TNoiseReductionCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = NoiseReductionCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TNoiseReductionCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TSetModeDirective {
    option (.NAlice.SpeechKitName) = "noise_reduction_set_mode_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = NoiseReductionSetModeDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TNoiseReductionCapability.EMode Mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  enum EMode {
    Disabled = 0;
    Default = 1;
    Nanny = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TNoiseReductionCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TNoiseReductionCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

