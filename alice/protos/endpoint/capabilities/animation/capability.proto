syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AnimationCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/animation;animationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAnimationCapability {
  message TParameters {
    repeated .NAlice.TAnimationCapability.EFormat SupportedFormats = 1 [json_name = "supported_formats"];
    repeated .NAlice.TAnimationCapability.TScreen Screens = 2 [json_name = "screens"];
    repeated .NAlice.TAnimationCapability.EAnimationType SupportedTypes = 3 [json_name = "supported_types"];
    bool SupportsStreaming = 4 [json_name = "supports_streaming"];
  }

  message TScreen {
    enum EScreenType {
      UnknownScreenType = 0;
      Oknix = 1;
      Panel = 2;
      LedScreen = 3;
      Ring = 4;
      ScledScreen = 5;
      BatteryLed = 6;
    }

    enum EFamily {
      UnknownFamily = 0;
      Mini2 = 1;
      Cucumber = 2;
      Chiron = 3;
      Plum = 4;
      Bergamot = 5;
      Pickle = 6;
      Mango = 7;
      Orion = 8;
      Repa = 9;
      Brukva = 10;
    }

    string Guid = 1 [json_name = "guid"];
    .NAlice.TAnimationCapability.TScreen.EScreenType ScreenType = 2 [json_name = "screen_type"];
    .NAlice.TAnimationCapability.TScreen.EFamily Family = 3 [json_name = "family"];
  }

  message TAnimation {
    enum EAnimationType {
      UnknownAnimationType = 0;
      Nothing = 1;
      Idle = 2;
      Notification = 3;
      TimerCountdown = 4;
    }

    .NAlice.TAnimationCapability.TAnimation.EAnimationType AnimationType = 1 [json_name = "animation_type"];
  }

  message TState {
    reserved "ScreenStates";
    reserved 1;
    message TScreenState {
      reserved "Screen";
      reserved 1;
      bool Enabled = 2 [json_name = "enabled"];
      .NAlice.TAnimationCapability.TAnimation Animation = 3 [json_name = "animation"];
    }

    map<string, .NAlice.TAnimationCapability.TState.TScreenState> ScreenStatesMap = 2 [json_name = "screen_states_map"];
  }

  message TDrawAnimationDirective {
    message TAnimation {
      message TS3Directory {
        string Bucket = 1 [json_name = "bucket"];
        string Path = 2 [json_name = "path"];
      }

      message TBinaryAnimation {
        enum ECompressionType {
          Unknown = 0;
          None = 1;
          Gzip = 2;
        }

        .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation.TBinaryAnimation.ECompressionType Compression = 1 [json_name = "compression_type"];
        string Base64EncodedValue = 2 [json_name = "base64_encoded_value"];
      }

      message TTypedAnimation {
        .NAlice.TAnimationCapability.EAnimationType Type = 1 [json_name = "type"];
      }

      oneof Value {
        .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation.TBinaryAnimation BinaryAnimation = 1 [json_name = "binary_animation"];
        .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation.TS3Directory S3Directory = 2 [json_name = "s3_directory"];
        .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation.TTypedAnimation TypedAnimation = 3 [json_name = "typed_animation"];
      }
    }

    message TAnimationOptions {
      enum ESubstitutionType {
        Unknown = 0;
        Background = 1;
        Foreground = 2;
        Substitution = 3;
      }

      .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimationOptions.ESubstitutionType SubstitutionType = 1 [json_name = "substitution_type"];
      optional uint64 MinDurationMs = 2 [json_name = "min_duration_ms"];
      optional uint64 MaxDurationMs = 3 [json_name = "max_duration_ms"];
    }

    enum EAnimationStopPolicy {
      Unknown = 0;
      PlayOnce = 1;
      PlayOnceTillEndOfTTS = 2;
      RepeatLastTillEndOfTTS = 3;
      RepeatLastTillNextDirective = 4;
      RepeatTillScreenAlive = 5;
    }

    enum ESpeakingAnimationPolicy {
      Default = 0;
      PlaySpeakingEndOfTts = 1;
      SkipSpeakingAnimation = 2;
    }

    string Name = 1000 [json_name = "name"];
    repeated .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation Animations = 1 [json_name = "animations"];
    .NAlice.TAnimationCapability.TDrawAnimationDirective.EAnimationStopPolicy AnimationStopPolicy = 2 [json_name = "animation_stop_policy"];
    .NAlice.TAnimationCapability.TDrawAnimationDirective.ESpeakingAnimationPolicy SpeakingAnimationPolicy = 3 [json_name = "speaking_animation_policy"];
    .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimationOptions AnimationOptions = 4 [json_name = "animation_options"];
    repeated .NAlice.TAnimationCapability.TDrawAnimationDirective.TAnimation FadeOutAnimations = 5 [json_name = "fade_out_animations"];
  }

  message TEnableScreenDirective {
    reserved "Screen";
    reserved 1;
    string Name = 1000 [json_name = "name"];
    string Guid = 2 [json_name = "guid"];
  }

  message TDisableScreenDirective {
    reserved "Screen";
    reserved 1;
    string Name = 1000 [json_name = "name"];
    string Guid = 2 [json_name = "guid"];
  }

  enum EFormat {
    S3Url = 0;
    Binary = 1;
    Typed = 2;
  }

  enum EAnimationType {
    Unknown = 0;
    ShowBatteryLevel = 1;
    EmotionalSadness = 2;
    EmotionalSmile = 3;
    EmotionalJoy = 4;
    EmotionalAngry = 5;
    EmotionalWow = 6;
    PlayerPause = 7;
    ShowCO2Level = 8;
    ShowHumidityLevel = 9;
    ShowTemperatureLevel = 10;
    PlayerNext = 11;
    EmotionalWink = 12;
    EmotionalLove = 13;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TAnimationCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TAnimationCapability.TState State = 3 [json_name = "state"];
}

