syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "NoiseCancellationCapability";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/noise_cancellation;noisecancellationpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TNoiseCancellationCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = NoiseCancellationCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum EMode {
      Unknown = 0;
      Off = 1;
      Active = 2;
      Transparent = 3;
      Adaptive = 4;
    }

    .NAlice.TNoiseCancellationCapability.TState.EMode mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = NoiseCancellationUpdateStateEventType;
    .NAlice.TNoiseCancellationCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  message TSetNoiseCancellationModeDirective {
    option (.NAlice.SpeechKitName) = "set_noise_cancellation_mode_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetNoiseCancellationModeDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TNoiseCancellationCapability.TState.EMode mode = 1 [json_name = "mode", (.NYT.column_name) = "mode"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TNoiseCancellationCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TNoiseCancellationCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

