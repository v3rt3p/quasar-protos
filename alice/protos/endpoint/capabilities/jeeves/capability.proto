syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "JeevesCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/jeeves;jeevespb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TJeevesCapability {
  message TParameters {
  }

  message TState {
    repeated string EnabledPluginIds = 1 [json_name = "enabled_plugin_ids"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TJeevesCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TJeevesCapability.TState State = 3 [json_name = "state"];
}

