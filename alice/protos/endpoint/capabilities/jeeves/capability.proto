syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "JeevesCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/jeeves;jeevespb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TJeevesCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = JeevesCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated string EnabledPluginIds = 1 [json_name = "enabled_plugin_ids", (.NYT.column_name) = "enabled_plugin_ids"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TJeevesCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TJeevesCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

