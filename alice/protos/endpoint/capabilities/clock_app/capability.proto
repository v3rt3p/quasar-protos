syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "ClockAppCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/clock_app;clockapppb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/scenario/alarm/alarm.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TClockAppCapability {
  message TParameters {
  }

  message TState {
    oneof ScreenState {
      .NAlice.TClockAppCapability.TAlarmListScreenState AlarmListScreenState = 1 [json_name = "alarm_list_screen_state"];
      .NAlice.TClockAppCapability.TAlarmEditScreenState AlarmEditScreenState = 2 [json_name = "alarm_edit_screen_state"];
      .NAlice.TClockAppCapability.TAlarmActiveScreenState AlarmActiveScreenState = 3 [json_name = "alarm_active_screen_state"];
      .NAlice.TClockAppCapability.TTimerListScreenState TimerListScreenState = 4 [json_name = "timer_list_screen_state"];
      .NAlice.TClockAppCapability.TTimerInfoScreenState TimerInfoScreenState = 5 [json_name = "timer_info_screen_state"];
      .NAlice.TClockAppCapability.TTimerActiveScreenState TimerActiveScreenState = 6 [json_name = "timer_active_screen_state"];
      .NAlice.TClockAppCapability.TTimerCreateScreenState TimerCreateScreenState = 7 [json_name = "timer_create_screen_state"];
    }
  }

  message TAlarmListScreenState {
    reserved "AlarmIds";
    reserved "OtherAlarmIds";
    reserved 1;
    reserved 2;
    .NAlice.TClockAppCapability.TAlarmList AlarmList = 3 [json_name = "alarm_list"];
  }

  message TAlarmEditScreenState {
    .NAlice.NData.TAlarm Alarm = 1 [json_name = "alarm"];
  }

  message TAlarmActiveScreenState {
    string AlarmId = 1 [json_name = "alarm_id"];
  }

  message TTimerListScreenState {
    reserved "TargetTimers";
    reserved 2;
    enum ESectionOfListScreen {
      Undefined = 0;
      Timers = 1;
      History = 2;
    }

    .NAlice.TClockAppCapability.TTimerListScreenState.ESectionOfListScreen TargetSection = 1 [json_name = "target_section"];
    oneof ScreenInfo {
      uint32 TimerDuration = 3 [json_name = "timer_duration"];
      .NAlice.TClockAppCapability.TTimerList TimerList = 4 [json_name = "timer_list"];
    }
  }

  message TTimerInfoScreenState {
    string TimerId = 1 [json_name = "timer_id"];
  }

  message TTimerActiveScreenState {
    string TimerId = 1 [json_name = "timer_id"];
  }

  message TTimerCreateScreenState {
    uint32 TimerDuration = 1 [json_name = "timer_duration"];
  }

  message TOpenScreenAlarmListDirective {
    string Name = 1 [json_name = "name"];
    repeated string TargetAlarmIds = 2 [json_name = "target_alarm_ids"];
    bool ForceAutoClose = 3 [json_name = "force_auto_close"];
  }

  message TOpenScreenAlarmEditDirective {
    string Name = 1 [json_name = "name"];
    string AlarmId = 2 [json_name = "alarm_id"];
  }

  message TCloseScreenAlarmActiveDirective {
    string Name = 1 [json_name = "name"];
  }

  message TOpenScreenTimerListDirective {
    string Name = 1 [json_name = "name"];
    repeated string TargetTimerIds = 2 [json_name = "target_timer_ids"];
    .NAlice.TClockAppCapability.TTimerListScreenState.ESectionOfListScreen TargetSection = 3 [json_name = "target_section"];
    bool ForceAutoClose = 4 [json_name = "force_auto_close"];
  }

  message TOpenScreenTimerInfoDirective {
    string Name = 1 [json_name = "name"];
    string TimerId = 2 [json_name = "timer_id"];
  }

  message TCloseScreenTimerActiveDirective {
    string Name = 1 [json_name = "name"];
  }

  message TAlarmList {
    repeated string TargetAlarmIds = 1 [json_name = "target_alarm_ids"];
    repeated string OtherAlarmIds = 2 [json_name = "other_alarm_ids"];
  }

  message TTimerList {
    repeated string TargetTimerIds = 1 [json_name = "target_timer_ids"];
    repeated string OtherTimerIds = 2 [json_name = "other_timer_ids"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TClockAppCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TClockAppCapability.TState State = 3 [json_name = "state"];
}

