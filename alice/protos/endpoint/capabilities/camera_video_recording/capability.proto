syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "CameraVideoRecordingCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/camera_video_recording;camera_video_recordingpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCameraVideoRecordingCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = CameraVideoRecordingCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TStartVideoRecordingDirective {
    option (.NAlice.SpeechKitName) = "camera_video_recording_start_video_recording_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CameraVideoRecordingStartVideoRecordingDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    uint32 DurationSec = 1 [json_name = "duration_sec", (.NYT.column_name) = "duration_sec"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TCameraVideoRecordingCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TCameraVideoRecordingCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

