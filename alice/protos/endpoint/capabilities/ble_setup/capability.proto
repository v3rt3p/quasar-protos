syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "BleSetupCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/ble_setup;blesetuppb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBleSetupCapability {
  message TParameters {
  }

  message TState {
  }

  message TDeviceInfo {
    string DeviceId = 1 [json_name = "device_id"];
    string Platform = 2 [json_name = "platform"];
  }

  message TStartBleAdvertisingDirective {
    string Name = 1000 [json_name = "name"];
    uint32 TimeoutMs = 1 [json_name = "timeout_ms"];
  }

  message TStartBleDiscoveryDirective {
    string Name = 1000 [json_name = "name"];
    string DiscoveryId = 1 [json_name = "discovery_id"];
    string Platform = 2 [json_name = "platform"];
    uint32 TimeoutMs = 3 [json_name = "timeout_ms"];
  }

  message TStartBleSetupDirective {
    string Name = 1000 [json_name = "name"];
    string DeviceId = 1 [json_name = "device_id"];
    string CipherText = 2 [json_name = "ciphertext"];
    string C = 3 [json_name = "c"];
    string M = 4 [json_name = "m"];
    uint32 TimeoutMs = 5 [json_name = "timeout_ms"];
  }

  message TBleDiscoveryFinishedEvent {
    string DiscoveryId = 1 [json_name = "discovery_id"];
    repeated .NAlice.TBleSetupCapability.TDeviceInfo Devices = 2 [json_name = "device_info"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TBleSetupCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TBleSetupCapability.TState State = 3 [json_name = "state"];
}

