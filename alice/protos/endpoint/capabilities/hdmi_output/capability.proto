syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "HdmiOutputCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/hdmi_output;hdmi_outputpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message THdmiOutputCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = HdmiOutputCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool IsHdmiConnected = 1 [json_name = "is_hdmi_connected", (.NYT.column_name) = "hdmi_connected"];
    bool IsHdmiAudioOn = 2 [json_name = "is_hdmi_audio_on", (.NYT.column_name) = "hdmi_audio_on"];
  }

  message TCecVolumeUpDirective {
    option (.NAlice.SpeechKitName) = "cec_volume_up_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CecVolumeUpDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TCecVolumeDownDirective {
    option (.NAlice.SpeechKitName) = "cec_volume_down_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CecVolumeDownDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = HdmiOutputUpdateStateEventType;
    .NAlice.THdmiOutputCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.THdmiOutputCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.THdmiOutputCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

