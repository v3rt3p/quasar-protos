syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceProProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_pro;alicepropb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceProCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceProCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TAliceProCapability.ESubscriptionStatus SubscriptionStatus = 1 [json_name = "subscription_status", (.NYT.column_name) = "subscription_status"];
  }

  message TOpenProPurchaseScreenDirective {
    option (.NAlice.SpeechKitName) = "open_pro_purchase_screen_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = OpenProPurchaseScreenDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TForceSubscriptionCheckDirective {
    option (.NAlice.SpeechKitName) = "force_subscription_check_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ForceSubscriptionCheckDirectiveType;
  }

  message TShowAliceProBannerDirective {
    option (.NAlice.SpeechKitName) = "show_alice_pro_banner_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowAliceProBannerDirectiveType;
  }

  enum ESubscriptionStatus {
    NoSubscription = 0;
    SubscriptionActive = 1;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceProCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceProCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

