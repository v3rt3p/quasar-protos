syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotMotorDirectionCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_motor_direction;iotmotordirectionpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotMotorDirectionCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotMotorDirectionCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TIotMotorDirectionCapability.EDirection Direction = 1 [json_name = "direction", (.NYT.column_name) = "direction"];
  }

  message TSetMotorDirectionDirective {
    option (.NAlice.SpeechKitName) = "set_motor_direction_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetMotorDirectionDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TIotMotorDirectionCapability.EDirection Direction = 1 [json_name = "direction", (.NYT.column_name) = "direction"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotMotorDirectionUpdateStateEventType;
    .NAlice.TIotMotorDirectionCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  enum EDirection {
    UNKNOWN = 0;
    NORMAL = 1;
    REVERSED = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotMotorDirectionCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotMotorDirectionCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

