syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotAntifreezeCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_antifreeze;iotantifreezepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotAntifreezeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = IotAntifreezeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TSetIotAntifreezeDirective {
    option (.NAlice.SpeechKitName) = "set_iot_antifreeze_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIotAntifreezeDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = IotAntifreezeUpdateStateEventType;
    .NAlice.TIotAntifreezeCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TIotAntifreezeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TIotAntifreezeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

