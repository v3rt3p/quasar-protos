syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "CounterActivationCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/counter_activation;counteractivationpb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCounterActivationCapability {
  message TParameters {
  }

  message TState {
    bool Enabled = 1 [json_name = "enabled"];
    repeated string AvailableModels = 2 [json_name = "available_models"];
  }

  message TCounterActivationStartedEvent {
    message ModelResult {
      string ModelName = 1 [json_name = "model_name"];
      float Confidence = 2 [json_name = "confidence"];
    }

    string Phrase = 1 [json_name = "phrase"];
    repeated .NAlice.TCounterActivationCapability.TCounterActivationStartedEvent.ModelResult ModelResults = 2 [json_name = "model_results"];
    string SessionId = 3 [json_name = "session_id"];
  }

  message TCounterActivationPriorityEvent {
    enum EType {
      PhraseSpotted = 0;
      IrrelevantRequest = 1;
    }

    .NAlice.TCounterActivationCapability.TCounterActivationPriorityEvent.EType Event = 1 [json_name = "event"];
    string SessionId = 2 [json_name = "session_id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TCounterActivationCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TCounterActivationCapability.TState State = 3 [json_name = "state"];
}

