syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "SmartVolumeProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/smart_volume;smart_volumepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TSmartVolumeCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = SmartVolumeCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool Enabled = 1 [json_name = "enabled", (.NYT.column_name) = "enabled"];
  }

  message TProcessSmartVolumeDirective {
    option (.NAlice.SpeechKitName) = "process_smart_volume_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ProcessSmartVolumeDirectiveType;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TSmartVolumeCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TSmartVolumeCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

