syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "ScreenOnOffCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/screen_on_off;screenonoffpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TScreenOnOffCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = ScreenOnOffCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool On = 1 [json_name = "on", (.NYT.column_name) = "on"];
  }

  message TSetScreenOnOffDirective {
    option (.NAlice.SpeechKitName) = "set_screen_on_off_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetScreenOnOffDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    bool On = 1 [json_name = "on", (.NYT.column_name) = "on"];
  }

  message TUpdateStateEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = ScreenOnOffUpdateStateEventType;
    .NAlice.TScreenOnOffCapability Capability = 1 [json_name = "capability", (.NYT.column_name) = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TScreenOnOffCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TScreenOnOffCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

