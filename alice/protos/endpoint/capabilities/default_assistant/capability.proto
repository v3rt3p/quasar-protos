syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "DefaultAssistantProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/default_assistant;defaultassistantpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TDefaultAssistantCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = DefaultAssistantCapabilityType;
  option (.NAlice.DirectiveType) = ShowAssistantOnboardingDirectiveType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TShowAssistantOnboardingDirective {
    option (.NAlice.SpeechKitName) = "show_assistant_onboarding_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowAssistantOnboardingDirectiveType;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TDefaultAssistantCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TDefaultAssistantCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

