syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "WifiProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/wifi;wifipb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TWifiCapability {
  message TParameters {
  }

  message TState {
    message TNetwork {
      string Ssid = 1 [json_name = "ssid"];
    }

    .NAlice.TWifiCapability.TState.TNetwork CurrentNetwork = 1 [json_name = "current_network"];
  }

  message TNetworkInfo {
    string Ssid = 1 [json_name = "ssid"];
    string Psk = 2 [json_name = "psk"];
    bool AllowAutoConnect = 3 [json_name = "allow_auto_connect"];
    bool Hidden = 4 [json_name = "hidden"];
    optional .NAlice.TWifiCapability.EWifiType SecurityProtocol = 5 [json_name = "security_protocol"];
  }

  message TConnectToNetworkDirective {
    string Ssid = 1 [json_name = "ssid"];
  }

  message TSetWifiConfigurationDirective {
    repeated .NAlice.TWifiCapability.TNetworkInfo Networks = 1 [json_name = "networks"];
    string WifiHash = 2 [json_name = "wifi_hash"];
  }

  message TForceSyncWifiConfigurationDirective {
  }

  message TUpdateStateEvent {
    .NAlice.TWifiCapability Capability = 1 [json_name = "capability"];
  }

  message TSyncWifiConfigurationEvent {
    message TFirstSyncInfo {
      message TNetwork {
        string Ssid = 1 [json_name = "ssid"];
      }

      .NAlice.TWifiCapability.TSyncWifiConfigurationEvent.TFirstSyncInfo.TNetwork CurrentNetwork = 1 [json_name = "current_network"];
    }

    .NAlice.TWifiCapability.TSyncWifiConfigurationEvent.TFirstSyncInfo FirstSyncInfo = 1 [json_name = "first_sync_info"];
  }

  message TConnectionFailureEvent {
    string Ssid = 1 [json_name = "ssid"];
    .NAlice.TWifiCapability.EConnectionFailureCause Cause = 2 [json_name = "cause"];
  }

  enum EConnectionFailureCause {
    Unknown = 0;
    SsidNotFound = 1;
    WrongPsk = 2;
    NoInternet = 3;
  }

  enum EWifiType {
    WEP = 0;
    WPA = 1;
    OPEN = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TWifiCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TWifiCapability.TState State = 3 [json_name = "state"];
}

