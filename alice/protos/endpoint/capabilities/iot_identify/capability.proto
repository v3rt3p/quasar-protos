syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "IotIdentifyCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/iot_identify;iotidentifypb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TIotIdentifyCapability {
  message TParameters {
    message TRange {
      uint32 Min = 1 [json_name = "min"];
      uint32 Max = 2 [json_name = "max"];
    }

    .NAlice.TIotIdentifyCapability.TParameters.TRange IdentifyTimeRangeSec = 1 [json_name = "identify_time_range_sec"];
  }

  message TState {
  }

  message TStartIdentifyDirective {
    string Name = 1000 [json_name = "name"];
    uint32 IdentifyTimeSec = 1 [json_name = "identify_time_sec"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TIotIdentifyCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TIotIdentifyCapability.TState State = 3 [json_name = "state"];
}

