syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "VoiceEnrollmentProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/voice_enrollment;voiceenrollmentpb";

import "google/protobuf/descriptor.proto";
import "alice/library/censor/protos/extension.proto";
import "alice/library/yt/extensions/alice_options.proto";
import "alice/protos/data/scenario/voiceprint/personalization_data.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TVoiceEnrollmentCapability {
  message TParameters {
    bool SupportsShareDirective = 1 [json_name = "supports_share_directive"];
    bool SuppressFinishResponse = 2 [json_name = "suppress_finish_response"];
  }

  message TState {
    bool EnrollmentInProgress = 1 [json_name = "enrollment_in_progress"];
  }

  message TEnrollmentStartDirective {
    uint32 TimeoutMs = 1 [json_name = "timeout_ms"];
    uint64 Puid = 2 [json_name = "puid"];
  }

  message TEnrollmentFinishDirective {
    string PersId = 1 [json_name = "pers_id"];
    bool SendGuestEnrollmentFinishFrame = 2 [json_name = "send_guest_enrollment_finish_frame"];
  }

  message TEnrollmentCancelDirective {
  }

  message TEnrollmentShareDirective {
    string Name = 1000 [json_name = "name"];
    uint64 Puid = 1 [json_name = "puid"];
    string UserName = 2 [json_name = "user_name"];
    .NAlice.NData.NVoiceprint.EGender Gender = 3 [json_name = "gender"];
    repeated string DeviceIds = 4 [json_name = "device_ids"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TVoiceEnrollmentCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TVoiceEnrollmentCapability.TState State = 3 [json_name = "state"];
}

