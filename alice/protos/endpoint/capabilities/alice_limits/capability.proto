syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceLimitsProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_limits;alicelimitspb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceLimitsCapability {
  message TParameters {
  }

  message TState {
  }

  message TLimitUpdatedDirective {
    string Name = 1 [json_name = "name"];
    string Feature = 2 [json_name = "feature"];
    uint64 RequestsUsed = 3 [json_name = "requests_used"];
    string Title = 4 [json_name = "title"];
    string Subtitle = 5 [json_name = "subtitle"];
    string CtaText = 6 [json_name = "cta_text"];
    string Variant = 7 [json_name = "variant"];
    string PaywallType = 8 [json_name = "paywall_type"];
  }

  message TExpertLimitNoticeDirective {
    enum EKind {
      EK_UNKNOWN = 0;
      EK_RUNNING_OUT = 1;
      EK_EXHAUSTED = 2;
    }

    string Name = 1 [json_name = "name"];
    .NAlice.TAliceLimitsCapability.TExpertLimitNoticeDirective.EKind Kind = 2 [json_name = "kind"];
    uint64 RequestsLeft = 3 [json_name = "requests_left"];
    string DialogId = 4 [json_name = "dialog_id"];
    string PaywallType = 5 [json_name = "paywall_type"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TAliceLimitsCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TAliceLimitsCapability.TState State = 3 [json_name = "state"];
}

