syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "GeoSyncProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/geo_sync;geosyncpb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "alice/protos/data/lat_lon.proto";
import "alice/protos/data/timezone.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TGeoSyncCapability {
  message TParameters {
  }

  message TState {
    .NAlice.NData.TLatLon Location = 1 [json_name = "location"];
    .NAlice.NData.TLatLon LaasRealLocation = 5 [json_name = "laas_real_location"];
    .NAlice.NData.TTimezone Timezone = 2 [json_name = "timezone"];
    bool TimezoneIsLocked = 3 [json_name = "timezone_is_locked"];
    .NAlice.TGeoSyncCapability.TNextTimezone NextTimezone = 4 [json_name = "next_timezone"];
  }

  message TSetLocationDirective {
    .NAlice.NData.TLatLon Location = 1 [json_name = "location"];
    .NAlice.NData.TLatLon LaasRealLocation = 3 [json_name = "laas_real_location"];
    string Name = 2 [json_name = "name"];
  }

  message TSetTimezoneDirective {
    message TNextTimezone {
      .google.protobuf.Timestamp Epoch = 1 [json_name = "epoch"];
      .NAlice.NData.TTimezone Timezone = 2 [json_name = "timezone"];
    }

    .NAlice.NData.TTimezone Timezone = 1 [json_name = "timezone"];
    string Name = 2 [json_name = "name"];
    .NAlice.TGeoSyncCapability.TSetTimezoneDirective.TNextTimezone NextTimezone = 4 [json_name = "next_timezone"];
  }

  message TNextTimezone {
    .google.protobuf.Timestamp SwitchTimestamp = 1 [json_name = "switch_timestamp"];
    .NAlice.NData.TTimezone Timezone = 2 [json_name = "timezone"];
  }

  message TSetGmtDirective {
    .google.protobuf.Timestamp Epoch = 1 [json_name = "epoch"];
    string Name = 2 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TGeoSyncCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TGeoSyncCapability.TState State = 3 [json_name = "state"];
}

