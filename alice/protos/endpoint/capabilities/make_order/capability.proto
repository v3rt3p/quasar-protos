syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "MakeOrderCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/make_order;makeorderpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/data/scenario/order/make_order.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "alice/protos/data/lat_lon.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMakeOrderCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = MakeOrderCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.NOrder.TItem CartItems = 1 [json_name = "cart_items", (.NYT.column_name) = "cart_items"];
    .NAlice.TMakeOrderCapability.TGeo Geo = 2 [json_name = "geo", (.NYT.column_name) = "geo"];
  }

  message TGeo {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.NData.TLatLon LatLon = 1 [json_name = "lat_lon", (.NYT.column_name) = "lat_lon"];
    string TextAddress = 2 [json_name = "text_address", (.NYT.column_name) = "text_address"];
  }

  message TProcessSearchResultsDirective {
    option (.NAlice.SpeechKitName) = "make_order_process_search_results";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = MakeOrderProcessSearchResultsDirectiveType;
    reserved "SearchResponses";
    reserved 1;
    message TSuccess {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      repeated .NAlice.NOrder.TSearchResponse SearchResponses = 1 [json_name = "search_responses", (.NYT.column_name) = "search_responses"];
    }

    message TError {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      enum EErrorType {
        Unknown = 0;
        Unauthorized = 1;
        UnsupportedProvider = 2;
        UncertainLocation = 3;
      }

      string ErrorMessage = 1 [json_name = "error_message", (.NYT.column_name) = "error_message"];
      .NAlice.TMakeOrderCapability.TProcessSearchResultsDirective.TError.EErrorType ErrorType = 2 [json_name = "error_type", (.NYT.column_name) = "error_type"];
    }

    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    oneof Result {
      option (.NYT.variant_field_name) = "result";
      .NAlice.TMakeOrderCapability.TProcessSearchResultsDirective.TSuccess Success = 2 [json_name = "success", (.NYT.column_name) = "success"];
      .NAlice.TMakeOrderCapability.TProcessSearchResultsDirective.TError Error = 3 [json_name = "error", (.NYT.column_name) = "error"];
    }
  }

  message TLaunchApplicationDirective {
    option (.NAlice.SpeechKitName) = "make_order_launch_application";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = MakeOrderLaunchApplicationDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TUpdateStateDirective {
    option (.NAlice.SpeechKitName) = "make_order_update_state";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = MakeOrderUpdateStateDirectiveType;
    message TSuccess {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      .NAlice.TMakeOrderCapability.TState State = 1 [json_name = "state", (.NYT.column_name) = "state"];
    }

    message TError {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      enum EErrorType {
        Unknown = 0;
        UncertainLocation = 1;
        Unauthorized = 2;
        FailedToGetState = 3;
        FailedToGetCart = 4;
      }

      string ErrorMessage = 1 [json_name = "error_message", (.NYT.column_name) = "error_message"];
      .NAlice.TMakeOrderCapability.TUpdateStateDirective.TError.EErrorType ErrorType = 2 [json_name = "error_type", (.NYT.column_name) = "error_type"];
    }

    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    oneof Result {
      option (.NYT.variant_field_name) = "result";
      .NAlice.TMakeOrderCapability.TUpdateStateDirective.TSuccess Success = 1 [json_name = "success", (.NYT.column_name) = "success"];
      .NAlice.TMakeOrderCapability.TUpdateStateDirective.TError Error = 2 [json_name = "error", (.NYT.column_name) = "error"];
    }
  }

  message TProcessCheckoutResultDirective {
    option (.NAlice.SpeechKitName) = "make_order_process_checkout_result";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = MakeOrderProcessCheckoutResultDirectiveType;
    message TSuccess {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
    }

    message TError {
      option (.NYT.default_field_flags) = SERIALIZATION_YT;
      enum EErrorType {
        Unknown = 0;
        UnsupportedProvider = 1;
        Unauthorized = 2;
        ProviderResponseError = 3;
      }

      string ErrorMessage = 1 [json_name = "error_message", (.NYT.column_name) = "error_message"];
      .NAlice.TMakeOrderCapability.TProcessCheckoutResultDirective.TError.EErrorType ErrorType = 2 [json_name = "error_type", (.NYT.column_name) = "error_type"];
    }

    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    oneof Result {
      option (.NYT.variant_field_name) = "result";
      .NAlice.TMakeOrderCapability.TProcessCheckoutResultDirective.TSuccess Success = 1 [json_name = "success", (.NYT.column_name) = "success"];
      .NAlice.TMakeOrderCapability.TProcessCheckoutResultDirective.TError Error = 2 [json_name = "error", (.NYT.column_name) = "error"];
    }
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TMakeOrderCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TMakeOrderCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

