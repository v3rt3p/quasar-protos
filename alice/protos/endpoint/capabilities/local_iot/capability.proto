syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LocalIotProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/local_iot;localiotpb";

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "alice/megamind/protos/common/iot_client.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "alice/protos/api/alicekit/directives/directive.proto";
import "alice/protos/api/alicekit/iot/endpoint_protocol/endpoint_protocol.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLocalIoTCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = LocalIoTCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    reserved "IoTUserInfoSerialized";
    reserved 1;
    .NAlice.TLocalIoTCapability.TIoTAccountSettings IoTAccountSettings = 2 [json_name = "iot_account_settings", (.NYT.column_name) = "iot_account_settings"];
    .NAlice.TIoTClientUserInfo IoTUserInfo = 3 [json_name = "iot_user_info", (.NYT.column_name) = "iot_user_info"];
  }

  message TIoTAccountSettings {
    enum EReactionType {
      SOUND = 0;
      NLG = 1;
    }

    .NAlice.TLocalIoTCapability.TIoTAccountSettings.EReactionType ResponseReactionType = 1 [json_name = "response_reaction_type", (.NYT.column_name) = "response_reaction_type"];
  }

  message TSyncIoTUserInfoDirective {
    option (.NAlice.SpeechKitName) = "sync_iot_user_info";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SyncIoTUserInfoDirectiveType;
    reserved "IoTUserInfoType";
    reserved 2;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TSetIoTUserInfoDirective {
    option (.NAlice.SpeechKitName) = "set_iot_user_info";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIoTUserInfoDirectiveType;
    reserved "IoTUserInfoType";
    reserved 3;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    bytes IoTUserInfoSerialized = 2 [json_name = "iot_user_info_serialized", (.NYT.column_name) = "iot_user_info_serialized"];
    .NAlice.TIoTClientUserInfo IoTClientUserInfo = 4 [json_name = "iot_client_user_info", (.NYT.column_name) = "iot_client_user_info"];
  }

  message TSetIoTAccountSettingsDirective {
    option (.NAlice.SpeechKitName) = "set_iot_account_settings";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetIoTAccountSettingsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TLocalIoTCapability.TIoTAccountSettings IoTAccountSettings = 2 [json_name = "iot_account_settings", (.NYT.column_name) = "iot_account_settings"];
  }

  message TRouteDirective {
    option (.NAlice.SpeechKitName) = "route_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = RouteDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NAliceApi.TDirective Directive = 2 [json_name = "directive", (.NYT.column_name) = "directive"];
    .NAlice.NAliceApi.TDirective FallbackDirective = 3 [json_name = "fallback_directive", (.NYT.column_name) = "fallback_directive"];
  }

  message TScenarioVoiceTriggerDirective {
    option (.NAlice.SpeechKitName) = "scenario_voice_trigger";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ScenarioVoiceTriggerDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string ScenarioID = 2 [json_name = "scenario_id", (.NYT.column_name) = "scenario_id"];
  }

  message TAction {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    string ID = 1 [json_name = "id", (.NYT.column_name) = "id"];
    repeated .NAlice.NAliceApi.TDirective Directives = 2 [json_name = "directives", (.NYT.column_name) = "directives"];
    uint64 DelayMs = 3 [json_name = "delay_ms", (.NYT.column_name) = "delay_ms"];
  }

  message TScheduledAction {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    .NAlice.TLocalIoTCapability.TAction Action = 1 [json_name = "action", (.NYT.column_name) = "action"];
    .google.protobuf.Timestamp ScheduledTimestamp = 2 [json_name = "scheduled_timestamp", (.NYT.column_name) = "scheduled_timestamp"];
  }

  message TScheduleActionDirective {
    option (.NAlice.SpeechKitName) = "schedule_action";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ScheduleActionDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TLocalIoTCapability.TAction Action = 2 [json_name = "action", (.NYT.column_name) = "action"];
    .NAlice.NAliceApi.TDirective OnScheduledActionCallback = 3 [json_name = "on_scheduled_action_callback", (.NYT.column_name) = "on_scheduled_action_callback"];
  }

  message TCancelScheduledActionDirective {
    option (.NAlice.SpeechKitName) = "cancel_scheduled_action";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = CancelScheduledActionDirectiveType;
    message TCancelAllPolicy {
    }

    message TCancelLastPolicy {
    }

    message TCancelExactPolicy {
      string ActionID = 1 [json_name = "action_id", (.NYT.column_name) = "action_id"];
    }

    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    oneof Policy {
      option (.NYT.variant_field_name) = "policy";
      .NAlice.TLocalIoTCapability.TCancelScheduledActionDirective.TCancelAllPolicy CancelAllPolicy = 2 [json_name = "cancel_all_policy", (.NYT.column_name) = "cancel_all_policy"];
      .NAlice.TLocalIoTCapability.TCancelScheduledActionDirective.TCancelLastPolicy CancelLastPolicy = 3 [json_name = "cancel_last_policy", (.NYT.column_name) = "cancel_last_policy"];
      .NAlice.TLocalIoTCapability.TCancelScheduledActionDirective.TCancelExactPolicy CancelExactPolicy = 4 [json_name = "cancel_exact_policy", (.NYT.column_name) = "cancel_exact_policy"];
    }
  }

  message TIoTEndpointsStateChangedDirective {
    option (.NAlice.SpeechKitName) = "iot_endpoints_state_changed_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IoTEndpointsStateChangedDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NAliceApi.TEndpointsStateChanged EndpointsStateChanged = 2 [json_name = "endpoints_state_changed", (.NYT.column_name) = "endpoints_state_changed"];
  }

  message TIoTEndpointsRemovedDirective {
    option (.NAlice.SpeechKitName) = "iot_endpoints_removed_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = IoTEndpointsRemovedDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.NAliceApi.TEndpointsRemoved EndpointsRemoved = 2 [json_name = "endpoints_removed", (.NYT.column_name) = "endpoints_removed"];
  }

  message TSubscribeIoTEndpointsDirective {
    option (.NAlice.SpeechKitName) = "subscribe_iot_endpoints_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SubscribeIoTEndpointsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    repeated .NAlice.NAliceApi.TUniversalEndpointSubscription Subscriptions = 2 [json_name = "subscriptions", (.NYT.column_name) = "subscriptions"];
  }

  message TUnsubscribeIoTEndpointsDirective {
    option (.NAlice.SpeechKitName) = "unsubscribe_iot_endpoints_directive";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = UnsubscribeIoTEndpointsDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    repeated .NAlice.NAliceApi.TUniversalEndpointSubscription Subscriptions = 2 [json_name = "subscriptions", (.NYT.column_name) = "subscriptions"];
  }

  message TSyncIoTUserInfoEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = SyncIoTUserInfoEventType;
    reserved "IoTUserInfoType";
    reserved 1;
  }

  message TScenarioVoiceTriggerEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = ScenarioVoiceTriggerEventType;
    string ScenarioID = 1 [json_name = "scenario_id", (.NYT.column_name) = "scenario_id"];
  }

  message TCondition {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    repeated .NAlice.TCapability.EEventType Events = 1 [json_name = "events", (.NYT.column_name) = "events"];
  }

  message TScheduledActionEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = ScheduledActionEventType;
    .NAlice.TLocalIoTCapability.TScheduledAction ScheduledAction = 1 [json_name = "scheduled_action", (.NYT.column_name) = "scheduled_action"];
  }

  message TCancelScheduledActionsEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = CancelScheduledActionsEventType;
    repeated string ActionIDs = 1 [json_name = "action_ids", (.NYT.column_name) = "action_ids"];
  }

  message TCompleteScheduledActionEvent {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.EventType) = CompleteScheduledActionEventType;
    enum EStatus {
      SUCCESS = 0;
      FAIL = 1;
    }

    string ActionID = 1 [json_name = "action_id", (.NYT.column_name) = "action_id"];
    .NAlice.TLocalIoTCapability.TCompleteScheduledActionEvent.EStatus Status = 2 [json_name = "status", (.NYT.column_name) = "status"];
  }

  enum TIoTUserInfoType {
    USER_INFO_UNKNOWN = 0;
    USER_INFO_FULL = 1;
    USER_INFO_CLIENT = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TLocalIoTCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TLocalIoTCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

