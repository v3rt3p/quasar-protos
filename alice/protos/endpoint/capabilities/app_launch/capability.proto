syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AppLaunchCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/app_launch;applaunchpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAppLaunchCapability {
  message TApp {
    string AppName = 1 [json_name = "app_name"];
    string PackageName = 2 [json_name = "package_name"];
    uint64 VersionCode = 3 [json_name = "version_code"];
    optional bool IsOpened = 4 [json_name = "is_opened"];
  }

  message TParameters {
    bool SupportsActivateOwnApp = 1 [json_name = "supports_activate_own_app"];
  }

  message TState {
    repeated .NAlice.TAppLaunchCapability.TApp InstalledAppsList = 1 [json_name = "installed_apps_list"];
    bool SupportsExtendedParametersSet = 2 [json_name = "supports_extended_parameters_set"];
  }

  message TLaunchAppDirective {
    message TAnalytics {
      message AppLaunchAnalyticsData {
        string PackageName = 1 [json_name = "package_name"];
        string VisibleName = 2 [json_name = "visible_name"];
        string OpenFrom = 3 [json_name = "open_from"];
      }

      oneof Value {
        .NAlice.TAppLaunchCapability.TLaunchAppDirective.TAnalytics.AppLaunchAnalyticsData AppLaunch = 1 [json_name = "app_launch"];
      }
    }

    string PackageToLaunch = 1 [json_name = "package_to_launch"];
    string IntentAction = 2 [json_name = "intent_action"];
    string IntentData = 3 [json_name = "intent_data"];
    string IntentExtrasJson = 4 [json_name = "intent_extras_json"];
    string ActivityToLaunch = 7 [json_name = "activity_to_launch"];
    string IntentCategory = 8 [json_name = "intent_category"];
    string IntentType = 9 [json_name = "intent_type"];
    .NAlice.TAppLaunchCapability.TLaunchAppDirective.TAnalytics Analytics = 6 [json_name = "analytics"];
    string Name = 5 [json_name = "name"];
    optional .NAlice.TAppLaunchCapability.EScreenId ScreenId = 10 [json_name = "screen_id"];
  }

  message TActivateOwnAppDirective {
    string Name = 1 [json_name = "name"];
  }

  enum EScreenId {
    SCREEN_CENTRAL = 0;
    SCREEN_CO_PILOT = 1;
    SCREEN_CEILING = 2;
    SCREEN_INSTRUMENT_PANEL = 3;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TAppLaunchCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TAppLaunchCapability.TState State = 3 [json_name = "state"];
}

