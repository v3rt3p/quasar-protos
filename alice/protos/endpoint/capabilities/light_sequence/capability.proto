syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "LightSequenceCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/light_sequence;lightsequencepb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/common.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLightSequenceCapability {
  message TParameters {
  }

  message TStep {
    double Brightness = 3 [json_name = "brightness"];
    uint32 TransitionTimeMs = 4 [json_name = "transition_time_ms"];
    uint32 DurationMs = 5 [json_name = "duration_ms"];
    oneof Color {
      .NAlice.THueAndSaturation HueSaturation = 1 [json_name = "hue_saturation"];
      uint64 TemperatureK = 2 [json_name = "temperature_k"];
    }
  }

  message TSequence {
    string Id = 1 [json_name = "id"];
    repeated .NAlice.TLightSequenceCapability.TStep Steps = 2 [json_name = "steps"];
  }

  message TState {
    .NAlice.TLightSequenceCapability.TSequence ActiveSequence = 1 [json_name = "active_sequence"];
  }

  message TStartLightSequenceDirective {
    string Name = 1000 [json_name = "name"];
    .NAlice.TLightSequenceCapability.TSequence Sequence = 1 [json_name = "sequence"];
  }

  message TStopLightSequenceDirective {
    string Name = 1000 [json_name = "name"];
    string SequenceID = 1 [json_name = "sequence_id"];
  }

  message TUpdateStateEvent {
    .NAlice.TLightSequenceCapability Capability = 1 [json_name = "capability"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TLightSequenceCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TLightSequenceCapability.TState State = 3 [json_name = "state"];
}

