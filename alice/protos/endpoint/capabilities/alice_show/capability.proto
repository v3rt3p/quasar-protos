syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceShowCapabilitiesProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_show;aliceshowpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceShowCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceShowCapabilityType;
  message TParameters {
  }

  message TState {
  }

  message TAliceShowStartDirective {
    option (.NAlice.SpeechKitName) = "alice_show_start";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = AliceShowStartDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  message TAliceShowStopDirective {
    option (.NAlice.SpeechKitName) = "alice_show_stop";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = AliceShowStopDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceShowCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceShowCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

