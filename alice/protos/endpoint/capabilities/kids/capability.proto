syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "KidsProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/kids;kidspb";

import "google/protobuf/descriptor.proto";
import "alice/protos/api/alicekit/directives/directive.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TKidsCapability {
  message TParameters {
  }

  message TState {
    enum EStateType {
      Undefined = 0;
      Awakening = 1;
    }

    .NAlice.TKidsCapability.TState.EStateType StateType = 1 [json_name = "state_type"];
  }

  message TKidsStartAwakeningDirective {
    string Name = 1000 [json_name = "name"];
    string TrackUrl = 1 [json_name = "track_url"];
    .NAlice.NAliceApi.TDirective Callback = 5 [json_name = "callback"];
    uint32 InitialPercentVolumeLevel = 2 [json_name = "initial_percent_volume_level"];
    uint32 FinalPercentVolumeLevel = 3 [json_name = "final_percent_volume_level"];
    uint32 TimeoutSeconds = 4 [json_name = "timeout_seconds"];
  }

  message TKidsStopAwakeningDirective {
    string Name = 1000 [json_name = "name"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TKidsCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TKidsCapability.TState State = 3 [json_name = "state"];
}

