syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceWatchCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_watch;alicewatchpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceWatchCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceWatchCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool SideButtonActivationEnabled = 1 [json_name = "side_button_activation_enabled", (.NYT.column_name) = "side_button_activation_enabled"];
    bool SpotterActivationEnabled = 2 [json_name = "spotter_activation_enabled", (.NYT.column_name) = "spotter_activation_enabled"];
    .NAlice.TAliceWatchCapability.EResponseMode ResponseMode = 3 [json_name = "response_mode", (.NYT.column_name) = "response_mode"];
  }

  message TSetAliceWatchStateDirective {
    option (.NAlice.SpeechKitName) = "set_alice_watch_state";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SetAliceWatchStateDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    .NAlice.TAliceWatchCapability.TState State = 2 [json_name = "state", (.NYT.column_name) = "state"];
  }

  enum EResponseMode {
    UnknownResponseMode = 0;
    TextOnly = 1;
    VoiceAndText = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceWatchCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceWatchCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

