syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "AliceVisionCapabilitiesProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/alice_vision;alicevisionpb";

import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TAliceVisionCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = AliceVisionCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    enum ECameraState {
      Undefined = 0;
      Off = 1;
      On = 2;
    }

    .NAlice.TAliceVisionCapability.TState.ECameraState CameraState = 1 [json_name = "camera_state", (.NYT.column_name) = "camera_state"];
  }

  message TSendVideoFrameCallbackDirective {
    option (.NAlice.SpeechKitName) = "send_video_frame_callback";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = SendVideoFrameCallbackDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    string Query = 1 [json_name = "query", (.NYT.column_name) = "query"];
  }

  message TShowAliceVisionScreenDirective {
    option (.NAlice.SpeechKitName) = "show_alice_vision_screen";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = ShowAliceVisionScreenDirectiveType;
    string Name = 1 [json_name = "name", (.NYT.column_name) = "name"];
    string DialogId = 2 [json_name = "dialog_id", (.NYT.column_name) = "dialog_id"];
  }

  message TAliceVisionFreeRequestsLimitExceededDirective {
    option (.NAlice.SpeechKitName) = "alice_vision_free_requests_limit_exceeded";
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    option (.NAlice.DirectiveType) = AliceVisionFreeRequestsLimitExceededDirectiveType;
    string Name = 1000 [json_name = "name", (.NYT.column_name) = "name"];
    uint32 Limit = 1 [json_name = "limit", (.NYT.column_name) = "limit"];
    uint64 ValidUntilTimestamp = 2 [json_name = "valid_until_timestamp", (.NYT.column_name) = "valid_until_timestamp"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TAliceVisionCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TAliceVisionCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

