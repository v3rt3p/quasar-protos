syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "MultiroomCapabilityProto";
option java_multiple_files = true;
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/multiroom;multiroompb";

import "alice/protos/endpoint/capability.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TMultiroomCapability {
  option (.NYT.default_field_flags) = SERIALIZATION_YT;
  option (.NAlice.CapabilityType) = MultiroomCapabilityType;
  message TParameters {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    bool SupportsDirectivesAttachment = 1 [json_name = "supports_directives_attachment", (.NYT.column_name) = "supports_directives_attachment"];
  }

  message TSessionDescriptor {
    optional string MasterDeviceId = 1 [json_name = "master_device_id", (.NYT.column_name) = "master_device_id"];
    optional string MultiroomToken = 2 [json_name = "multiroom_token", (.NYT.column_name) = "multiroom_token"];
    optional int64 StartTimestampMs = 3 [json_name = "start_timestamp_ms", (.NYT.column_name) = "start_timestamp_ms"];
  }

  message TState {
    option (.NYT.default_field_flags) = SERIALIZATION_YT;
    optional .NAlice.TMultiroomCapability.ERole Role = 1 [json_name = "role", (.NYT.column_name) = "role"];
    optional .NAlice.TMultiroomCapability.TSessionDescriptor CurrentSession = 2 [json_name = "current_session", (.NYT.column_name) = "current_session"];
  }

  enum ERole {
    ROLE_NONE = 0;
    ROLE_MASTER = 1;
    ROLE_SLAVE = 2;
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta", (.NYT.column_name) = "meta"];
  .NAlice.TMultiroomCapability.TParameters Parameters = 2 [json_name = "parameters", (.NYT.column_name) = "parameters"];
  .NAlice.TMultiroomCapability.TState State = 3 [json_name = "state", (.NYT.column_name) = "state"];
}

