syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.capabilities";
option java_outer_classname = "BugreportCapabilityProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/capabilities/bugreport;bugreportpb";

import "google/protobuf/descriptor.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/extensions/extensions.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TBugreportCapability {
  message TParameters {
  }

  message TState {
  }

  message TSendBugReport {
    message TAnalytics {
    }

    string UserMessage = 1 [json_name = "user_message"];
    string BugreportId = 2 [json_name = "bugreport_id"];
    .NAlice.TBugreportCapability.TSendBugReport.TAnalytics Analytics = 999 [json_name = "analytics"];
    string Name = 1000 [json_name = "name"];
  }

  message TLegacySendBugReport {
    string Name = 1 [json_name = "name"];
    string RequestId = 2 [json_name = "id"];
  }

  .NAlice.TCapability.TMeta Meta = 1 [json_name = "meta"];
  .NAlice.TBugreportCapability.TParameters Parameters = 2 [json_name = "parameters"];
  .NAlice.TBugreportCapability.TState State = 3 [json_name = "state"];
}

