syntax = "proto3";

package NAlice;

option java_package = "ru.yandex.alice.protos.endpoint.events";
option java_outer_classname = "EventsProto";
option go_package = "a.yandex-team.ru/alice/protos/endpoint/events;eventspb";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "alice/protos/api/source/source.proto";
import "alice/protos/endpoint/endpoint.proto";
import "alice/protos/endpoint/capability.proto";
import "alice/protos/endpoint/events/any_capability_event.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TCapabilityEvent {
  reserved "IsEnvironmentStateDependant";
  reserved 5;
  message TEnvironmentStateMode {
    bool IncludeLocalEndpoint = 1 [json_name = "include_local_endpoint"];
    bool IncludeEmbeddedEndpoints = 2 [json_name = "include_embedded_endpoints"];
    bool IncludeRemoteEndpoints = 3 [json_name = "include_remote_endpoints"];
    bool IncludeRemoteCapabilities = 4 [json_name = "include_remote_capabilities"];
  }

  .google.protobuf.Timestamp Timestamp = 1 [json_name = "timestamp"];
  .google.protobuf.Any Event = 2 [json_name = "event"];
  bool IsLocal = 3 [json_name = "is_local"];
  bool NonRetryable = 4 [json_name = "non_retryable"];
  .NAlice.TCapabilityEvent.TEnvironmentStateMode EnvironmentStateMode = 6 [json_name = "environment_state_mode"];
  .NAlice.NAliceApi.TSourceInfo SourceInfo = 7 [json_name = "source_info"];
  .NAlice.TAnyCapabilityEventHolder AnyEvent = 8 [json_name = "any_event"];
}

message TEndpointCapabilityEvents {
  string EndpointId = 1 [json_name = "endpoint_id"];
  repeated .NAlice.TCapabilityEvent Events = 2 [json_name = "events"];
}

message TEndpointEvents {
  string EndpointId = 1 [json_name = "endpoint_id"];
  .NAlice.TEndpoint.TStatus EndpointStatus = 2 [json_name = "endpoint_status"];
  repeated .NAlice.TCapabilityEvent CapabilityEvents = 3 [json_name = "capability_events"];
  string EndpointPlatform = 4 [json_name = "endpoint_platform"];
}

message TEndpointEventsBatch {
  repeated .NAlice.TEndpointEvents Batch = 1 [json_name = "batch"];
}

message TTypedCapabilityEvent {
  .NAlice.TCapabilityEvent Event = 1 [json_name = "event"];
  .NAlice.TCapability.EEventType EventType = 2 [json_name = "event_type"];
}

