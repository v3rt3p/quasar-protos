syntax = "proto3";

package NAlice.NFeaturesLimiter.NProto.NApi;

option java_package = "ru.yandex.alice.cuttlefish.services.features_limiter.proto.api";
option go_package = "a.yandex-team.ru/alice/cuttlefish/services/features_limiter/proto/api";

import "alice/cuttlefish/services/features_limiter/proto/api/dynamic_quota.proto";
import "alice/megamind/protos/common/experiments/experiments.proto";
import "alice/protos/endpoint/capabilities/alice_limits/capability.proto";
import "alice/ydb_orm/client/proto/types/object.proto";
import "yt/yt_proto/yt/formats/extension.proto";

message TLimitedFeature {
  .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 1;
}

message TSettings {
  bool DoNotAcquireQuota = 1;
  bool ForceBlockingModeClientFlag = 2;
  bool ForceTooManyRequestsClientFlag = 3;
  bool ForceTooManyRequestsExceptTextGenerationBaseClientFlag = 4;
  bool AddCurrentLoadInfo = 5;
  bool ForceAllowClientFlag = 6;
}

message TDropPercentInfo {
  bool Dropped = 1 [json_name = "dropped"];
  uint32 DropPercent = 2 [json_name = "drop_percent"];
  uint32 GeneratedRandomPercent = 3 [json_name = "generated_random_percent"];
}

message TCanPassRequest {
  reserved "SendBanners";
  reserved 3;
  string UserId = 1;
  .NAlice.NFeaturesLimiter.NProto.NApi.EUserClass UserClass = 2;
}

message TGProxyRequest {
  string LimitedFeature = 1 [json_name = "limited_feature"];
  string DoNotAcquireQuota = 2 [json_name = "do_not_acquire_quota"];
  string RequestId = 3 [json_name = "request_id"];
  bool SendBanners = 4 [json_name = "send_banners"];
}

message TAddonQuota {
  uint64 RequestsUsed = 1 [json_name = "requests_used"];
  uint64 RequestsLimit = 2 [json_name = "requests_limit"];
  .NYdbOrm.NClient.NProto.TYdbTimestamp MinFirstRequestTime = 4 [json_name = "min_first_request_timestamp"];
  uint64 EndTimeSeconds = 5 [json_name = "end_time_seconds"];
  optional uint64 RefreshTimestampSeconds = 3 [json_name = "refresh_timestamp_seconds"];
}

message TUserQuota {
  uint64 RequestsUsed = 1 [json_name = "requests_used"];
  uint64 RequestsLimit = 2 [json_name = "requests_limit"];
  .NYdbOrm.NClient.NProto.TYdbTimestamp MinFirstRequestTime = 4 [json_name = "min_first_request_timestamp"];
  string UserId = 5 [json_name = "user_id"];
  uint64 EndTimeSeconds = 6 [json_name = "end_time_seconds"];
  optional uint64 RefreshTimestampSeconds = 3 [json_name = "refresh_timestamp_seconds"];
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TAddonQuota AddonQuota = 7 [json_name = "addon_quota"];
}

message TCurrentLoadInfo {
  message TPriorityLoad {
    .NAlice.NFeaturesLimiter.NProto.NApi.EPriority Priority = 1 [json_name = "priority"];
    uint64 Value = 2 [json_name = "value"];
  }

  uint64 TotalFeatureQuota = 1 [json_name = "total_feature_quota"];
  uint64 RpsLimiterRequestsSum = 2 [json_name = "rps_limiter_requests_sum"];
  uint64 IntervalMilliseconds = 3 [json_name = "interval_milliseconds"];
  repeated .NAlice.NFeaturesLimiter.NProto.NApi.TCurrentLoadInfo.TPriorityLoad LoadByPriorities = 4 [json_name = "load_by_priorities"];
}

message TCanPassResponse {
  .NAlice.NFeaturesLimiter.NProto.NApi.EDecision Decision = 1 [json_name = "decision"];
  .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature Feature = 2 [json_name = "feature"];
  .NAlice.NFeaturesLimiter.NProto.NApi.EUserClass UserClass = 3 [json_name = "user_class"];
  .NAlice.NFeaturesLimiter.NProto.NApi.ERequestType RequestType = 4 [json_name = "request_type"];
  .NAlice.NFeaturesLimiter.NProto.NApi.EPriority Priority = 5 [json_name = "priority"];
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TUserQuota UserQuota = 6 [json_name = "user_quota"];
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TDropPercentInfo DropPercentInfo = 7 [json_name = "drop_percent_info"];
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TCurrentLoadInfo CurrentLoadInfo = 8 [json_name = "current_load_info"];
  optional .NAlice.TAliceLimitsCapability.TLimitUpdatedDirective LimitUpdateBannerDirective = 9 [json_name = "limit_update_banner_directive"];
  optional uint64 IncrementValue = 10 [json_name = "increment_value"];
  optional string RequestId = 11 [json_name = "request_id", (.NYT.column_name) = "request_id"];
}

message TMaxAvailablePriorityRequest {
  bool Available = 1;
  .NAlice.NFeaturesLimiter.NProto.NApi.EPriority Priority = 2;
  .NAlice.NFeaturesLimiter.NProto.NApi.ERequestType RequestType = 3;
  .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 6;
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TUserQuota UserQuota = 4;
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TDropPercentInfo DropPercentInfo = 5;
}

message TLocation {
  string Location = 1;
}

message TSuccess {
}

message TUserQuotaInfo {
  message TAddon {
    uint64 EndTimeSeconds = 1;
    optional .NAlice.NFeaturesLimiter.NProto.NApi.EAddonsScope AddonScope = 2;
  }

  repeated .NAlice.NFeaturesLimiter.NProto.NApi.TUserQuotaInfo.TAddon Addons = 2;
  optional uint64 EndTimeSeconds = 1;
}

message TFeatureLimiterRequest {
  string UserId = 1;
  .NAlice.NFeaturesLimiter.NProto.NApi.EUserClass UserClass = 2;
  .NAlice.TExperimentsProto Experiments = 3;
  .NAlice.NFeaturesLimiter.NProto.NApi.TLimitedFeature LimitedFeature = 4;
  uint32 RpsPriorityIncrease = 10;
  optional .NAlice.NFeaturesLimiter.NProto.NApi.TUserQuotaInfo UserQuotaInfo = 5;
  optional bool DoNotAcquireQuota = 6;
  optional string RequestId = 7;
  optional bool SendBanners = 8;
  optional uint64 IncrementValue = 9;
}

message TTryAddInflightRequestRequest {
  string LimitedFeature = 1 [json_name = "limited_feature"];
  string RequestId = 2 [json_name = "request_id"];
  uint64 TtlMicroseconds = 3 [json_name = "ttl_microseconds"];
}

message TUpdateInflightRequestRequest {
  string LimitedFeature = 1 [json_name = "limited_feature"];
  string RequestId = 2 [json_name = "request_id"];
  uint64 TtlMicroseconds = 3 [json_name = "ttl_microseconds"];
}

message TRequestId {
  string RequestId = 1;
}

message TTtl {
  uint64 Microseconds = 1;
}

message TEndTimes {
  uint64 UserQuotaEndTime = 1;
  optional uint64 AddonEndTime = 2;
}

message TRpsLimiter {
  uint64 IntervalMilliseconds = 1;
}

message TIncrementValue {
  uint64 IncrementValue = 1;
}

message TGetDecisionRequest {
  string RequestId = 1 [json_name = "request_id"];
  optional .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 2 [json_name = "limited_feature"];
}

message TGetDecisionResponse {
  string RequestId = 1 [json_name = "request_id"];
  repeated .NAlice.NFeaturesLimiter.NProto.NApi.TCanPassResponse Responses = 2 [json_name = "responses"];
}

message TFeaturesContext {
  message TFeatureContext {
    .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 1;
    .NAlice.NFeaturesLimiter.NProto.NApi.TEndTimes EndTimes = 2;
    string RequestId = 3;
    bool SendBanners = 4;
    uint64 IncrementValue = 5;
    .NAlice.NFeaturesLimiter.NProto.NApi.TSettings Settings = 6;
    string UserId = 7;
    .NAlice.NFeaturesLimiter.NProto.NApi.EUserClass UserClass = 8;
    repeated string LoadLocations = 9;
    uint32 RpsPriorityIncrease = 10;
  }

  repeated .NAlice.NFeaturesLimiter.NProto.NApi.TFeaturesContext.TFeatureContext Features = 1;
}

message TReportBackendStateRequest {
  .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 1;
  uint64 ObservedAtTimestampMilliseconds = 2;
  uint64 Backlog = 3;
  string Location = 4;
  uint64 RequestsQuota = 5;
  oneof Arguments {
    .NAlice.NFeaturesLimiter.NProto.NApi.TStaticArguments StaticArguments = 6;
    .NAlice.NFeaturesLimiter.NProto.NApi.TPidArguments PidArguments = 7;
    .NAlice.NFeaturesLimiter.NProto.NApi.TPlainArguments PlainArguments = 8;
  }
}

message TResetUsedQuotaRequest {
  string UserId = 1;
  .NAlice.NFeaturesLimiter.NProto.NApi.ELimitedFeature LimitedFeature = 2;
}

message TResetUsedQuotaResponse {
  bool QuotaReset = 1 [json_name = "quota_reset"];
}

