syntax = "proto2";

package pb;

option java_package = "com.google.protobuf";
option java_outer_classname = "JavaFeaturesProto";

import "google/protobuf/descriptor.proto";

extend .google.protobuf.FeatureSet {
  optional .pb.JavaFeatures java = 1001;
}
message JavaFeatures {
  reserved 6;
  message NestInFileClassFeature {
    reserved 1 to max;
    enum NestInFileClass {
      NEST_IN_FILE_CLASS_UNKNOWN = 0;
      NO = 1;
      YES = 2;
      LEGACY = 3 [feature_support = { edition_introduced:EDITION_2024  edition_removed:EDITION_2024 }];
    }

  }

  enum Utf8Validation {
    UTF8_VALIDATION_UNKNOWN = 0;
    DEFAULT = 1;
    VERIFY = 2;
  }

  optional bool legacy_closed_enum = 1 [json_name = "legacyClosedEnum", retention = RETENTION_RUNTIME, targets = TARGET_TYPE_FIELD, targets = TARGET_TYPE_FILE, edition_defaults = { edition:EDITION_LEGACY  value:"true" }, edition_defaults = { edition:EDITION_PROTO3  value:"false" }, feature_support = { edition_introduced:EDITION_2023  edition_deprecated:EDITION_2023  deprecation_warning:"The legacy closed enum behavior in Java is deprecated and is scheduled to be removed in edition 2025.  See http://protobuf.dev/programming-guides/enum/#java for more information." }];
  optional .pb.JavaFeatures.Utf8Validation utf8_validation = 2 [json_name = "utf8Validation", retention = RETENTION_RUNTIME, targets = TARGET_TYPE_FIELD, targets = TARGET_TYPE_FILE, edition_defaults = { edition:EDITION_LEGACY  value:"DEFAULT" }, feature_support = { edition_introduced:EDITION_2023  edition_deprecated:EDITION_2024  deprecation_warning:"The Java-specific utf8 validation feature is deprecated and is scheduled to be removed in edition 2025.  Utf8 validation behavior should use the global cross-language utf8_validation feature." }];
  optional bool large_enum = 3 [json_name = "largeEnum", retention = RETENTION_RUNTIME, targets = TARGET_TYPE_ENUM, targets = TARGET_TYPE_FILE, edition_defaults = { edition:EDITION_LEGACY  value:"false" }, feature_support = { edition_introduced:EDITION_2024 }];
  optional bool use_old_outer_classname_default = 4 [json_name = "useOldOuterClassnameDefault", retention = RETENTION_RUNTIME, targets = TARGET_TYPE_FILE, edition_defaults = { edition:EDITION_LEGACY  value:"true" }, edition_defaults = { edition:EDITION_2024  value:"false" }, feature_support = { edition_introduced:EDITION_2024  edition_removed:EDITION_2024 }];
  optional .pb.JavaFeatures.NestInFileClassFeature.NestInFileClass nest_in_file_class = 5 [json_name = "nestInFileClass", retention = RETENTION_RUNTIME, targets = TARGET_TYPE_MESSAGE, targets = TARGET_TYPE_ENUM, targets = TARGET_TYPE_SERVICE, edition_defaults = { edition:EDITION_LEGACY  value:"LEGACY" }, edition_defaults = { edition:EDITION_2024  value:"NO" }, feature_support = { edition_introduced:EDITION_2024 }];
}

