syntax = "proto2";

package NAsr.NProto;

import "google/protobuf/descriptor.proto";

message TOnDeviceHypothesis {
  repeated int32 TokenIds = 1;
}

message TAdditionalFeatures {
  optional int32 Version = 1;
  repeated int32 IntFeatures = 2;
  repeated float FloatFeatures = 3;
  optional int32 FeaturesVersion = 4;
}

message TConfidence {
  optional float Score = 1;
  optional bool IsConfident = 2;
}

message TDiagnosticInfo {
  repeated float LoadAverage = 1;
  optional uint64 Rss = 2;
  optional uint32 EnqueuedSoundMs = 3;
  optional uint32 EnqueuedOutgoingPartials = 4;
}

message TRichOutput {
  optional .NAsr.NProto.TOnDeviceHypothesis TopHypo = 2;
  optional .NAsr.NProto.TAdditionalFeatures Features = 3;
  optional int32 AsrTimeSpentMs = 4;
  optional int32 NumProcessedSamples = 5;
  optional int32 Version = 6;
  optional string SessionTopHypoText = 7;
  optional bool SessionIsEou = 8;
  optional .NAsr.NProto.TConfidence Confidence = 9;
  optional .NAsr.NProto.TDiagnosticInfo DiagnosticInfo = 10;
}

